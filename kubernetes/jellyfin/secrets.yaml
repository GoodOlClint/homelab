# Both land as Secrets deploy.sh reads to drive the Jellyfin API; the pod itself takes nothing from the environment.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: jellyfin, namespace: jellyfin}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /jellyfin}
  managedKubeSecretReferences:
    - secretName: jellyfin-admin
      secretNamespace: jellyfin
      template:
        data:
          ADMIN_PASSWORD: "{{ .admin_password.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: jellyfin-ldap, namespace: jellyfin}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /authentik-ext}
  managedKubeSecretReferences:
    - secretName: jellyfin-ldap
      secretNamespace: jellyfin
      template:
        data:
          LDAP_BIND_PASSWORD: "{{ .ldap_bind_password.Value }}"
