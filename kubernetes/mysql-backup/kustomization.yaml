apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The pg-backup shape for MySQL (ADR 0065): a tree includes `../mysql-backup` and supplies NS MYSQL_HOST MYSQL_SECRET MYSQL_SECRET_KEY
# (a Secret key holding the root password) BACKUP_ID SCHEDULE (and optionally KEEP_DAYS, default 30) through its Flux Kustomization's postBuild.substitute.
resources: [cronjob.yaml]
