apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: cert-manager, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/cert-manager
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-cert-manager
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: cert-manager, namespace: cert-manager}
