apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: ceph-csi, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/ceph-csi
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-ceph-csi
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: ceph-csi-rbd, namespace: ceph-csi}
