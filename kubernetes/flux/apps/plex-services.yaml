apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: plex-services, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/plex-services
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-plex-services
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
    substitute: {NS: plex-services, PG_USER: qstick, PG_SECRET: plex-services-secrets, BACKUP_ID: plex-services-postgres, SCHEDULE: "0 2 * * *"}
