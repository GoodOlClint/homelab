apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: jellyfin, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/jellyfin
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-jellyfin
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
