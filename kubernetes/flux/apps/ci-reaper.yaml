apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: ci-reaper, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/ci-reaper
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-ci-reaper
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
