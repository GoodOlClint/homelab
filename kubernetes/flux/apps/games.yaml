apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: games, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/games
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-games
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
  healthChecks:
    - {apiVersion: apps/v1, kind: Deployment, name: valheim, namespace: games}
