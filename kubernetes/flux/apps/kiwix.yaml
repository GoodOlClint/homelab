apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: kiwix, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/kiwix
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-kiwix
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
  healthChecks:
    - {apiVersion: apps/v1, kind: Deployment, name: kiwix, namespace: kiwix}
