apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: static-viewer, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/static-viewer
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-static-viewer
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
  healthChecks:
    - {apiVersion: apps/v1, kind: Deployment, name: static-viewer, namespace: static-viewer}
