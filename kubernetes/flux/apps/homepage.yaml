apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: homepage, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/homepage
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-homepage
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
  healthChecks:
    - {apiVersion: apps/v1, kind: Deployment, name: homepage, namespace: homepage}
