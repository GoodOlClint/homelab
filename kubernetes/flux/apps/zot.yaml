apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: zot, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/zot
  prune: false
  sourceRef: {kind: GitRepository, name: homelab}
  serviceAccountName: flux-zot
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-bindings}]
