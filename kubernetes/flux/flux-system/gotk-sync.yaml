# Flux reads this public repository with no credential (ADR 0048). The seed play and the Ansible tail own
# what is not in git; every ${VAR} in the trees is filled from the cluster-bindings ConfigMap.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: homelab, namespace: flux-system}
spec:
  interval: 5m
  url: https://github.com/GoodOlClint/homelab.git
  ref: {branch: main}
  ignore: |
    /*
    !/kubernetes/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: flux-system, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/flux
  prune: true
  sourceRef: {kind: GitRepository, name: homelab}
