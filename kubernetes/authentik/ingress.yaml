# Internal realm only: the login host, and the ForwardAuth middleware every protected Ingress references as
# `authentik-forward-auth@kubernetescrd` (Traefik runs with allowCrossNamespace for exactly this).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: authentik, namespace: ${NS}}
spec:
  ingressClassName: traefik
  rules:
    - host: ${HOST}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: authentik-server, port: {number: 80}}}}]}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: forward-auth, namespace: ${NS}}
spec:
  forwardAuth:
    address: http://authentik-server.${NS}.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders: [X-authentik-username, X-authentik-groups, X-authentik-entitlements, X-authentik-email, X-authentik-name, X-authentik-uid, X-authentik-jwt, X-authentik-meta-jwks, X-authentik-meta-outpost, X-authentik-meta-provider, X-authentik-meta-app, X-authentik-meta-version]
