# PBS credentials for the pg-backup CronJob; PBS_REPOSITORY is composed by deploy.sh from the inventory.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: pbs, namespace: ${NS}}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /shared}
  managedKubeSecretReferences:
    - secretName: pbs-secrets
      secretNamespace: ${NS}
      template:
        data:
          PBS_PASSWORD: "{{ .pbs_backup_token.Value }}"
          PBS_FINGERPRINT: "{{ .pbs_fingerprint.Value }}"
