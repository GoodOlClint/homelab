# Internal realm: Traefik forward-auth (domain mode, one cookie on the service domain) through the embedded
# outpost, plus one OIDC provider per native consumer. Client secrets arrive as env from the InfisicalSecret.
version: 1
metadata: {name: homelab-internal}
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: forward-auth
    identifiers: {name: traefik-forward-auth}
    attrs:
      mode: forward_domain
      external_host: https://${HOST}
      cookie_domain: ${DOMAIN}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers: {slug: traefik-forward-auth}
    attrs: {name: Traefik forward auth, provider: !KeyOf forward-auth}
  - model: authentik_outposts.outpost
    identifiers: {managed: goauthentik.io/outposts/embedded}
    attrs:
      providers: [!KeyOf forward-auth]
      config: {authentik_host: https://${HOST}, authentik_host_browser: https://${HOST}}

  # Passkey login: the identification stage's `passwordless_flow` puts a "Use a security key" button on
  # the login page, and the discoverable credential identifies the user, so no username or password is
  # asked for. `not_configured_action: deny` and `webauthn_user_verification: required` are what make the
  # stage passwordless rather than a second factor. The shipped default-authentication-flow already skips
  # its MFA stage when auth_method == auth_webauthn_pwl, so a passkey login is one prompt, not two.
  - model: authentik_flows.flow
    id: passwordless-flow
    identifiers: {slug: default-authentication-flow-passwordless}
    attrs: {designation: authentication, name: Passkey login, title: Sign in with your passkey, authentication: none}
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: passwordless-validation
    identifiers: {name: passwordless-webauthn-validation}
    attrs: {device_classes: [webauthn], not_configured_action: deny, webauthn_user_verification: required}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf passwordless-flow, stage: !KeyOf passwordless-validation, order: 10}
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passwordless-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 20
  # user_fields is repeated because the serializer's validator reads the incoming attrs, not the stored
  # instance, and rejects a partial update that leaves it unset.
  - model: authentik_stages_identification.identificationstage
    identifiers: {name: default-authentication-identification}
    attrs: {user_fields: [email, username], passwordless_flow: !KeyOf passwordless-flow}

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana
    identifiers: {name: grafana}
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      redirect_uris: [{matching_mode: strict, url: "https://grafana.${DOMAIN}/login/generic_oauth"}]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: grafana}
    attrs: {name: Grafana, provider: !KeyOf grafana, meta_launch_url: "https://grafana.${DOMAIN}"}

  - model: authentik_providers_oauth2.oauth2provider
    id: portainer
    identifiers: {name: portainer}
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: portainer
      client_secret: !Env PORTAINER_OIDC_CLIENT_SECRET
      redirect_uris: [{matching_mode: regex, url: '^https://control\.${DOMAIN_RE}:9443/?$'}]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: portainer}
    attrs: {name: Portainer, provider: !KeyOf portainer}

  - model: authentik_providers_oauth2.oauth2provider
    id: meshcentral
    identifiers: {name: meshcentral}
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: meshcentral
      client_secret: !Env MESHCENTRAL_OIDC_CLIENT_SECRET
      redirect_uris: [{matching_mode: regex, url: '^https://control\.${DOMAIN_RE}/auth-oidc-callback$'}]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: meshcentral}
    attrs: {name: MeshCentral, provider: !KeyOf meshcentral}

  - model: authentik_providers_oauth2.oauth2provider
    id: pdm
    identifiers: {name: pdm}
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: pdm
      client_secret: !Env PDM_OIDC_CLIENT_SECRET
      redirect_uris: [{matching_mode: regex, url: '^https://pdm\.${DOMAIN_RE}:8443/?$'}]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: pdm}
    attrs: {name: Proxmox Datacenter Manager, provider: !KeyOf pdm}

  - model: authentik_providers_oauth2.oauth2provider
    id: pve
    identifiers: {name: pve}
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: pve
      client_secret: !Env PVE_OIDC_CLIENT_SECRET
      redirect_uris: [{matching_mode: regex, url: '^https://[a-z0-9-]+\.${DOMAIN_RE}:8006/?$'}]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: pve}
    attrs: {name: Proxmox VE, provider: !KeyOf pve}

  - model: authentik_providers_oauth2.oauth2provider
    id: pbs
    identifiers: {name: pbs}
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: pbs
      client_secret: !Env PBS_OIDC_CLIENT_SECRET
      redirect_uris: [{matching_mode: regex, url: '^https://proxmox-backup\.${DOMAIN_RE}:8007/?$'}]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: pbs}
    attrs: {name: Proxmox Backup Server, provider: !KeyOf pbs}


  - model: authentik_providers_oauth2.oauth2provider
    id: synology
    identifiers: {name: synology}
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: synology
      client_secret: !Env SYNOLOGY_OIDC_CLIENT_SECRET
      # DSM registers itself in DNS by its own device name over DHCP DDNS; there is no static
      # alias, so the redirect tracks that name. (?i) because DSM reports mixed case.
      redirect_uris:
        - {matching_mode: strict, url: "https://ds1821plus.${DOMAIN}:5001"}
        - {matching_mode: strict, url: "http://ds1821plus.${DOMAIN}:5000"}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: synology}
    attrs: {name: Synology DSM, provider: !KeyOf synology}

  # Home Assistant is NOT fleet-managed: its hostname and scheme are unknown here, so the
  # hass-oidc-auth is the settled integration (2026-09-09); strict URI per the
  # redirect-anchoring rule. `groups` reaches HA through the profile scope.
  - model: authentik_providers_oauth2.oauth2provider
    id: homeassistant
    identifiers: {name: homeassistant}
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: homeassistant
      client_secret: !Env HOMEASSISTANT_OIDC_CLIENT_SECRET
      redirect_uris:
        - {matching_mode: strict, url: "https://homeassistant.${DOMAIN}:8123/auth/oidc/callback"}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: homeassistant}
    attrs: {name: Home Assistant, provider: !KeyOf homeassistant}

  # pfSense webConfigurator SSO (ADR 0043). SAML2 because pfSense has no OIDC; the package is
  # pfrest/pfSense-pkg-saml2-auth (generic OneLogin php-saml). NameID carries the username and the
  # managed Groups mapping emits http://schemas.xmlsoap.org/claims/Group — the exact attribute name
  # pfSense reads for privilege assignment. The application is bound to `pfsense-admins`: an
  # assertion with no groups makes pfSense silently inherit a same-named LOCAL account's privileges,
  # so nobody outside the group may reach the provider at all.
  - model: authentik_core.group
    id: pfsense-admins
    identifiers: {name: pfsense-admins}
  - model: authentik_providers_saml.samlprovider
    id: pfsense
    identifiers: {name: pfsense}
    attrs:
      acs_url: "https://pfsense.${DOMAIN}/saml2_auth/sso/acs/"
      audience: "https://pfsense.${DOMAIN}/saml2_auth/sso/metadata/"
      sp_binding: post
      sign_assertion: true
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_kp: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      name_id_mapping: !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/username]]
      property_mappings:
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/username]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/name]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/groups]]
  - model: authentik_core.application
    id: pfsense-app
    identifiers: {slug: pfsense}
    attrs: {name: pfSense, provider: !KeyOf pfsense, meta_launch_url: "https://pfsense.${DOMAIN}"}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf pfsense-app, group: !KeyOf pfsense-admins, order: 0}
    attrs: {enabled: true}
