server {
    listen 8080;
    server_tokens off;
    autoindex off;
    root /usr/share/nginx/html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
