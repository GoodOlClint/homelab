apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-viewer
  namespace: static-viewer
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: static-viewer}}
  template:
    metadata: {labels: {app: static-viewer}}
    spec:
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101}
      containers:
        - name: nginx
          image: ${REGISTRY}/docker.io/nginxinc/nginx-unprivileged:stable-alpine
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: site, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 30}
      volumes:
        - {name: site, persistentVolumeClaim: {claimName: static-viewer, readOnly: true}}
        - {name: conf, configMap: {name: static-viewer-nginx}}
---
apiVersion: v1
kind: Service
metadata: {name: static-viewer, namespace: static-viewer}
spec: {selector: {app: static-viewer}, ports: [{port: 8080}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: static-viewer
  namespace: static-viewer
  annotations: {traefik.ingress.kubernetes.io/router.middlewares: traefik-forward-auth@kubernetescrd}
spec:
  ingressClassName: traefik
  rules:
    - host: viewer.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: static-viewer, port: {number: 8080}}}}]}
