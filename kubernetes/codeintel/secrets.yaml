apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: codeintel, namespace: codeintel}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /codeintel}
  managedKubeSecretReferences:
    - secretName: codeintel-secrets
      secretNamespace: codeintel
      template:
        data:
          POSTGRES_PASSWORD: "{{ .postgres_password.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: pbs, namespace: codeintel}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /shared}
  managedKubeSecretReferences:
    - secretName: pbs-secrets
      secretNamespace: codeintel
      template:
        data:
          PBS_PASSWORD: "{{ .pbs_backup_token.Value }}"
