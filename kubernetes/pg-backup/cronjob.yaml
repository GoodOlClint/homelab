apiVersion: batch/v1
kind: CronJob
metadata: {name: pg-backup, namespace: "${NS}"}
spec:
  schedule: "${SCHEDULE}"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          initContainers:
            - name: pgdump
              image: ${REGISTRY}/docker.io/library/postgres:17
              imagePullPolicy: IfNotPresent
              resources: {requests: {cpu: 50m, memory: 128Mi}}
              command: [sh, -ec, 'f=/backups/pg_dumpall-$(date +%F).sql.gz; pg_dumpall -h postgres -U ${PG_USER} | gzip > "$f.tmp" && mv "$f.tmp" "$f"; find /backups -name "pg_dumpall-*.sql.gz" -mtime +30 -delete']
              env:
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: "${PG_SECRET}", key: POSTGRES_PASSWORD}}}
              volumeMounts:
                - {name: backups, mountPath: /backups, subPath: data}
          containers:
            - name: pbs-push
              image: ${REGISTRY}/homelab/proxmox-backup-client:trixie
              imagePullPolicy: IfNotPresent
              resources: {requests: {cpu: 50m, memory: 128Mi}}
              # The trailing snapshot list is the verification signal: judge this lane by snapshot recency in the log, never by exit code.
              command: [sh, -ec, 'proxmox-backup-client namespace create databases 2>/dev/null || true; proxmox-backup-client backup ${BACKUP_ID}.pxar:/backups --ns databases --backup-id ${BACKUP_ID}; proxmox-backup-client snapshot list --ns databases | tail -5']
              env:
                - {name: PBS_REPOSITORY, value: "${PBS_REPOSITORY}"}
                - {name: PBS_PASSWORD, valueFrom: {secretKeyRef: {name: pbs-secrets, key: PBS_PASSWORD}}}
              volumeMounts:
                - {name: backups, mountPath: /backups, subPath: data}
          volumes:
            - {name: backups, persistentVolumeClaim: {claimName: backups}}
