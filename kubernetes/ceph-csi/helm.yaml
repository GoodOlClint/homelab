apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: ceph-csi, namespace: ceph-csi}
spec: {interval: 12h, url: https://ceph.github.io/csi-charts}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: ceph-csi-rbd, namespace: ceph-csi}
spec:
  interval: 30m
  chart:
    spec:
      chart: ceph-csi-rbd
      version: "3.17.1"
      sourceRef: {kind: HelmRepository, name: ceph-csi}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  values:
    csiConfig:
      - clusterID: "${CEPH_FSID}"
        monitors: ${CEPH_MONITORS_JSON}
    nodeplugin:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    provisioner:
      replicaCount: 2
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
