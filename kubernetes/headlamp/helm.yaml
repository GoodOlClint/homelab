apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: headlamp, namespace: headlamp}
spec: {interval: 12h, url: https://kubernetes-sigs.github.io/headlamp/}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: headlamp, namespace: headlamp}
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef: {kind: HelmRepository, name: headlamp}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  values:
    image:
      registry: ${REGISTRY}/ghcr.io
      repository: headlamp-k8s/headlamp
    config:
      unsafeUseServiceAccountToken: true
    clusterRoleBinding:
      create: true
      clusterRoleName: view
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: traefik-forward-auth@kubernetescrd
      hosts:
      - host: headlamp.${DOMAIN}
        paths:
        - path: /
          type: Prefix
