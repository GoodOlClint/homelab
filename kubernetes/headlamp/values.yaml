image:
  registry: ${REGISTRY}/ghcr.io
  repository: headlamp-k8s/headlamp
config:
  # No per-user login: the Ingress carries authentik forward-auth, which is the
  # auth-proxy case the chart documents as the only safe use of this flag.
  unsafeUseServiceAccountToken: true
clusterRoleBinding:
  create: true
  clusterRoleName: view
resources: {requests: {cpu: 50m, memory: 128Mi}}
ingress:
  enabled: true
  ingressClassName: traefik
  annotations: {traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd}
  hosts:
    - host: ${HOST}
      paths: [{path: /, type: Prefix}]
