          HOMEPAGE_VAR_LIDARR_KEY: "{{ .lidarr_api_key.Value }}"
          HOMEPAGE_VAR_PROWLARR_KEY: "{{ .prowlarr_api_key.Value }}"
          HOMEPAGE_VAR_BAZARR_KEY: "{{ .bazarr_api_key.Value }}"
          HOMEPAGE_VAR_TAUTULLI_KEY: "{{ .tautulli_api_key.Value }}"
          HOMEPAGE_VAR_SABNZBD_KEY: "{{ .sabnzbd_api_key.Value }}"
          HOMEPAGE_VAR_SEERR_KEY: "{{ .seerr_api_key.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: plex, namespace: homepage}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /plex}
