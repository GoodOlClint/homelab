# One InfisicalSecret per source folder (ADR 0035); template.data renames keys to HOMEPAGE_VAR_*.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: homepage, namespace: homepage}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /homepage}
  managedKubeSecretReferences:
    - secretName: homepage-homepage
      secretNamespace: homepage
      template:
        data:
          HOMEPAGE_VAR_ADGUARD_USERNAME: "{{ .adguard_username.Value }}"
          HOMEPAGE_VAR_ADGUARD_PASSWORD: "{{ .adguard_password.Value }}"
          HOMEPAGE_VAR_UNIFI_USERNAME: "{{ .unifi_username.Value }}"
          HOMEPAGE_VAR_UNIFI_PASSWORD: "{{ .unifi_password.Value }}"
          HOMEPAGE_VAR_PORTAINER_KEY: "{{ .portainer_api_key.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
