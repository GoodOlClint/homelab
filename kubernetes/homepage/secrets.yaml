---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: monitoring, namespace: homepage}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /monitoring}
  managedKubeSecretReferences:
    - secretName: homepage-monitoring
      secretNamespace: homepage
      template:
        data:
          HOMEPAGE_VAR_GRAFANA_PASSWORD: "{{ .grafana_admin_password.Value }}"
          HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET: "{{ .proxmox_token_value.Value }}"
          HOMEPAGE_VAR_PROXMOX_BACKUP_PASSWORD: "{{ .pbs_api_token.Value }}"
