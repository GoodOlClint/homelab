apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  annotations: {secrets.infisical.com/auto-reload: "true"}
spec:
  replicas: 1
  selector: {matchLabels: {app: homepage}}
  template:
    metadata: {labels: {app: homepage}}
    spec:
      containers:
        - name: homepage
          image: ${REGISTRY}/ghcr.io/gethomepage/homepage:latest
          ports: [{containerPort: 3000}]
          env:
            - {name: TZ, value: "${TZ}"}
            - {name: HOMEPAGE_ALLOWED_HOSTS, value: "${HOSTS}"}
          envFrom:
            - secretRef: {name: homepage-homepage}
            - secretRef: {name: homepage-plex-services}
            - secretRef: {name: homepage-plex}
            - secretRef: {name: homepage-monitoring}
          volumeMounts:
            - {name: config, mountPath: /app/config/services.yaml, subPath: services.yaml}
            - {name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml}
            - {name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml}
            - {name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml}
            - {name: config, mountPath: /app/config/docker.yaml, subPath: docker.yaml}
          readinessProbe: {httpGet: {path: /, port: 3000, httpHeaders: [{name: Host, value: "${HOST}"}]}, initialDelaySeconds: 10}
      volumes:
        - name: config
          configMap: {name: homepage-config}
---
apiVersion: v1
kind: Service
metadata: {name: homepage, namespace: homepage}
spec:
  selector: {app: homepage}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations: {traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd}
spec:
  ingressClassName: traefik
  rules:
    - host: ${HOST}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: homepage, port: {number: 80}}}}]}
    - host: ${HOST_ALIAS}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: homepage, port: {number: 80}}}}]}
