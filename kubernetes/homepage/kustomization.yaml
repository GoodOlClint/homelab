apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [secrets.yaml, app.yaml]
# Name-hashed so a config edit rolls the Deployment (what CONFIG_HASH did); Flux substitutes the
# ${VAR}s in the generated content after the build.
configMapGenerator:
  - name: homepage-config
    namespace: homepage
    files: [config/bookmarks.yaml, config/docker.yaml, config/services.yaml, config/settings.yaml, config/widgets.yaml]
