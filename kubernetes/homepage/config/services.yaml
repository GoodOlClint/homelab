- Media:
    - Plex:
        icon: plex.svg
        href: https://plex.clintflix.tv:32400/web
        description: Media Server
        widget: {type: plex, url: "https://${PLEX}:32400", key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"}
    - Tautulli:
        icon: tautulli.svg
        href: https://tautulli.clintflix.tv
        description: Plex Statistics
        widget: {type: tautulli, url: "http://${PLEX_SERVICES}:8181", key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"}
    - Seerr:
        icon: jellyseerr.svg
        href: https://request.clintflix.tv
        description: Media Requests
        widget: {type: jellyseerr, url: "http://${PLEX_SERVICES}:5055", key: "{{HOMEPAGE_VAR_SEERR_KEY}}"}

- Downloads:
    - Sonarr:
        icon: sonarr.svg
        href: http://${PLEX_SERVICES}:8989
        description: TV Series
        widget: {type: sonarr, url: "http://${PLEX_SERVICES}:8989", key: "{{HOMEPAGE_VAR_SONARR_KEY}}"}
    - Radarr:
        icon: radarr.svg
        href: http://${PLEX_SERVICES}:7878
        description: Movies
        widget: {type: radarr, url: "http://${PLEX_SERVICES}:7878", key: "{{HOMEPAGE_VAR_RADARR_KEY}}"}
    - Lidarr:
        icon: lidarr.svg
        href: http://${PLEX_SERVICES}:8686
        description: Music
        widget: {type: lidarr, url: "http://${PLEX_SERVICES}:8686", key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"}
    - Prowlarr:
        icon: prowlarr.svg
        href: http://${PLEX_SERVICES}:9696
        description: Indexer Manager
        widget: {type: prowlarr, url: "http://${PLEX_SERVICES}:9696", key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"}
    - Bazarr:
        icon: bazarr.svg
        href: http://${PLEX_SERVICES}:6767
        description: Subtitles
        widget: {type: bazarr, url: "http://${PLEX_SERVICES}:6767", key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"}
