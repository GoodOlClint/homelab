- Media:
    - Plex:
        icon: plex.svg
        href: https://plex.${MEDIA_DOMAIN}:32400/web
        description: Media Server
        widget: {type: plex, url: "https://${PLEX}:32400", key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"}
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.${MEDIA_DOMAIN}
        description: Media Server (family)
    - Tautulli:
        icon: tautulli.svg
        href: https://tautulli.${MEDIA_DOMAIN}
        description: Plex Statistics
        widget: {type: tautulli, url: "http://tautulli.plex-services.svc:8181", key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"}
    - Seerr:
        icon: jellyseerr.svg
        href: https://request.${MEDIA_DOMAIN}
        description: Media Requests
        widget: {type: jellyseerr, url: "http://seerr.plex-services.svc:5055", key: "{{HOMEPAGE_VAR_SEERR_KEY}}"}

- Downloads:
    - Sonarr:
        icon: sonarr.svg
        href: https://sonarr.${DOMAIN}
        description: TV Series
        widget: {type: sonarr, url: "http://sonarr.plex-services.svc:8989", key: "{{HOMEPAGE_VAR_SONARR_KEY}}"}
    - Radarr:
        icon: radarr.svg
        href: https://radarr.${DOMAIN}
        description: Movies
        widget: {type: radarr, url: "http://radarr.plex-services.svc:7878", key: "{{HOMEPAGE_VAR_RADARR_KEY}}"}
    - Lidarr:
        icon: lidarr.svg
        href: https://lidarr.${DOMAIN}
        description: Music
        widget: {type: lidarr, url: "http://lidarr.plex-services.svc:8686", key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"}
    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.${DOMAIN}
        description: Indexer Manager
        widget: {type: prowlarr, url: "http://prowlarr.plex-services.svc:9696", key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"}
    - Bazarr:
        icon: bazarr.svg
        href: https://bazarr.${DOMAIN}
        description: Subtitles
        widget: {type: bazarr, url: "http://bazarr.plex-services.svc:6767", key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"}
    - SABnzbd:
        icon: sabnzbd.svg
        href: https://sabnzbd.${DOMAIN}
        description: Usenet Downloads
        widget: {type: sabnzbd, url: "http://sabnzbd.plex-services.svc:8080", key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"}

- Monitoring:
    - Grafana:
        icon: grafana.svg
        href: https://grafana.${DOMAIN}
        description: Dashboards
        widget: {type: grafana, url: "http://grafana.monitoring.svc:3000", username: admin, password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"}
    - Prometheus:
        icon: prometheus.svg
        href: https://prometheus.${DOMAIN}
        description: Metrics
        widget: {type: prometheus, url: "http://prometheus.monitoring.svc:9090"}
    - OpenObserve:
        icon: sh-openobserve.svg
        href: https://openobserve.${DOMAIN}
        description: Log Management
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: https://uptime-kuma.${DOMAIN}
        description: Status Monitoring

- Infrastructure:
    - Authentik:
        icon: authentik.svg
        href: https://auth.${DOMAIN}
        description: SSO (internal realm)
    - Portainer:
        icon: portainer.svg
        href: https://${CONTROL}:9443
        description: Container Management
        widget: {type: portainer, url: "https://${CONTROL}:9443", env: 1, key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"}
    - AdGuard Home:
        icon: adguard-home.svg
        href: http://${ADGUARD}:3000
        description: DNS Filtering
        widget: {type: adguard, url: "http://${ADGUARD}:3000", username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}", password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"}
    - Proxmox VE:
        icon: proxmox.svg
        href: ${PVE_API}
        description: Hypervisor
        widget: {type: proxmox, url: "${PVE_API}", username: "monitoring@pve!monitoring", password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"}
    - Proxmox Backup:
        icon: proxmox.svg
        href: https://${PBS}:8007
        description: Backup Server
        widget: {type: proxmoxbackupserver, url: "https://${PBS}:8007", username: "monitoring@pbs!monitoring-token", password: "{{HOMEPAGE_VAR_PROXMOX_BACKUP_PASSWORD}}"}
    - UniFi:
        icon: unifi.svg
        href: https://${UNIFI}:11443
        description: Network Controller
        widget: {type: unifi, url: "https://${UNIFI}:11443", username: "{{HOMEPAGE_VAR_UNIFI_USERNAME}}", password: "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}"}
    - Infisical:
        icon: infisical.svg
        href: http://${INFISICAL}:8080
        description: Secrets Management
    - pfSense:
        icon: pfsense.svg
        href: https://${GATEWAY}
        description: Firewall / Gateway
    - Synology NAS:
        icon: synology-dsm.svg
        href: https://${SYNOLOGY}:5001
        description: Network Storage

- Other:
    - Kiwix:
        icon: kiwix.svg
        href: https://kiwix.${DOMAIN}
        description: Offline Wikipedia
