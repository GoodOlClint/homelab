# Runner pods: hostNetwork so dind's --net=host services (PSProxmoxVE answer
# server, NFS/iSCSI) sit on the node's vlan40 address reachable from the ci VLAN;
# pinned to one node so the RWO cache PVC is shareable across jobs (ADR 0034).
githubConfigSecret: github-app
minRunners: 0
maxRunners: 3
template:
  spec:
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    nodeSelector: {kubernetes.io/hostname: talos-cp-a}
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - {name: dind-externals, mountPath: /home/runner/tmpDir}
      - name: dind
        image: docker:dind
        args: ["dockerd", "--host=unix:///var/run/docker.sock", "--group=$(DOCKER_GROUP_GID)"]
        env:
          - {name: DOCKER_GROUP_GID, value: "123"}
        securityContext: {privileged: true}
        restartPolicy: Always
        startupProbe:
          exec: {command: [docker, info]}
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
          - {name: dind-sock, mountPath: /var/run}
          - {name: dind-externals, mountPath: /home/runner/externals}
          - {name: cache, mountPath: /opt/pve-integration}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - {name: DOCKER_HOST, value: unix:///var/run/docker.sock}
          - {name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS, value: "120"}
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
          - {name: dind-sock, mountPath: /var/run}
    volumes:
      - {name: work, emptyDir: {}}
      - {name: dind-sock, emptyDir: {}}
      - {name: dind-externals, emptyDir: {}}
      - name: cache
        persistentVolumeClaim: {claimName: pve-integration-cache}
