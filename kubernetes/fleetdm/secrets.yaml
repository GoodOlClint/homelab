apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: fleetdm, namespace: fleetdm}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /fleetdm}
  managedKubeSecretReferences:
    - secretName: fleetdm-secrets
      secretNamespace: fleetdm
      template:
        data:
          MYSQL_ROOT_PASSWORD: "{{ .mysql_root_password.Value }}"
          MYSQL_PASSWORD: "{{ .mysql_password.Value }}"
          FLEET_SERVER_PRIVATE_KEY: "{{ .server_private_key.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: pbs, namespace: fleetdm}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /shared}
  managedKubeSecretReferences:
    - secretName: pbs-secrets
      secretNamespace: fleetdm
      template:
        data:
          PBS_PASSWORD: "{{ .pbs_backup_token.Value }}"
