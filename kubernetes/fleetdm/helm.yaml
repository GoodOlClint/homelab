apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: fleet, namespace: fleetdm}
spec: {interval: 12h, url: https://fleetdm.github.io/fleet/charts}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: fleet, namespace: fleetdm}
spec:
  interval: 30m
  chart:
    spec:
      chart: fleet
      version: v7.0.33
      sourceRef: {kind: HelmRepository, name: fleet}
  install: {remediation: {retries: 5}}
  upgrade: {remediation: {retries: 5}}
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: Deployment, name: fleet}
            patch: '[{"op": "remove", "path": "/spec/template/spec/containers/0/resources/limits"}]'
          - target: {kind: Job, name: fleet-migration}
            patch: '[{"op": "remove", "path": "/spec/template/spec/containers/0/resources/limits"}]'
  values:
    hostName: fleet.${DOMAIN}
    replicas: 1
    imageRepository: ${REGISTRY}/docker.io/fleetdm/fleet
    imageTag: v4.95.0
    resources:
      limits: {cpu: "2", memory: 2Gi}
      requests: {cpu: 250m, memory: 512Mi}
    ingress: {enabled: false}
    fleet:
      secretName: fleetdm-secrets
      tls:
        enabled: true
        uniqueTLSSecret: true
        secretName: fleet-tls
        certSecretKey: tls.crt
        keySecretKey: tls.key
    database:
      secretName: fleetdm-secrets
      passwordKey: MYSQL_PASSWORD
      address: mysql:3306
    cache:
      address: valkey:6379
    envsFrom:
      - name: FLEET_SERVER_PRIVATE_KEY
        valueFrom: {secretKeyRef: {name: fleetdm-secrets, key: FLEET_SERVER_PRIVATE_KEY}}
