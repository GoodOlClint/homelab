apiVersion: v1
kind: Service
metadata:
  name: fleet-lb
  namespace: fleetdm
  annotations:
    metallb.io/loadBalancerIPs: "${FLEETDM_IP}"
    external-dns.alpha.kubernetes.io/hostname: fleet.${DOMAIN}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: fleet
    chart: fleet
    component: fleet-server
    heritage: Helm
    release: fleet
  ports: [{name: fleet, port: 443, targetPort: 8080}]
