apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: fleetdm
spec:
  replicas: 1
  selector: {matchLabels: {app: valkey}}
  template:
    metadata: {labels: {app: valkey}}
    spec:
      enableServiceLinks: false
      containers:
        - name: valkey
          image: ${REGISTRY}/docker.io/valkey/valkey:latest
          args: [valkey-server, --save, "", --appendonly, "no"]
          resources: {requests: {cpu: 50m, memory: 128Mi}}
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: [valkey-cli, ping]}, periodSeconds: 10}
          livenessProbe: {exec: {command: [valkey-cli, ping]}, periodSeconds: 30, timeoutSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: valkey, namespace: fleetdm}
spec:
  selector: {app: valkey}
  ports: [{port: 6379}]
