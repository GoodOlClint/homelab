global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'homelab'
    environment: 'production'

rule_files:
  - /etc/prometheus/config/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

remote_write:
  - url: http://openobserve:5080/api/default/prometheus/api/v1/write
    basic_auth:
      username: ${OO_EMAIL}
      password_file: /etc/prometheus/secrets/openobserve_password

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'openobserve'
    static_configs:
      - targets: ['openobserve:5080']

  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox:9115']

  # One target per internal zone (all answered by the AdGuard VIP); rendered by deploy.sh from vlans.yaml.
  - job_name: 'blackbox-dns'
    metrics_path: /probe
    params:
      module: [dns_udp]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/blackbox-dns.json']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://${ADGUARD}:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Own UIs through Traefik (homelab-ca is not in the prober's trust store).
  - job_name: 'blackbox-ingress'
    metrics_path: /probe
    params:
      module: [http_2xx_insecure]
    static_configs:
      - targets:
          - https://${GRAFANA_HOST}/api/health
          - https://${OO_HOST}/healthz
          - https://${KUMA_HOST}/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'blackbox-plex'
    metrics_path: /probe
    params:
      module: [http_2xx_insecure]
    static_configs:
      - targets:
          - https://${PLEX}:32400/identity
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'blackbox-ping'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - ${BIND}
          - ${ADGUARD}
          - ${PLEX}
          - 8.8.8.8
          - 1.1.1.1
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'speedtest'
    scrape_interval: 30m
    scrape_timeout: 90s
    static_configs:
      - targets: ['speedtest:9798']

  - job_name: 'smokeping'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['smokeping-prober:9374']

  # Every fleet guest's telegraf; rendered by deploy.sh from vms.yaml.
  - job_name: 'telegraf'
    honor_labels: true
    file_sd_configs:
      - files: ['/etc/prometheus/targets/telegraf.json']

  - job_name: 'proxmox'
    static_configs:
      - targets:
        - ${PVE_API_HOST}
    metrics_path: /pve
    params:
      module: [default]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: proxmox-exporter:9221

  - job_name: 'synology'
    scrape_interval: 30s
    static_configs:
      - targets:
          - ${SYNOLOGY}
        labels:
          instance: 'synology-nas'
          role: 'storage'
    metrics_path: /snmp
    params:
      module: [synology]
      auth: [public_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: 'unifi-poller'
    static_configs:
      - targets: ['unifi-poller:9130']
        labels:
          instance: 'unifi'
          role: 'network'

  - job_name: 'pbs-exporter'
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['pbs-exporter:10019']
        labels:
          instance: 'proxmox-backup'
          role: 'infrastructure'

  - job_name: 'blackbox-tls'
    metrics_path: /probe
    params:
      module: [tls_connect]
    static_configs:
      - targets:
          - plex.${MEDIA_DOMAIN}:32400
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
