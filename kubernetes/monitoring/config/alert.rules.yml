groups:
  - name: infrastructure
    rules:
      - alert: HostDown
        expr: up{job!="ceph"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} is down"

      - alert: TLSCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in less than 14 days"

      # node_exporter runs only on the monitoring VM; every other host reports
      # via telegraf (mem_used_percent / disk_used_percent), so both metric
      # families need a rule or 7 of 8 hosts have no memory/disk coverage.
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90% on {{ $labels.instance }}"

      - alert: HighMemoryUsageTelegraf
        expr: mem_used_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90% on {{ $labels.instance }}"

      # Warning and critical tiers are separate alerts, so a disk past 95% fires both; the critical route is the one to act on.
      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay|fuse.*|devtmpfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|squashfs|overlay|fuse.*|devtmpfs|ramfs"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85% on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: HighDiskUsageTelegraf
        expr: disk_used_percent{fstype!~"tmpfs|squashfs|overlay"} > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85% on {{ $labels.instance }}:{{ $labels.path }}"

      - alert: HighInodeUsage
        expr: (1 - node_filesystem_files_free{fstype!~"tmpfs|squashfs|overlay|fuse.*|devtmpfs|ramfs"} / node_filesystem_files{fstype!~"tmpfs|squashfs|overlay|fuse.*|devtmpfs|ramfs"}) * 100 > 85 and node_filesystem_files > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inode usage above 85% on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: HighInodeUsageTelegraf
        expr: disk_inodes_used_percent{fstype!~"tmpfs|squashfs|overlay"} > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inode usage above 85% on {{ $labels.instance }}:{{ $labels.path }}"

      - alert: HighDiskUsageCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay|fuse.*|devtmpfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|squashfs|overlay|fuse.*|devtmpfs|ramfs"}) * 100 > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 95% on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: HighDiskUsageTelegrafCritical
        expr: disk_used_percent{fstype!~"tmpfs|squashfs|overlay"} > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 95% on {{ $labels.instance }}:{{ $labels.path }}"

      - alert: HighInodeUsageCritical
        expr: (1 - node_filesystem_files_free{fstype!~"tmpfs|squashfs|overlay|fuse.*|devtmpfs|ramfs"} / node_filesystem_files{fstype!~"tmpfs|squashfs|overlay|fuse.*|devtmpfs|ramfs"}) * 100 > 95 and node_filesystem_files > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Inode usage above 95% on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: HighInodeUsageTelegrafCritical
        expr: disk_inodes_used_percent{fstype!~"tmpfs|squashfs|overlay"} > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Inode usage above 95% on {{ $labels.instance }}:{{ $labels.path }}"

      # Snapshots of retired guests sit 40+ days old and never match; the 14d ceiling means a guest that
      # stopped backing up fires for two weeks and then goes quiet. worklab's namespace is excluded because
      # the host is powered off for days at a time.
      - alert: PBSBackupStale
        expr: >-
          (time() - pbs_snapshot_vm_last_timestamp{namespace!="worklab"}) > 36 * 3600
          and (time() - pbs_snapshot_vm_last_timestamp{namespace!="worklab"}) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "PBS backup of {{ $labels.vm_id }} ({{ $labels.vm_name }}) is over 36h old"

      - alert: PBSDown
        expr: pbs_up == 0 or absent(pbs_up)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox Backup Server is down or its metrics are missing"

      - alert: BlackboxProbeFailed
        expr: probe_success{job!~"blackbox-plex|blackbox-dns"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Probe of {{ $labels.instance }} ({{ $labels.job }}) has been failing for 15m"

      - alert: ExporterMetricsAbsent
        expr: absent(kube_node_info) or absent(node_hwmon_temp_celsius) or absent(probe_success)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "kube-state-metrics, node-exporter or blackbox series have vanished; their rules cannot fire"

  - name: services
    rules:
      # OpenObserve answers on 5080 while rejecting every write (2026-07 schema wedge, 2026-10 inode exhaustion),
      # so reachability checks pass. Its memtable size moves whenever logs arrive and sat flat for 8 h during the
      # 2026-10 outage. No log-ingest request series exists on this version; absent() covers a vanished metric. max(): a replaced pod leaves a flat series inside the window.
      - alert: SyslogIngestionStalled
        expr: max(changes(zo_ingest_memtable_bytes[1h])) == 0 or absent(zo_ingest_memtable_bytes)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "OpenObserve ingest memtable has not changed in 1h or its metrics are missing"

      - alert: PlexDown
        expr: probe_success{job="blackbox-plex"} == 0 or absent(probe_success{job="blackbox-plex"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Plex is unreachable"

      - alert: DNSResolutionFailure
        expr: probe_success{job="blackbox-dns"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DNS resolution failing for {{ $labels.zone }}"

  - name: isp
    rules:
      # Inert until the modem scrape returns (dropped in ADR 0036); kept as the spec.
      - alert: ModemT3Timeouts
        expr: increase(modem_t3_timeouts_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cox modem T3 timeouts detected"
          description: "{{ $value }} T3 timeouts in the last 15 minutes"

      - alert: ModemT4Timeouts
        expr: increase(modem_t4_timeouts_total[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cox modem T4 timeouts detected"
          description: "{{ $value }} T4 timeouts in the last 15 minutes — possible service disruption"

      - alert: HighPacketLoss
        expr: count by (url) (ping_percent_packet_loss{url=~"8.8.8.8|1.1.1.1"} > 5) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WAN packet loss to {{ $labels.url }}"
          description: "{{ $value }} hosts see >5% packet loss to {{ $labels.url }} over 5 minutes"

      - alert: HighLatency
        expr: probe_icmp_duration_seconds{job="blackbox-ping",instance=~"8.8.8.8|1.1.1.1",phase="rtt"} > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency to {{ $labels.instance }}"
          description: "RTT {{ $value }}s (>100ms) over 5 minutes"

  - name: kubernetes
    rules:
      # up==0 only catches a target that stays down. A pod that crashes and answers again
      # between restarts never trips it — 11 restarts on 2026-08-27 produced no alert.
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in 15m"

      # Running but never Ready: the arr apps treat a refused DB connection as a terminal
      # state and sit there, so nothing restarts them and no probe alert exists.
      # Phase-gated so Completed job pods do not match.
      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0 and on(namespace, pod) kube_pod_status_phase{phase="Running"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Running but not Ready for 15m"

      - alert: PersistentVolumeNearFull
        expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | printf \"%.0f\" }}% full"

      - alert: PersistentVolumeNearFullCritical
        expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100 > 95
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | printf \"%.0f\" }}% full"

      # The 2026-10-04 OpenObserve outage was inode exhaustion on a PVC that was not full by bytes.
      - alert: PersistentVolumeInodesNearFull
        expr: kubelet_volume_stats_inodes_used / kubelet_volume_stats_inodes * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has used {{ $value | printf \"%.0f\" }}% of its inodes"

      - alert: PersistentVolumeInodesNearFullCritical
        expr: kubelet_volume_stats_inodes_used / kubelet_volume_stats_inodes * 100 > 95
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has used {{ $value | printf \"%.0f\" }}% of its inodes"

      - alert: PodHighCPU
        expr: sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=""}[5m])) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is using {{ $value | printf \"%.1f\" }} cores"

      - alert: PodMemoryAboveRequest
        expr: >-
          max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""})
          > 3 * max by (namespace, pod, container) (kube_pod_container_resource_requests{resource="memory"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) uses over 3x its memory request"

      - alert: NodePressure
        expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} reports {{ $labels.condition }}"

  - name: etcd
    rules:
      - alert: EtcdSlowFsync
        expr: histogram_quantile(0.99, sum by (node, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "etcd on {{ $labels.node }} WAL fsync p99 is {{ $value | printf \"%.3f\" }}s (etcd wants under 10 ms on good disks; the engine logs at 100 ms)"

      - alert: EtcdSlowBackendCommit
        expr: histogram_quantile(0.99, sum by (node, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "etcd on {{ $labels.node }} backend commit p99 is {{ $value | printf \"%.3f\" }}s"

      - alert: EtcdLeaderChanges
        expr: increase(etcd_server_leader_changes_seen_total[1h]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "etcd on {{ $labels.node }} saw {{ $value | printf \"%.0f\" }} leader changes in 1h"

      - alert: EtcdNoLeader
        expr: etcd_server_has_leader == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "etcd member on {{ $labels.node }} has no leader"

      - alert: ApiserverEtcdSlow
        expr: histogram_quantile(0.99, sum by (instance, le) (rate(etcd_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "apiserver {{ $labels.instance }} sees etcd request p99 of {{ $value | printf \"%.2f\" }}s"

      - alert: ApiserverRequestTerminations
        expr: sum by (instance) (increase(apiserver_request_terminations_total[10m])) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "apiserver {{ $labels.instance }} terminated {{ $value | printf \"%.0f\" }} requests in 10m"

      - alert: TalosDiskSaturated
        expr: rate(container_fs_io_time_seconds_total{id="/"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.device }} on {{ $labels.node }} is busy {{ $value | humanizePercentage }} of the time"

  - name: hardware
    rules:
      # node_exporter hwmon: node_hwmon_temp_celsius{chip,sensor}; node_hwmon_chip_names{chip,chip_name} maps the sysfs chip id to the driver name.
      - alert: NICOverTemperature
        expr: >-
          node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name)
          node_hwmon_chip_names{chip_name="mlx5"} > 105
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NIC (mlx5) on {{ $labels.instance }} is at {{ $value | printf \"%.0f\" }} C"

      - alert: NICOverTemperatureCritical
        expr: >-
          node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name)
          node_hwmon_chip_names{chip_name="mlx5"} > 112
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NIC (mlx5) on {{ $labels.instance }} is at {{ $value | printf \"%.0f\" }} C, near where one fell off the PCIe bus"

      - alert: CPUOverTemperature
        expr: >-
          node_hwmon_temp_celsius{sensor="temp1"} * on (instance, chip) group_left (chip_name)
          node_hwmon_chip_names{chip_name="coretemp"} > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU package on {{ $labels.instance }} is at {{ $value | printf \"%.0f\" }} C"

      - alert: NVMeOverTemperature
        expr: >-
          node_hwmon_temp_celsius{sensor="temp1"} * on (instance, chip) group_left (chip_name)
          node_hwmon_chip_names{chip_name="nvme"} > 75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NVMe drive on {{ $labels.instance }} is at {{ $value | printf \"%.0f\" }} C"

  - name: availability
    rules:
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node {{ $labels.node }} is not Ready"

      # Every workload here is a single replica, so zero available means the service is down.
      - alert: KubeWorkloadUnavailable
        expr: >-
          (kube_deployment_status_replicas_available == 0 and kube_deployment_spec_replicas > 0)
          or label_replace(
            kube_statefulset_status_replicas_ready == 0 and kube_statefulset_replicas > 0,
            "deployment", "$1", "statefulset", "(.*)")
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has no available replicas"

      - alert: PVENodeDown
        expr: pve_up{id=~"node/.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox node {{ $labels.id }} is down"

      - alert: PVEHAError
        expr: pve_ha_state{state=~"error|fence"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HA resource {{ $labels.id }} is in state {{ $labels.state }}"

  - name: ceph
    rules:
      # AUTH_INSECURE_* are standing waivers until Talos reaches kernel 7.0, so overall health_status is always 1 today.
      - alert: CephHealthWarn
        expr: ceph_health_detail{name!~"AUTH_INSECURE_.*"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ceph health check {{ $labels.name }} is active"

      - alert: CephHealthError
        expr: ceph_health_status == 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ceph is HEALTH_ERR"

      - alert: CephMetricsAbsent
        expr: absent(ceph_health_status)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No Ceph metrics: the active mgr's prometheus endpoint is not being scraped"

      - alert: CephOSDDown
        expr: ceph_osd_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ceph {{ $labels.ceph_daemon }} is down"
