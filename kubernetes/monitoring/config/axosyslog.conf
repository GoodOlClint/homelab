@version: 4.8
@include "scl.conf"

# AxoSyslog — Multi-Source Log Pipeline
#
# Architecture:
#   Sources (flags(no-parse)) → per-path parser → filter by PROGRAM/message → OpenObserve stream
#
#   Sources use flags(no-parse) because we receive MIXED syslog formats on the same port:
#     - pfSense/VMs/Docker send RFC 5424 → parsed by syslog-parser(flags(syslog-protocol))
#   A junction with channel blocks isolates parser state between routes.
#   flags(final) on each channel implements first-match routing.
#
# Sources:
#   - VM rsyslog clients: TCP 5514, RFC 5424 via RSYSLOG_SyslogProtocol23Format
#   - pfSense firewall:   UDP 5514, RFC 5424 (Status → System Logs → Settings → Log Message Format → syslog)
#   - Docker syslog:      TCP 5514, RFC 5424 via Docker syslog driver
#   - netconsole:         UDP 5515 (DEDICATED PORT), raw kernel printk, never parsed
#                         Senders: PVE nodes (systemd-loaded netconsole module) and
#                         UniFi devices (controller `syslog.netconsole_*` setting).
#                         UniFi treats netconsole as a destination separate from its
#                         remote syslog — point the latter at 5514, never at 5515.
#
# OpenObserve Streams:
#   - firewall:   pfSense filterlog with parsed CSV fields (action, IPs, ports, protocol)
#   - syslog:     Everything else arriving on 5514 (VM system logs, Docker containers)
#   - netconsole: Everything arriving on 5515, verbatim
#
# External Device Configuration (manual — not managed by Ansible):
#
#   pfSense (already sending logs):
#     1. Status → System Logs → Settings
#     2. Enable Remote Logging
#     3. Remote log servers: <syslog LB, services offset 66>:5514
#     4. Protocol: UDP
#     5. Log Message Format: syslog (RFC 5424)
#     6. Check: Firewall Events (filterlog), optionally System/DNS/DHCP Events

# =============================================================================
# Options
# =============================================================================

options {
    chain_hostnames(off);
    # ${ISODATE} (used for @timestamp in every destination) truncates to whole
    # seconds unless frac-digits is set. Docker/RFC 5424 senders carry microseconds;
    # without this, all lines emitted within one second share an identical
    # _timestamp, so OpenObserve tie-breaks on UDP arrival order and multi-line
    # stack traces render scrambled. 6 digits preserves the sender's microseconds.
    frac-digits(6);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner("root");
    group("adm");
    perm(0640);
    stats(freq(0));
    bad_hostname("^gconfd$");
    time_reopen(10);
    log_fifo_size(10000);
    create_dirs(yes);
};

# =============================================================================
# Sources — Listen for syslog messages
# =============================================================================

# flags(no-parse) leaves the raw message (including PRI header) in ${MESSAGE}.
# Each log path applies its own parser (RFC 5424 or RFC 3164) to handle mixed formats.
source s_network_udp {
    network(
        transport("udp")
        port(5514)
        flags(no-parse)
    );
};

# Host netconsole — DEDICATED port, deliberately not shared with 5514.
#
# netconsole emits bare printk text with no PRI and no RFC 5424 framing. It cannot
# share the 5514 sources: syslog-parser() does NOT reject unframed text, it parses
# it leniently as RFC 3164 and consumes the first token as the program tag. Verified
# 2026-07-30 — "nvme nvme0: Removing after probe failure" arrived in the syslog
# stream as "nvme0: Removing after probe failure", first word eaten. Routing by
# parse failure is therefore impossible; the port IS the discriminator.
source s_netconsole {
    network(
        transport("udp")
        port(5515)
        flags(no-parse)
    );
};

source s_network_tcp {
    network(
        transport("tcp")
        port(5514)
        flags(no-parse)
        # syslog-ng's default max-connections is 10. Every Docker daemon holds one
        # TCP connection per container it logs for, so the fleet exceeds 10 easily;
        # once the limit is hit, all new senders are rejected and ingestion silently
        # stalls (observed live 2026-07-27). log-iw-size scales the flow-control
        # window with the connection count (docs recommend >= 100 per connection).
        max-connections(100)
        log-iw-size(10000)
    );
};

# =============================================================================
# Parsers
# =============================================================================

# RFC 5424 parser — for pfSense, VMs, Docker (standards-compliant sources).
#
# NOT strict, despite flags(syslog-protocol). Verified 2026-07-30: this parser
# does NOT drop non-conforming messages, it falls back to RFC 3164 and accepts
# them. Bare printk loses its first token to the tag field; a real RFC 3164
# message parses fine but its timestamp carries no timezone and is read as
# receiver-local, so a UTC sender lands hours in the future (see CLAUDE.md).
# Senders we control must emit RFC 5424; it is the only format that carries a
# timezone and survives this parser unambiguously.
parser p_rfc5424 {
    syslog-parser(flags(syslog-protocol));
};

# pfSense filterlog CSV parsers — two-stage: common header, then per-ip-version.
# filterlog's column layout DIVERGES after ip_version: v4 has 8 IP-header fields
# (tos,ecn,ttl,id,offset,flags,proto_id,proto_name) before length/src/dst, v6 has
# 4 (class,flow,hoplimit,proto_name,proto_id). The old single fixed-v4 map wrote
# ports into pf.src_ip and IPv6 addresses into pf.proto_name for every v6 row
# (~24% of traffic, verified live 2026-07-28) — useless for rule mining.
# ICMP/other-proto rows still carry proto data in the port columns; filter on
# pf.proto_name when mining.
parser p_pfsense_common {
    csv-parser(
        columns("rule_number", "sub_rule", "anchor", "tracker",
                "interface", "reason", "action", "direction",
                "ip_version", "rest")
        delimiters(",")
        prefix(".pf.")
        flags(greedy)
        template("${MESSAGE}")
    );
};

parser p_pfsense_v4 {
    csv-parser(
        columns("tos", "ecn", "ttl", "id", "offset", "flags",
                "proto_id", "proto_name",
                "length", "src_ip", "dst_ip", "src_port", "dst_port")
        delimiters(",")
        prefix(".pf.")
        template("${.pf.rest}")
    );
};

parser p_pfsense_v6 {
    csv-parser(
        columns("class", "flow", "hoplimit", "proto_name", "proto_id",
                "length", "src_ip", "dst_ip", "src_port", "dst_port")
        delimiters(",")
        prefix(".pf.")
        template("${.pf.rest}")
    );
};

filter f_pf_v4 {
    match("^4$" value(".pf.ip_version"));
};

filter f_pf_v6 {
    match("^6$" value(".pf.ip_version"));
};

# =============================================================================
# Filters — Identify log sources after parsing
# =============================================================================

filter f_pfsense {
    program("filterlog");
};

# =============================================================================
# Destinations — Separate OpenObserve streams per source type
# =============================================================================

# Firewall logs → "firewall" stream
destination d_openobserve_firewall {
    openobserve-log(
        url("http://openobserve")
        port(5080)
        organization("default")
        stream("firewall")
        user("`OPENOBSERVE_ROOT_USER_EMAIL`")
        password("`OPENOBSERVE_ROOT_USER_PASS`")
        record("--scope rfc5424 --exclude DATE --pair @timestamp=${ISODATE} --pair pf.action=${.pf.action} --pair pf.interface=${.pf.interface} --pair pf.direction=${.pf.direction} --pair pf.src_ip=${.pf.src_ip} --pair pf.dst_ip=${.pf.dst_ip} --pair pf.src_port=${.pf.src_port} --pair pf.dst_port=${.pf.dst_port} --pair pf.proto_name=${.pf.proto_name} --pair pf.rule_number=${.pf.rule_number} --pair pf.tracker=${.pf.tracker} --pair pf.ip_version=${.pf.ip_version}")
    );
};

# All other syslog → "syslog" stream (VMs, Docker containers)
destination d_openobserve_syslog {
    openobserve-log(
        url("http://openobserve")
        port(5080)
        organization("default")
        stream("syslog")
        user("`OPENOBSERVE_ROOT_USER_EMAIL`")
        password("`OPENOBSERVE_ROOT_USER_PASS`")
        record("--scope rfc5424 --exclude DATE --pair @timestamp=${ISODATE}")
    );
};

# Host netconsole → "netconsole" stream.
#
# This is the only log path that survives a host losing its root disk: netconsole
# transmits from kernel context over UDP, needing neither the filesystem nor any
# userspace daemon. A host that dies with its journal on the dead disk still
# reports here. Motivating incident: worklab 2026-07-27 (see WP2 in
# docs/ms01-cluster-iac-plan.md).
#
# No --scope rfc5424: nothing was parsed, so there are no syslog fields to scope
# over. ${SOURCEIP} is the only host identifier available.
destination d_openobserve_netconsole {
    openobserve-log(
        url("http://openobserve")
        port(5080)
        organization("default")
        stream("netconsole")
        user("`OPENOBSERVE_ROOT_USER_EMAIL`")
        password("`OPENOBSERVE_ROOT_USER_PASS`")
        record("--exclude DATE --pair @timestamp=${ISODATE} --pair host=${SOURCEIP} --pair message=${MESSAGE}")
    );
};

# =============================================================================
# Log Routing — junction with channels for isolated parsing per source
#
# A junction snapshots the message before each channel and restores it on
# failure. This prevents parser modifications in one channel from leaking
# into subsequent channels (separate log{} blocks share message state).
# flags(final) on each channel implements first-match routing.
#
# Channel order:
#   1. pfSense:  p_rfc5424 → f_pfsense → common csv → v4/v6 csv → firewall stream
#   2. RFC 5424: p_rfc5424 → syslog stream (VMs, Docker)
#
# netconsole is NOT in this junction — it has its own source and log path below,
# because it cannot be discriminated by parse failure (see s_netconsole).
# =============================================================================

log {
    source(s_network_udp);
    source(s_network_tcp);

    junction {
        channel {
            parser(p_rfc5424);
            filter(f_pfsense);
            parser(p_pfsense_common);
            junction {
                channel { filter(f_pf_v4); parser(p_pfsense_v4); flags(final); };
                channel { filter(f_pf_v6); parser(p_pfsense_v6); flags(final); };
                channel { flags(final); }; # unknown ip_version: common fields only
            };
            destination(d_openobserve_firewall);
            flags(final);
        };

        channel {
            parser(p_rfc5424);
            destination(d_openobserve_syslog);
            flags(final);
        };

    };

    flags(flow-control);
};

# netconsole: separate path, no parser, no junction — raw line straight through.
# No flow-control: netconsole is fire-and-forget UDP from kernel context with no
# retransmit, so back-pressure here would buy nothing and could stall the reader.
log {
    source(s_netconsole);
    destination(d_openobserve_netconsole);
};
