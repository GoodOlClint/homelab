apiVersion: apps/v1
kind: Deployment
metadata: {name: blackbox, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: blackbox}}
  template:
    metadata:
      labels: {app: blackbox}
      annotations: {checksum/config: "${CONFIG_HASH}"}
    spec:
      # Unprivileged ICMP: the prober runs as nobody, so the pod opens the ping group range (a PSA-baseline-safe sysctl).
      securityContext: {sysctls: [{name: net.ipv4.ping_group_range, value: "0 2147483647"}]}
      containers:
        - name: blackbox
          image: ${REGISTRY}/docker.io/prom/blackbox-exporter:latest
          args: [--config.file=/config/blackbox.yml]
          ports: [{containerPort: 9115}]
          env: [{name: TZ, value: "${TZ}"}]
          volumeMounts: [{name: config, mountPath: /config}]
      volumes:
        - {name: config, configMap: {name: blackbox-config}}
---
apiVersion: v1
kind: Service
metadata: {name: blackbox, namespace: monitoring}
spec: {selector: {app: blackbox}, ports: [{port: 9115}]}
---
