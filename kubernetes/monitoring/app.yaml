apiVersion: apps/v1
kind: Deployment
metadata:
  name: axosyslog
  namespace: monitoring
  annotations: {secrets.infisical.com/auto-reload: "true"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: axosyslog}}
  template:
    metadata:
      labels: {app: axosyslog}
      annotations: {checksum/config: "${CONFIG_HASH}"}
    spec:
      containers:
        - name: axosyslog
          image: ${REGISTRY}/ghcr.io/axoflow/axosyslog:latest
          args: [-e]
          ports:
            - {containerPort: 5514, protocol: UDP}
            - {containerPort: 5514, protocol: TCP}
            - {containerPort: 5515, protocol: UDP}
            - {containerPort: 6514, protocol: TCP}
          env:
            - {name: TZ, value: "${TZ}"}
            - {name: OPENOBSERVE_ROOT_USER_EMAIL, value: "${OO_EMAIL}"}
            - {name: OPENOBSERVE_ROOT_USER_PASS, valueFrom: {secretKeyRef: {name: monitoring-secrets, key: OPENOBSERVE_ROOT_USER_PASS}}}
          volumeMounts:
            - {name: config, mountPath: /etc/syslog-ng/syslog-ng.conf, subPath: syslog-ng.conf, readOnly: true}
      volumes:
        - {name: config, configMap: {name: axosyslog-config}}
---
# The fleet's syslog/netconsole address (services offset 66): Local policy keeps the sender's source IP,
# which is the only host identifier the netconsole stream has.
apiVersion: v1
kind: Service
metadata:
  name: syslog
  namespace: monitoring
  annotations: {metallb.io/loadBalancerIPs: "${SYSLOG_IP}"}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app: axosyslog}
  ports:
    - {name: syslog-udp, port: 5514, protocol: UDP}
    - {name: syslog-tcp, port: 5514, protocol: TCP}
    - {name: netconsole, port: 5515, protocol: UDP}
    - {name: syslog-tls, port: 6514, protocol: TCP}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: uptimerobot-heartbeat, namespace: monitoring}
spec:
  schedule: "* * * * *"
  suspend: false   # declared so a redeploy re-arms a job that was suspended by hand
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: heartbeat
              image: ${REGISTRY}/public.ecr.aws/docker/library/busybox:latest
              imagePullPolicy: IfNotPresent   # a per-minute :latest re-check burns Docker Hub's anonymous pull quota
              command: [sh, -c, 'wget -qO- --timeout=10 "$UPTIMEROBOT_HEARTBEAT_URL" >/dev/null']
              env:
                - {name: UPTIMEROBOT_HEARTBEAT_URL, valueFrom: {secretKeyRef: {name: monitoring-secrets, key: UPTIMEROBOT_HEARTBEAT_URL}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: monitoring, namespace: monitoring}
spec:
  ingressClassName: traefik
  rules:
    - host: ${GRAFANA_HOST}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: grafana, port: {number: 3000}}}}]}
    - host: ${OO_HOST}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: openobserve, port: {number: 5080}}}}]}
    - host: ${PROM_HOST}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: prometheus, port: {number: 9090}}}}]}
    - host: ${AM_HOST}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: alertmanager, port: {number: 9093}}}}]}
    - host: ${KUMA_HOST}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: uptime-kuma, port: {number: 3001}}}}]}
