apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: monitoring
  annotations: {secrets.infisical.com/auto-reload: "true"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: openobserve}}
  template:
    metadata: {labels: {app: openobserve}}
    spec:
      containers:
        - name: openobserve
          # Pinned: the metadata DB is on schema 46, which only v0.92.x reads (renovate watches this line).
          image: ${REGISTRY}/public.ecr.aws/zinclabs/openobserve:v0.92.0-rc2-amd64
          ports: [{containerPort: 5080}]
          env:
            - {name: TZ, value: "${TZ}"}
            - {name: ZO_ROOT_USER_EMAIL, value: "${OO_EMAIL}"}
            - {name: ZO_ROOT_USER_PASSWORD, valueFrom: {secretKeyRef: {name: monitoring-secrets, key: ZO_ROOT_USER_PASSWORD}}}
            - {name: ZO_DATA_DIR, value: /data}
            - {name: ZO_HTTP_PORT, value: "5080"}
            - {name: ZO_GRPC_PORT, value: "5081"}
            - {name: ZO_COMPACT_ENABLED, value: "true"}
            - {name: ZO_COMPACT_INTERVAL, value: "3600"}
            - {name: ZO_MEMORY_CACHE_MAX_SIZE, value: "512"}
            - {name: ZO_INGEST_ALLOWED_UPTO, value: "24"}
            - {name: ZO_PROMETHEUS_ENABLED, value: "true"}
            - {name: ZO_TELEMETRY_ENABLED, value: "false"}
          volumeMounts:
            - {name: data, mountPath: /data, subPath: data}
          readinessProbe: {httpGet: {path: /healthz, port: 5080}, initialDelaySeconds: 10}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: openobserve}}
---
apiVersion: v1
kind: Service
metadata: {name: openobserve, namespace: monitoring}
spec: {selector: {app: openobserve}, ports: [{port: 5080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  annotations: {secrets.infisical.com/auto-reload: "true"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: grafana}}
  template:
    metadata:
      labels: {app: grafana}
      annotations: {checksum/config: "${CONFIG_HASH}"}
    spec:
      securityContext: {runAsUser: 472, runAsGroup: 472, fsGroup: 472, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: grafana
          image: ${REGISTRY}/docker.io/grafana/grafana:latest
          ports: [{containerPort: 3000}]
          env:
            - {name: TZ, value: "${TZ}"}
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: monitoring-secrets, key: GF_SECURITY_ADMIN_PASSWORD}}}
            - {name: GF_SERVER_ROOT_URL, value: "https://${GRAFANA_HOST}"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: OPENOBSERVE_ROOT_USER_EMAIL, value: "${OO_EMAIL}"}
            - {name: OPENOBSERVE_ROOT_USER_PASS, valueFrom: {secretKeyRef: {name: monitoring-secrets, key: OPENOBSERVE_ROOT_USER_PASS}}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana, subPath: data}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/openobserve.yml, subPath: grafana-datasource.yml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/default.yml, subPath: grafana-dashboards.yml}
            - {name: dashboards, mountPath: /etc/grafana/dashboards}
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 10}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: grafana}}
        - {name: provisioning, configMap: {name: grafana-provisioning}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: monitoring}
spec: {selector: {app: grafana}, ports: [{port: 3000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  annotations: {secrets.infisical.com/auto-reload: "true"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata:
      labels: {app: prometheus}
      annotations: {checksum/config: "${CONFIG_HASH}"}
    spec:
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: prometheus
          image: ${REGISTRY}/docker.io/prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/config/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports: [{containerPort: 9090}]
          env: [{name: TZ, value: "${TZ}"}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/config}
            - {name: targets, mountPath: /etc/prometheus/targets}
            - {name: secrets, mountPath: /etc/prometheus/secrets}
            - {name: data, mountPath: /prometheus, subPath: data}
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, initialDelaySeconds: 10}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: targets, configMap: {name: prometheus-targets}}
        - {name: secrets, secret: {secretName: monitoring-secrets, items: [{key: OPENOBSERVE_ROOT_USER_PASS, path: openobserve_password}]}}
        - {name: data, persistentVolumeClaim: {claimName: prometheus}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: monitoring}
spec: {selector: {app: prometheus}, ports: [{port: 9090}]}
