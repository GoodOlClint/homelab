    spec:
      enableServiceLinks: false   # the Service's SPEEDTEST_PORT link env would override the exporter's PORT
      containers:
        - name: speedtest
          image: ${REGISTRY}/docker.io/miguelndecarvalho/speedtest-exporter:latest
          ports: [{containerPort: 9798}]
          env: [{name: TZ, value: "${TZ}"}]
---
