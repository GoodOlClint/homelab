# Keys are renamed to the env names the workloads expect; alert-ntfy-url and OPENOBSERVE_ROOT_USER_PASS are also mounted as files.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: monitoring, namespace: monitoring}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /monitoring}
  managedKubeSecretReferences:
    - secretName: monitoring-secrets
      secretNamespace: monitoring
      template:
        data:
          GF_SECURITY_ADMIN_PASSWORD: "{{ .grafana_admin_password.Value }}"
          ZO_ROOT_USER_PASSWORD: "{{ .openobserve_root_user_pass.Value }}"
          OPENOBSERVE_ROOT_USER_PASS: "{{ .openobserve_root_user_pass.Value }}"
          PVE_TOKEN_VALUE: "{{ .proxmox_token_value.Value }}"
          UP_UNIFI_DEFAULT_PASS: "{{ .unifi_monitoring_password.Value }}"
          PBS_API_TOKEN: "{{ .pbs_api_token.Value }}"
          UPTIMEROBOT_HEARTBEAT_URL: "{{ .uptimerobot_heartbeat_url.Value }}"
          alert-ntfy-url: "https://ntfy.sh/{{ .alert_ntfy_topic.Value }}?template=alertmanager"
