# Default cert: Let's Encrypt wildcards over both public domains (ADR 0040 P5b).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: wildcard-tls, namespace: traefik}
spec:
  dnsNames: ["*.${DOMAIN}", "*.${MEDIA_DOMAIN}"]
  secretName: wildcard-tls
  issuerRef: {name: ${ISSUER}, kind: ClusterIssuer}
