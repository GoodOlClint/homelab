# ForwardAuth against the internal authentik realm by its public name, so the same Middleware works
# whether the realm runs on the cluster or on its LXC (ADR 0049). Every protected Ingress references it
# as `traefik-forward-auth@kubernetescrd` (Traefik runs with allowCrossNamespace for exactly this).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: forward-auth, namespace: traefik}
spec:
  forwardAuth:
    address: https://${AUTH_HOST}/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders: [X-authentik-username, X-authentik-groups, X-authentik-entitlements, X-authentik-email, X-authentik-name, X-authentik-uid, X-authentik-jwt, X-authentik-meta-jwks, X-authentik-meta-outpost, X-authentik-meta-provider, X-authentik-meta-app, X-authentik-meta-version]
