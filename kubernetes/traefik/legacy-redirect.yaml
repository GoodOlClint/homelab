# Old <name>.<domain_suffix> (and home.<services zone>) names 302 to <name>.<service domain>
# until P5e retires the suffix. Wildcard hosts: one Ingress, no per-app duplication.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: legacy-domain-redirect, namespace: traefik}
spec:
  redirectRegex:
    regex: '^https?://([^./]+)\.[^/]*${LEGACY_RE}(/.*)?$'
    replacement: 'https://${1}.${DOMAIN}${2}'
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-domain-redirect
  namespace: traefik
  annotations: {traefik.ingress.kubernetes.io/router.middlewares: traefik-legacy-domain-redirect@kubernetescrd}
spec:
  ingressClassName: traefik
  rules:
    - host: "*.${LEGACY_DOMAIN}"
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: traefik, port: {number: 80}}}}]}
    - host: "*.${SERVICES_ZONE}"
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: traefik, port: {number: 80}}}}]}
