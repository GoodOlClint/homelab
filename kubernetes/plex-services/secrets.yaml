apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: plex-services, namespace: plex-services}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /plex-services}
  managedKubeSecretReferences:
    - secretName: plex-services-secrets
      secretNamespace: plex-services
      template:
        data:
          POSTGRES_PASSWORD: "{{ .postgres_password.Value }}"
          BAZARR_POSTGRES_PASSWORD: "{{ .bazarr_db_password.Value }}"
          SEERR_DB_PASS: "{{ .seerr_db_password.Value }}"
          LIBATION_MASTER_KEY: "{{ .libation_master_key.Value }}"
          TUNNEL_TOKEN: "{{ .cloudflared_tunnel_token.Value }}"
          secrets.yml: |
            sonarr_api_key: {{ .sonarr_api_key.Value }}
            radarr_api_key: {{ .radarr_api_key.Value }}
---
# PBS credentials for the pg-backup CronJob; PBS_REPOSITORY is composed by deploy.sh from the inventory.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: pbs, namespace: plex-services}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /shared}
  managedKubeSecretReferences:
    - secretName: pbs-secrets
      secretNamespace: plex-services
      template:
        data:
          PBS_PASSWORD: "{{ .pbs_backup_token.Value }}"
          PBS_FINGERPRINT: "{{ .pbs_fingerprint.Value }}"
