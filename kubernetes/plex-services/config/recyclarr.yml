# Recyclarr v8 configuration — TRaSH Guide quality profiles (ADR 0037)
# Mounted as a ConfigMap item at /config/recyclarr.yml; secrets.yml comes from the InfisicalSecret.
# Syncs quality profiles to Sonarr and Radarr on CRON_SCHEDULE (@daily)

sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_api_key
    delete_old_custom_formats: true

    media_naming:
      series: plex-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1
        reset_unmatched_scores:
          enabled: true
      - trash_id: 9d142234e45d6143785ac55f5a9e8dc9
        reset_unmatched_scores:
          enabled: true
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: Bluray-720p
