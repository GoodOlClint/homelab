apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: plex-services
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: sabnzbd}}
  template:
    metadata: {labels: {app: sabnzbd}}
    spec:
      enableServiceLinks: false
      affinity: {nodeAffinity: {preferredDuringSchedulingIgnoredDuringExecution: [{weight: 100, preference: {matchExpressions: [{key: kubernetes.io/hostname, operator: NotIn, values: [talos-cp-w]}]}}]}}
      # fsGroup so the scratch PVC is writable for the dropped-privilege uid 2003 (s6 chowns /config only).
      securityContext: {fsGroup: 2000, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: sabnzbd
          image: ${REGISTRY}/ghcr.io/hotio/sabnzbd:testing
          ports: [{containerPort: 8080}]
          env:
            - {name: TZ, value: "${TZ}"}
            - {name: PUID, value: "2003"}
            - {name: PGID, value: "2000"}
            - {name: UMASK, value: "002"}
          volumeMounts:
            - {name: config, mountPath: /config, subPath: data}
            - {name: media, mountPath: /data, subPath: data}
            - {name: scratch, mountPath: /scratch, subPath: data}
          readinessProbe: {httpGet: {path: "/api?mode=version", port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: sabnzbd}}
        - {name: media, persistentVolumeClaim: {claimName: media}}
        - {name: scratch, persistentVolumeClaim: {claimName: sab-scratch}}
---
