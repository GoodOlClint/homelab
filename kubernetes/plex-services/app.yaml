apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: plex-services
  annotations: {secrets.infisical.com/auto-reload: "true"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      enableServiceLinks: false
      affinity: {nodeAffinity: {preferredDuringSchedulingIgnoredDuringExecution: [{weight: 100, preference: {matchExpressions: [{key: kubernetes.io/hostname, operator: NotIn, values: [talos-cp-w]}]}}]}}
      containers:
        - name: postgres
          # Major pinned: the data dir is a 17-format cluster.
          image: ${REGISTRY}/docker.io/library/postgres:17
          ports: [{containerPort: 5432}]
          env:
            - {name: TZ, value: "${TZ}"}
            - {name: POSTGRES_USER, value: qstick}
            - {name: POSTGRES_DB, value: qstick}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: plex-services-secrets, key: POSTGRES_PASSWORD}}}
          volumeMounts:
            # data/data = the PGDATA tree itself (uid 999), matching the old compose bind — the
            # migrated parent dir is uid 2012 and unsearchable for the postgres user.
            - {name: data, mountPath: /var/lib/postgresql/data, subPath: data/data}
          readinessProbe: {exec: {command: [pg_isready, -U, qstick]}, initialDelaySeconds: 10, periodSeconds: 10}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: postgres}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: plex-services}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
