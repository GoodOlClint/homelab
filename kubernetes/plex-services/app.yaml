apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: plex-services
  annotations: {secrets.infisical.com/auto-reload: "true"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seerr}}
  template:
    metadata: {labels: {app: seerr}}
    spec:
      enableServiceLinks: false
      # Reaps the image's zombies — the compose file ran it with init: true.
      shareProcessNamespace: true
      affinity: {nodeAffinity: {preferredDuringSchedulingIgnoredDuringExecution: [{weight: 100, preference: {matchExpressions: [{key: kubernetes.io/hostname, operator: NotIn, values: [talos-cp-w]}]}}]}}
      securityContext: {runAsUser: 2009, runAsGroup: 2000, fsGroup: 2000, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: seerr
          image: ${REGISTRY}/ghcr.io/seerr-team/seerr:latest
          ports: [{containerPort: 5055}]
          env:
            - {name: TZ, value: "${TZ}"}
            - {name: DB_TYPE, value: postgres}
            - {name: DB_HOST, value: postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: seerr}
            - {name: DB_USER, value: seerr}
            - {name: DB_PASS, valueFrom: {secretKeyRef: {name: plex-services-secrets, key: SEERR_DB_PASS}}}
          volumeMounts:
            - {name: config, mountPath: /app/config, subPath: data}
          readinessProbe: {httpGet: {path: /api/v1/status, port: 5055}, initialDelaySeconds: 20, periodSeconds: 10}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: seerr}}
---
