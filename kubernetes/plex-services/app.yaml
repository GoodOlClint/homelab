apiVersion: apps/v1
kind: Deployment
metadata:
  name: libation
  namespace: plex-services
  annotations: {secrets.infisical.com/auto-reload: "true"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: libation}}
  template:
    metadata: {labels: {app: libation}}
    spec:
      enableServiceLinks: false
      affinity: {nodeAffinity: {preferredDuringSchedulingIgnoredDuringExecution: [{weight: 100, preference: {matchExpressions: [{key: kubernetes.io/hostname, operator: NotIn, values: [talos-cp-w]}]}}]}}
      securityContext: {runAsUser: 2013, runAsGroup: 2000, fsGroup: 2000, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: libation
          # Pinned (ADR 0018): CLI-only installs skip GUI-run migrations.
          image: ${REGISTRY}/docker.io/rmcrackan/libation:13.7.10
          env:
            - {name: TZ, value: "${TZ}"}
            - {name: SLEEP_TIME, value: "6h"}
            - {name: LIBATION_MASTER_KEY, valueFrom: {secretKeyRef: {name: plex-services-secrets, key: LIBATION_MASTER_KEY}}}
          volumeMounts:
            - {name: config, mountPath: /config, subPath: data}
            # ADR 0018: in-progress staging on the same export as the library, so the publish is a rename.
            - {name: media, mountPath: /data, subPath: data/media/Audiobooks}
            - {name: media, mountPath: /tmp, subPath: data/media/.libation-inprogress}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: libation}}
        - {name: media, persistentVolumeClaim: {claimName: media}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: pg-backup, namespace: plex-services}
spec:
  schedule: "0 2 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          initContainers:
            - name: pgdump
              image: ${REGISTRY}/docker.io/library/postgres:17
              imagePullPolicy: IfNotPresent
              command: [sh, -ec, 'f=/backups/pg_dumpall-$(date +%F).sql.gz; pg_dumpall -h postgres -U qstick | gzip > "$f.tmp" && mv "$f.tmp" "$f"; find /backups -name "pg_dumpall-*.sql.gz" -mtime +30 -delete']
              env:
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: plex-services-secrets, key: POSTGRES_PASSWORD}}}
              volumeMounts:
                - {name: backups, mountPath: /backups, subPath: data}
          containers:
            - name: pbs-push
              image: ${REGISTRY}/homelab/proxmox-backup-client:trixie
              imagePullPolicy: IfNotPresent
              # The trailing snapshot list is the verification signal: judge this lane by snapshot recency in the log, never by exit code.
              command: [sh, -ec, 'proxmox-backup-client namespace create databases 2>/dev/null || true; proxmox-backup-client backup plex-services-postgres.pxar:/backups --ns databases --backup-id plex-services-postgres; proxmox-backup-client snapshot list --ns databases | tail -5']
              env:
                - {name: PBS_REPOSITORY, value: "${PBS_REPOSITORY}"}
                - {name: PBS_PASSWORD, valueFrom: {secretKeyRef: {name: pbs-secrets, key: PBS_PASSWORD}}}
                - {name: PBS_FINGERPRINT, valueFrom: {secretKeyRef: {name: pbs-secrets, key: PBS_FINGERPRINT}}}
              volumeMounts:
                - {name: backups, mountPath: /backups, subPath: data}
          volumes:
            - {name: backups, persistentVolumeClaim: {claimName: backups}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex-services
  namespace: plex-services
  annotations: {traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd}
spec:
  ingressClassName: traefik
  rules:
    - host: sonarr.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: sonarr, port: {number: 8989}}}}]}
    - host: radarr.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: radarr, port: {number: 7878}}}}]}
    - host: lidarr.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: lidarr, port: {number: 8686}}}}]}
    - host: prowlarr.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: prowlarr, port: {number: 9696}}}}]}
    - host: bazarr.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: bazarr, port: {number: 6767}}}}]}
    - host: sabnzbd.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: sabnzbd, port: {number: 8080}}}}]}
    - host: tautulli.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: tautulli, port: {number: 8181}}}}]}
---
# Seerr keeps its own (Plex) login and is also reached through the tunnel: no forward-auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: seerr, namespace: plex-services}
spec:
  ingressClassName: traefik
  rules:
    - host: seerr.${DOMAIN}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: seerr, port: {number: 5055}}}}]}
