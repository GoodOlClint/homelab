# One ceph-rbd volume per stateful service (ADR 0036 shape); pods mount subPath `data` so ext4's lost+found stays outside the app tree.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres, namespace: plex-services}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
