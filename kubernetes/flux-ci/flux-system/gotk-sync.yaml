# The ci cluster's Flux root (ADR 0063): the same public repository with no credential (ADR 0048).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: homelab, namespace: flux-system}
spec:
  interval: 5m
  url: https://github.com/GoodOlClint/homelab.git
  ref: {branch: main}
  ignore: |
    /*
    !/kubernetes/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: flux-system, namespace: flux-system}
spec:
  interval: 10m
  path: ./kubernetes/flux-ci
  prune: true
  sourceRef: {kind: GitRepository, name: homelab}
