# The BIND TSIG key (owned by the bind9 role in /infrastructure) as the env external-dns reads.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: external-dns, namespace: external-dns}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /infrastructure}
  managedKubeSecretReferences:
    - secretName: external-dns-tsig
      secretNamespace: external-dns
      template:
        data:
          EXTERNAL_DNS_RFC2136_TSIG_SECRET: "{{ .bind_tsig_key_secret.Value }}"
