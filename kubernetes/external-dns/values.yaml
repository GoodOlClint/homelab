image:
  repository: ${REGISTRY}/registry.k8s.io/external-dns/external-dns
provider:
  name: rfc2136
sources: [ingress, service]
domainFilters: [${INTERNAL_ZONES_YAML}]
policy: sync
txtOwnerId: talos
interval: 1m
deploymentAnnotations: {secrets.infisical.com/auto-reload: "true"}
env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom: {secretKeyRef: {name: external-dns-tsig, key: EXTERNAL_DNS_RFC2136_TSIG_SECRET}}
extraArgs:
  rfc2136-host: ${BIND}
  rfc2136-port: "53"
  rfc2136-zone: [${INTERNAL_ZONES_YAML}]
  rfc2136-tsig-keyname: dhcp-update-key
  rfc2136-tsig-secret-alg: hmac-sha256
  rfc2136-tsig-axfr: true
