apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: games, namespace: games}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /docker}
  managedKubeSecretReferences:
    - secretName: valheim-secrets
      secretNamespace: games
      template:
        data:
          SERVER_PASS: "{{ .valheim_server_password.Value }}"
          SUPERVISOR_HTTP_PASS: "{{ .valheim_supervisor_password.Value }}"
          # Optional key: absent in /docker today, so the join-code hook stays inert until the operator adds it.
          DISCORD_WEBHOOK: "{{ if .valheim_discord_webhook }}{{ .valheim_discord_webhook.Value }}{{ end }}"
