# The Cloudflare DNS token (external credential in /infrastructure) as the key the ACME solver reads.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: cloudflare-api-token, namespace: cert-manager}
spec:
  hostAPI: ${HOST_API}
  authentication:
    universalAuth:
      credentialsRef: {secretName: infisical-universal-auth, secretNamespace: infisical-operator}
      secretsScope: {projectId: "${PROJECT_ID}", envSlug: prod, secretsPath: /infrastructure}
  managedKubeSecretReferences:
    - secretName: cloudflare-api-token
      secretNamespace: cert-manager
      template:
        data:
          api-token: "{{ .cloudflare_dns_api_token.Value }}"
