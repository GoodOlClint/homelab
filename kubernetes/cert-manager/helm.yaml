apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: jetstack, namespace: cert-manager}
spec: {interval: 12h, url: https://charts.jetstack.io}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cert-manager, namespace: cert-manager}
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.1
      sourceRef: {kind: HelmRepository, name: jetstack}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  values:
    crds: {enabled: true}
    global: {leaderElection: {namespace: cert-manager}}
    # DNS-01 self-check must ask public resolvers: AdGuard forwards the service zone to BIND, which never
    # sees the _acme-challenge TXT (a deliberate, cert-manager-only exception to ADR 0012).
    dns01RecursiveNameservers: "1.1.1.1:53,1.0.0.1:53"
    dns01RecursiveNameserversOnly: true
