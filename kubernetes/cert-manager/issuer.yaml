apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: homelab-ca}
spec:
  ca: {secretName: homelab-ca}
---
# Let's Encrypt over Cloudflare DNS-01 (ADR 0040 P5b): the browser-facing wildcard. The token is
# Infisical /infrastructure/cloudflare_dns_api_token through secrets.yaml.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: letsencrypt}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef: {name: letsencrypt-account}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: {name: cloudflare-api-token, key: api-token}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: letsencrypt-staging}
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef: {name: letsencrypt-staging-account}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: {name: cloudflare-api-token, key: api-token}
