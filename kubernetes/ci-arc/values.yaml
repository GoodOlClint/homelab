githubConfigSecret: github-app
minRunners: 0
maxRunners: 3
listenerTemplate:
  spec:
    nodeSelector: {node-role.kubernetes.io/control-plane: ""}
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    containers:
      - name: listener
        resources: {requests: {cpu: 20m, memory: 64Mi}}
template:
  spec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        resources: {requests: {cpu: 10m, memory: 32Mi}}
        volumeMounts:
          - {name: dind-externals, mountPath: /home/runner/tmpDir}
      - name: dind
        image: docker:dind
        args: ["dockerd", "--host=unix:///var/run/docker.sock", "--group=$(DOCKER_GROUP_GID)"]
        env:
          - {name: DOCKER_GROUP_GID, value: "123"}
        securityContext: {privileged: true}
        restartPolicy: Always
        resources: {requests: {cpu: 1000m, memory: 2Gi}}
        startupProbe:
          exec: {command: [docker, info]}
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
          - {name: dind-sock, mountPath: /var/run}
          - {name: dind-externals, mountPath: /home/runner/externals}
          - {name: cache, mountPath: /opt/pve-integration}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - {name: DOCKER_HOST, value: unix:///var/run/docker.sock}
          - {name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS, value: "120"}
        resources: {requests: {cpu: 250m, memory: 512Mi}}
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
          - {name: dind-sock, mountPath: /var/run}
    volumes:
      - {name: work, emptyDir: {}}
      - {name: dind-sock, emptyDir: {}}
      - {name: dind-externals, emptyDir: {}}
      # Node-local: a run's provision, test and cleanup jobs share state here, so they must land on one
      # worker. Holds for one worker only; a second needs the consumer to pass job state as workflow
      # artifacts first (docs/ci-cluster-plan.md, "What changes in this plan so it scales").
      - name: cache
        hostPath: {path: /var/mnt/scratch/pve-integration, type: DirectoryOrCreate}
