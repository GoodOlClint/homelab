apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [helm.yaml]
# No hash suffix because a HelmRelease valuesFrom reference is not rewritten.
configMapGenerator:
  - name: arc-runner-values
    namespace: arc-runners
    files: [values.yaml]
    options: {disableNameSuffixHash: true}
