# Per-node install bindings for scripts/bake-answer.sh.
# Copy to network-data/local/host-bindings.yaml (gitignored) and fill in real values.
# These are site bindings (MACs, IPs, domain) — kept out of the public repo.
#
#   install_nic_mac : MAC of the install/mgmt NIC (i226-V on MS-01, I225-V on pve),
#                     the one cabled to the VLAN 30 mgmt switch port at install time.
#   install_cidr    : VLAN 30 mgmt address/CIDR for the fresh install.
#   install_gateway : VLAN 30 gateway (pfSense).
#   root_ssh_key    : operator SSH public key (goes into the installed root account).
#   boot_disks      : pve ONLY — the two 980 PRO 500G device names (boot mirror).
#                     Omit for crete/crete2 (their template hard-codes both 1TB NVMe).

nodes:
  crete:
    fqdn: "crete.example.internal"
    mailto: "root@example.internal"
    install_nic_mac: "aa:bb:cc:dd:ee:01"
    install_cidr: "172.16.30.103/24"
    install_gateway: "172.16.30.1"
    root_ssh_key: "ssh-ed25519 AAAA... operator@example"

  crete2:
    fqdn: "crete2.example.internal"
    mailto: "root@example.internal"
    install_nic_mac: "aa:bb:cc:dd:ee:02"
    install_cidr: "172.16.30.106/24"
    install_gateway: "172.16.30.1"
    root_ssh_key: "ssh-ed25519 AAAA... operator@example"

  pve:
    fqdn: "pve.example.internal"
    mailto: "root@example.internal"
    install_nic_mac: "aa:bb:cc:dd:ee:03"
    install_cidr: "172.16.30.104/24"
    install_gateway: "172.16.30.1"
    root_ssh_key: "ssh-ed25519 AAAA... operator@example"
    boot_disks: ["nvme0n1", "nvme2n1"] # the two 980 PRO 500G — VERIFY device names at install
