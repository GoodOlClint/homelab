---
# Patch the cluster nodes one at a time. When apt has work, the node is emptied
# FIRST (each Talos guest drained through its own cluster's kubeconfig, a cluster
# not built yet skipped; HA node-maintenance so shutdown_policy=migrate moves
# the resources, ceph noout) so a wedged upgrade never strands guests on it;
# then dist-upgrade, a reboot only if the newest installed kernel is not the
# running one, and the recovery tail — which always runs, so a re-run heals a
# half-finished node. The next node starts only once Ceph is HEALTH_OK and the
# Talos node is Ready again.
- name: Update cluster nodes serially
  hosts: proxmox
  serial: 1
  vars:
    talos_secrets: "{{ playbook_dir }}/../../kubernetes/talos/.secrets"
    talos_node_map: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../terraform/talos-nodes.json') | from_json }}"
    kubeconfig: "{{ talos_secrets }}/kubeconfig"
  tasks:
    - name: Refuse to start on an unhealthy cluster (a noout-only warning is ours)
      ansible.builtin.command: ceph health
      register: _health
      changed_when: false
      check_mode: false
      failed_when: not (_health.stdout is match('HEALTH_OK') or _health.stdout is match('HEALTH_WARN noout flag'))

    - name: Find this node's Talos guests
      ansible.builtin.shell: |
        set -o pipefail
        qm list | awk '$2 ~ /^talos-/ {print $2}'
      args:
        executable: /bin/bash
      register: _talos_found
      changed_when: false
      check_mode: false

    - name: Refuse a Talos guest the node map does not know
      ansible.builtin.assert:
        that: _talos_found.stdout_lines | difference(talos_node_map.keys() | list) | length == 0
        fail_msg: >-
          {{ _talos_found.stdout_lines | difference(talos_node_map.keys() | list) | join(', ') }}
          not in terraform/talos-nodes.json, so its cluster and kubeconfig are unknown
        quiet: true

    - name: Find each Talos guest's cluster kubeconfig
      ansible.builtin.stat:
        path: "{{ talos_secrets }}{{ '' if talos_node_map[item].cluster == 'services' else '/' ~ talos_node_map[item].cluster }}/kubeconfig"
      loop: "{{ _talos_found.stdout_lines }}"
      delegate_to: localhost
      register: _talos_kc
      check_mode: false

    # A cluster with no kubeconfig yet (the ci cluster before it is built) has nothing to drain.
    - name: Keep the Talos guests whose cluster has a kubeconfig
      ansible.builtin.set_fact:
        _talos: >-
          {%- set out = [] -%}
          {%- for r in _talos_kc.results if r.stat.exists -%}
          {{- out.append({'name': r.item, 'cluster': talos_node_map[r.item].cluster, 'kubeconfig': r.stat.path}) -}}
          {%- endfor -%}
          {{ out }}
        _talos_skipped: "{{ _talos_kc.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
        _talos_services: >-
          {{ _talos_kc.results | selectattr('stat.exists') | map(attribute='item')
             | select('in', talos_node_map | dict2items | selectattr('value.cluster', 'equalto', 'services') | map(attribute='key') | list)
             | first | default('') }}

    - name: Say which Talos guests have no cluster kubeconfig to drain through
      ansible.builtin.debug:
        msg: "{{ _talos_skipped | join(', ') }}: no kubeconfig for its cluster here, not drained (cluster not built)"
      when: _talos_skipped | length > 0

    # The apt module skips cache.update() under check_mode, so the dry run below
    # would otherwise plan against whatever apt-daily last fetched.
    - name: Refresh the apt lists
      ansible.builtin.apt:
        update_cache: true
      check_mode: false
      changed_when: false

    - name: Check whether apt has work
      ansible.builtin.apt:
        upgrade: dist
      check_mode: true
      register: _apt_plan

    - name: Find the Plex CT if it lives on this node
      ansible.builtin.shell: |
        set -o pipefail
        pct list | awk '$NF == "plex" {print $1}'
      args:
        executable: /bin/bash
      register: _plex_ct
      changed_when: false
      check_mode: false

    - name: Find workloads with an idle check on this node's Talos guest
      delegate_to: localhost
      when: _apt_plan is changed and not ansible_check_mode and _talos_services | length > 0
      block:
        - name: List Deployments and the pods on this node
          ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} get {{ item }} -A -o json
          loop: ["deployments", "pods --field-selector spec.nodeName={{ _talos_services }}"]
          register: _kube
          changed_when: false
          check_mode: false

        - name: Keep the annotated Deployments that have a pod here
          ansible.builtin.set_fact:
            _idle_workloads: >-
              {%- set out = [] -%}
              {%- for d in ((_kube.results[0].stdout | from_json)['items']) -%}
              {%- set check = (d.metadata.annotations | default({}, true)).get('homelab/idle-check', '') -%}
              {%- set found = namespace(here=false) -%}
              {%- if check -%}
              {%- for p in ((_kube.results[1].stdout | from_json)['items']) if p.metadata.namespace == d.metadata.namespace -%}
              {%- set m = namespace(ok=true) -%}
              {%- for k, v in d.spec.selector.matchLabels.items() -%}
              {%- if (p.metadata.labels | default({}, true)).get(k) != v -%}{%- set m.ok = false -%}{%- endif -%}
              {%- endfor -%}
              {%- if m.ok -%}{%- set found.here = true -%}{%- endif -%}
              {%- endfor -%}
              {%- endif -%}
              {%- if found.here -%}
              {{- out.append({'ns': d.metadata.namespace, 'name': d.metadata.name, 'check': check}) -}}
              {%- endif -%}
              {%- endfor -%}
              {{ out }}

    - name: Wait until every service on this node is idle
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/wait_until_idle.yml"
      vars:
        idle_node: true
        idle_pct_vmid: "{{ _plex_ct.stdout }}"
        idle_workloads: "{{ _idle_workloads | default([]) }}"
      when: >-
        _apt_plan is changed and not ansible_check_mode
        and (_plex_ct.stdout | length > 0 or _idle_workloads | default([]) | length > 0)

    - name: Skip this node, someone is using a service on it
      ansible.builtin.debug:
        msg: "{{ idle_gave_up | join(', ') }} never went idle within the wait, so {{ inventory_hostname }} is not drained or upgraded this run"
      when: idle_gave_up | default([]) | length > 0

    - name: Empty the node and upgrade
      when: _apt_plan is changed and not ansible_check_mode and idle_gave_up | default([]) | length == 0
      block:
        - name: Drain the Talos guests, each through its own cluster
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ item.kubeconfig }} drain {{ item.name }}
            --ignore-daemonsets --delete-emptydir-data --timeout=300s
          loop: "{{ _talos }}"
          loop_control:
            label: "{{ item.cluster }}/{{ item.name }}"
          delegate_to: localhost
          changed_when: true

        - name: Enter HA node maintenance
          ansible.builtin.command: ha-manager crm-command node-maintenance enable {{ inventory_hostname }}
          changed_when: true

        - name: Wait for HA resources to leave this node
          ansible.builtin.shell: |
            set -o pipefail
            ha-manager status | grep -c "({{ inventory_hostname }}, " || true
          args:
            executable: /bin/bash
          register: _ha_here
          until: _ha_here.stdout == "0"
          retries: 60
          delay: 10
          changed_when: false

        - name: Set Ceph noout
          ansible.builtin.command: ceph osd set noout
          changed_when: true

        - name: Upgrade packages
          ansible.builtin.apt:
            upgrade: dist
            autoremove: true
            autoclean: true

        - name: Compare the running kernel with the newest installed one
          ansible.builtin.shell: |
            set -o pipefail
            newest=$(ls /boot/vmlinuz-* | sed 's#.*/vmlinuz-##' | sort -V | tail -n 1)
            [ "$newest" != "$(uname -r)" ] && echo reboot || true
          args:
            executable: /bin/bash
          register: _kernel
          changed_when: false

        - name: Reboot into the new kernel
          ansible.builtin.reboot:
            reboot_timeout: 600
          when: _kernel.stdout == 'reboot'

    - name: Wait for the node to rejoin the cluster
      ansible.builtin.shell: |
        set -o pipefail
        pvecm status | grep -q "Quorate: *Yes" && ha-manager status | grep "^lrm {{ inventory_hostname }} "
      args:
        executable: /bin/bash
      register: _rejoined
      until: _rejoined.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      check_mode: false

    - name: Unset Ceph noout
      ansible.builtin.command: ceph osd unset noout
      changed_when: true
      when: "'noout' in _health.stdout or (_apt_plan is changed and idle_gave_up | default([]) | length == 0)"

    # Right after a reboot crm-command answers "no such cluster node" for a quorate member.
    - name: Leave HA node maintenance
      ansible.builtin.command: ha-manager crm-command node-maintenance disable {{ inventory_hostname }}
      register: _maint_off
      until: _maint_off.rc == 0
      retries: 18
      delay: 10
      changed_when: true
      when: "'(maintenance mode' in _rejoined.stdout"

    - name: Uncordon the Talos guests
      ansible.builtin.command: kubectl --kubeconfig {{ item.kubeconfig }} uncordon {{ item.name }}
      loop: "{{ _talos }}"
      loop_control:
        label: "{{ item.cluster }}/{{ item.name }}"
      delegate_to: localhost
      register: _uncordon
      until: _uncordon.rc == 0
      retries: 12
      delay: 10
      changed_when: "'already uncordoned' not in _uncordon.stdout"

    - name: Wait for the Talos nodes to be Ready
      ansible.builtin.shell: >-
        kubectl --kubeconfig {{ item.kubeconfig }} get node {{ item.name }}
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      loop: "{{ _talos }}"
      loop_control:
        label: "{{ item.cluster }}/{{ item.name }}"
      delegate_to: localhost
      register: _ready
      until: _ready.stdout == "True"
      retries: 60
      delay: 10
      changed_when: false

    - name: Wait for Ceph HEALTH_OK
      ansible.builtin.command: ceph health
      register: _health_after
      until: "'HEALTH_OK' in _health_after.stdout"
      retries: 90
      delay: 10
      changed_when: false
