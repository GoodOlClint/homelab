---
# WP2 — Proxmox host/cluster plane (pvecm, corosync rings, Ceph, VIP).
# Day-1 order: answer-file install → `make hosts-apply` (bond/vmbr0/VLAN 20) →
# THIS playbook. It runs before any guest exists, so it must not depend on
# Infisical — site data comes only from vlans.yaml + host-bindings.yaml.
# Inventory: ansible/inventory/proxmox.yaml (see proxmox.example.yml — the
# first host in the group creates the cluster).

- name: Proxmox cluster hosts
  hosts: proxmox
  become: true
  pre_tasks: &hosts_pre_tasks
    # Tier-1 bootstrap creds (SOPS, not Infisical — no guest dependency):
    # the cluster create/join API modules authenticate as root@pam with
    # bootstrap.proxmox_password (ADR 0023).
    - name: Load bootstrap credentials (SOPS Tier 1)
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../group_vars/bootstrap.sops.yml"
        expressions: evaluate-on-load
      tags: [always]

    - name: Load VLAN definitions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../network-data/vlans.yaml"
        name: network_data
      tags: [always]

    - name: Load host bindings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../network-data/local/host-bindings.yaml"
        name: host_bindings
      tags: [always]

    # Centralized NFS tuning (nfs_mount_options) lives in the gitignored
    # group_vars/all.yml; the hosts plane must not hard-depend on it existing.
    - name: Load global vars (NFS tuning etc.)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all.yml"
      failed_when: false
      tags: [always]

    # Runtime secrets only once the vault answers (ADR 0041's ACME key); a Day-1
    # node has no guest to ask, so an unreachable Infisical skips instead of failing.
    - name: Probe Infisical
      ansible.builtin.uri:
        url: "{{ bootstrap_config.infisical_url }}/api/status"
        timeout: 5
      register: _pve_infisical
      delegate_to: localhost
      become: false
      run_once: true
      failed_when: false
      tags: [always]

    - name: Load runtime secrets
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/infisical_login.yml"
        apply:
          tags: [always]
      run_once: true
      when: _pve_infisical.status | default(0) == 200
      tags: [always]
  roles:
    - proxmox_host

# worklab is not a cluster member (ADR 0031) but is a PVE endpoint Terraform talks to
# (talos.tf `proxmox.worklab`), so it trusts the root and serves a root-chained node cert
# under its own name only — no `pve` SAN (ADR 0041).
- name: worklab (standalone PVE)
  hosts: worklab
  become: true
  pre_tasks: *hosts_pre_tasks
  roles:
    - ca_trust
  tasks:
    - name: Node certificate
      ansible.builtin.include_role:
        name: proxmox_host
        tasks_from: acme
      vars:
        proxmox_host_cert_extra_domains: []
      tags: [acme]
