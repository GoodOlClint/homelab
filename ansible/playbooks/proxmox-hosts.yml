---
# WP2 — Proxmox host/cluster plane (pvecm, corosync rings, Ceph, VIP).
# Day-1 order: answer-file install → `make hosts-apply` (bond/vmbr0/VLAN 20) →
# THIS playbook. It runs before any guest exists, so it must not depend on
# Infisical — site data comes only from vlans.yaml + host-bindings.yaml.
# Inventory: ansible/inventory/proxmox.yaml (see proxmox.example.yml — the
# first host in the group creates the cluster).

- name: Proxmox cluster hosts
  hosts: proxmox
  become: true
  pre_tasks:
    # Tier-1 bootstrap creds (SOPS, not Infisical — no guest dependency):
    # the cluster create/join API modules authenticate as root@pam with
    # bootstrap.proxmox_password (ADR 0023).
    - name: Load bootstrap credentials (SOPS Tier 1)
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../group_vars/bootstrap.sops.yml"
        expressions: evaluate-on-load
      tags: [always]

    - name: Load VLAN definitions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../network-data/vlans.yaml"
        name: network_data
      tags: [always]

    - name: Load host bindings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../network-data/local/host-bindings.yaml"
        name: host_bindings
      tags: [always]

    # Centralized NFS tuning (nfs_mount_options) lives in the gitignored
    # group_vars/all.yml; the hosts plane must not hard-depend on it existing.
    - name: Load global vars (NFS tuning etc.)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all.yml"
      failed_when: false
      tags: [always]
  roles:
    - proxmox_host
