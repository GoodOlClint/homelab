---
# Infrastructure Playbook — Three-Phase Provisioning
#
# Pre-flight: Load secrets, VLAN data, and local overrides
#
# Phase 1: Bootstrap core services (DNS, AdGuard, Infisical, OpenObserve, PBS,
#   UniFi, apt-cache)
#   Each VM gets its primary role only — no monitoring clients yet.
#   Order matters: DNS → AdGuard → Infisical → OpenObserve → proxmox-backup → UniFi
#
# Phase 2: Monitoring clients (rsyslog + telegraf) on all infrastructure VMs
#   Runs after OpenObserve is up and ready to receive logs/metrics.
#
# Phase 3: Provision monitoring users (Proxmox, UniFi, Synology)
#   Runs last — all target services must be running first.

# --- Pre-flight: Load secrets, VLAN data, and overrides ---
- name: Pre-flight setup
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load all configuration and secrets
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/full_pre_tasks.yml"

    - name: Check for rendered policy artifact when enabled
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../network-data/generated/policy_render.public.json"
      register: rendered_policy_artifact_file
      delegate_to: localhost
      become: false
      run_once: true
      when: use_rendered_policy | default(false)

    - name: Require rendered policy artifact when enabled
      ansible.builtin.assert:
        that:
          - rendered_policy_artifact_file.stat.exists
        fail_msg: "Rendered policy artifact missing. Run: make pr6-render"
      run_once: true
      when: use_rendered_policy | default(false)

    - name: Load rendered policy artifact when enabled
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../network-data/generated/policy_render.public.json"
        name: rendered_policy
      run_once: true
      when: use_rendered_policy | default(false)

    - name: Show rendered policy artifact summary when enabled
      ansible.builtin.debug:
        msg: >-
          Rendered policy enabled: zones={{ rendered_policy.summary.zone_count }},
          rules={{ rendered_policy.summary.rule_count }}
      run_once: true
      when: use_rendered_policy | default(false)
  roles: []

# ============================================================
# Phase 1: Bootstrap core services (no monitoring clients)
# ============================================================

- name: "Phase 0: Fleet trust root (ADR 0041)"
  hosts: all
  become: true
  roles:
    - ca_trust
  tags:
    - phase1
    - ca-trust

- name: "Phase 1: Configure dns VM (BIND9)"
  hosts: dns
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - &load_all_config_task
      name: Load all configuration and secrets
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/full_pre_tasks.yml"
      tags: [always]
    - name: Load host bindings (PVE VIP for the service zone)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../network-data/local/host-bindings.yaml"
        name: host_bindings
      tags: [always]
  roles:
    - bind9
  post_tasks:
    - name: Publish the service-zone records (ADR 0040)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/dns_records.yml"
      when: inventory_hostname == groups['dns'][0]
      tags: [dns-records]
  tags:
    - phase1
    - dns

- name: "Phase 1: Configure AdGuard VM"
  hosts: adguard
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  roles:
    - adguard
  tags:
    - phase1
    - adguard

- name: "Phase 1: Infisical secrets management"
  hosts: infisical
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  roles:
    - dns_config
    - geerlingguy.docker
    - infisical
    - pbs_client
    - hardening
  tags:
    - phase1
    - infisical

- name: "Phase 1: Configure proxmox-backup VM"
  hosts: proxmox-backup
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  roles:
    - dns_config
    - proxmox_backup
  tags:
    - phase1
    - proxmox-backup

- name: "Phase 1: Configure UniFi Network Controller"
  hosts: unifi
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  roles:
    - dns_config
    - unifi
  tags:
    - phase1
    - unifi

- name: "Phase 1: Configure apt-cache VM (apt-cacher-ng)"
  hosts: apt-cache
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  roles:
    - dns_config
    - apt_cacher_ng
  tags:
    - phase1
    - apt-cache

- name: "Phase 1: Configure control LXC (MeshCentral + Portainer server, ADR 0030)"
  hosts: control
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  vars:
    infisical_secret_paths: ["/shared", "/control"]
    infisical_agent_templates:
      - name: pbs
        dest_path: /etc/infisical/secrets/pbs.env
        template_src: secrets/pbs.env.tpl.j2
  roles:
    - infisical_client
    - pbs_client
    - control
    - rsyslog_client
    - telegraf
  tags:
    - phase1
    - control

- name: "Phase 1: Configure pdm VM (Proxmox Datacenter Manager, ADR 0030)"
  hosts: pdm
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  roles:
    - pdm
    - rsyslog_client
    - telegraf
  tags:
    - phase1
    - pdm

# PXE netboot for bare-metal PVE installs (ADR 0026). First Debian 13 guest in
# the fleet: dns_config is netplan-specific and deliberately NOT applied here.
- name: "Phase 1: Configure pxe VM (PVE netboot, answer files by MAC)"
  hosts: pxe
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load all configuration and secrets
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/full_pre_tasks.yml"
      tags: [always]
    - name: Load host bindings (install-NIC MACs for the answer matcher)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../network-data/local/host-bindings.yaml"
        name: host_bindings
      tags: [always]
  roles:
    - pxe
  tags:
    - phase1
    - pxe

# ============================================================
# Phase 2: Monitoring clients (OpenObserve is now running)
# ============================================================

- name: "Phase 2: Configure monitoring clients on all infrastructure VMs"
  hosts: dns,adguard,infisical,proxmox-backup,unifi,apt-cache
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  roles:
    - rsyslog_client
    - telegraf
  tags:
    - phase2
    - monitoring

# ============================================================
# Phase 3: Provision monitoring users (services are now running)
# ============================================================

- name: "Phase 3: Provision monitoring users"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - *load_all_config_task
  roles:
    - role: monitoring_users
      tags:
        - monitoring-users
        - users
  tags:
    - phase3
    - monitoring-users
