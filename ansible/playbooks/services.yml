---
- name: Configure plex VM
  hosts: plex
  become: true

  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load all configuration and secrets
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/full_pre_tasks.yml"
      tags: [always]
  vars:
    infisical_secret_paths: ["/shared", "/plex"]
    infisical_agent_templates:
      - name: pbs
        dest_path: /etc/infisical/secrets/pbs.env
        template_src: secrets/pbs.env.tpl.j2
      - name: plex
        dest_path: /etc/infisical/secrets/plex.env
        template_src: secrets/plex.env.tpl.j2
  roles:
    - infisical_client
    - dns_config
    - pbs_client
    - plex
    - plex_certificate
    - rsyslog_client
    - telegraf
  tags:
    - plex

- name: Configure llm VM
  hosts: llm
  become: true

  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load all configuration and secrets
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/full_pre_tasks.yml"
      tags: [always]
  vars:
    infisical_secret_paths: ["/shared", "/llm"]
    infisical_agent_templates:
      - name: pbs
        dest_path: /etc/infisical/secrets/pbs.env
        template_src: secrets/pbs.env.tpl.j2
      - name: llm
        dest_path: /etc/infisical/secrets/llm.env
        template_src: secrets/llm.env.tpl.j2
        post_command: "systemctl restart caddy"
  roles:
    - infisical_client
    - dns_config
    - pbs_client
    - llm
    - rsyslog_client
    - telegraf
  tags:
    - llm

- name: Configure mcp VM (ADR 0052)
  hosts: mcp
  become: true

  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load all configuration and secrets
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/full_pre_tasks.yml"
      tags: [always]
    # Before infisical_client, so the agent's first render finds every key.
    - name: Gateway secrets, the Proxmox token and the OpenObserve account
      ansible.builtin.import_role:
        name: mcp
        tasks_from: accounts
  vars:
    infisical_secret_paths: ["/mcp", "/plex", "/llm", "/codeintel"]
    infisical_agent_templates:
      - name: mcp
        dest_path: /etc/infisical/secrets/mcp.env
        template_src: secrets/mcp.env.tpl.j2
        post_command: "systemctl try-restart homelab-gateway"
      - name: mcp-tokens
        dest_path: /etc/infisical/secrets/mcp-tokens.json
        template_src: secrets/mcp-tokens.json.tpl.j2
        post_command: "systemctl try-restart homelab-gateway"
      - name: mcp-users
        dest_path: /etc/infisical/secrets/mcp-users.json
        template_src: secrets/mcp-users.json.tpl.j2
        post_command: "systemctl try-restart homelab-gateway"
  roles:
    - infisical_client
    - dns_config
    - mcp
    - rsyslog_client
    - telegraf
  tags:
    - mcp

- name: Configure scratch guests (ADR 0054)
  hosts: scratch
  become: true

  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load all configuration and secrets
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/full_pre_tasks.yml"
      tags: [always]
  roles:
    - apt_proxy
    - scratch
  tags:
    - scratch
