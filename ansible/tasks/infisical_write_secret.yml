---
# Upsert a secret in Infisical (create if missing, update if changed, skip if current)
# Required variables: secret_name, secret_value, secret_path, secret_comment (optional)

# The loaded secrets fact already holds every folder the loader reads (infisical_login.yml),
# so the folder POST and the per-key read only run for a path outside it (bootstrap seeding).
- name: "Locate {{ secret_path | default('/') }} in the loaded secrets"
  ansible.builtin.set_fact:
    _write_cached: "{{ (secrets | default({})) | length > 0 and (_folder == 'shared' or _folder in secrets) }}"
    _write_known: "{{ (secrets | default({})) if _folder == 'shared' else (secrets | default({}))[_folder] | default({}) }}"
  vars:
    _folder: "{{ secret_path | default('/') | regex_replace('^/', '') | replace('-', '_') }}"
  no_log: true  # the folder's live secret values

- name: "Ensure Infisical folder {{ secret_path }} exists"
  ansible.builtin.uri:
    url: "{{ bootstrap_config.infisical_url }}/api/v2/folders"
    method: POST
    headers:
      Authorization: "Bearer {{ infisical_login.login_data.access_token }}"
    body_format: json
    body:
      projectId: "{{ bootstrap_config.infisical_project_id }}"
      environment: "prod"
      name: "{{ secret_path | regex_replace('^/', '') }}"
      path: "/"
    status_code: [200, 400]  # 400 = already exists
  delegate_to: localhost
  become: false
  no_log: true  # failure output would dump the Authorization header
  when:
    - secret_path | default('/') != '/'
    - not (_write_cached | bool)

- name: "Read existing secrets at {{ secret_path | default('/') }}"
  infisical.vault.read_secrets:
    url: "{{ bootstrap_config.infisical_url }}"
    auth_method: token_auth
    token: "{{ infisical_login.login_data.access_token }}"
    project_id: "{{ bootstrap_config.infisical_project_id }}"
    env_slug: "prod"
    path: "{{ secret_path | default('/') }}"
    as_dict: true
  delegate_to: localhost
  become: false
  register: _infisical_existing
  failed_when: false
  no_log: true  # result carries every secret at the path
  when: not (_write_cached | bool)

- name: "Evaluate {{ secret_name }} state"
  ansible.builtin.set_fact:
    _secret_exists: "{{ _existing[secret_name] is defined }}"
    _secret_current: "{{ _existing[secret_name] | default('') }}"
  vars:
    _existing: "{{ _write_known if _write_cached | bool else (_infisical_existing.secrets | default({})) }}"
  no_log: true  # _secret_current is a live secret value

- name: "Create {{ secret_name }} in Infisical"
  infisical.vault.create_secret:
    url: "{{ bootstrap_config.infisical_url }}"
    auth_method: token_auth
    token: "{{ infisical_login.login_data.access_token }}"
    project_id: "{{ bootstrap_config.infisical_project_id }}"
    env_slug: "prod"
    path: "{{ secret_path | default('/') }}"
    secret_name: "{{ secret_name }}"
    secret_value: "{{ secret_value }}"
    secret_comment: "{{ secret_comment | default('Auto-generated by Ansible') }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not _secret_exists

- name: "Update {{ secret_name }} in Infisical"
  infisical.vault.update_secret:
    url: "{{ bootstrap_config.infisical_url }}"
    auth_method: token_auth
    token: "{{ infisical_login.login_data.access_token }}"
    project_id: "{{ bootstrap_config.infisical_project_id }}"
    env_slug: "prod"
    path: "{{ secret_path | default('/') }}"
    secret_name: "{{ secret_name }}"
    secret_value: "{{ secret_value }}"
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - _secret_exists
    - _secret_current != secret_value
