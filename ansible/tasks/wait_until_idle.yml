---
# Polls idle_cmd (bash; exit 0 = idle) once a minute and passes after idle_quiet_minutes consecutive
# idle polls. A failing or unreadable check counts as busy. On give-up after idle_max_minutes the
# service is appended to idle_gave_up (a host fact) and the play carries on; the caller skips.
# Inputs: idle_service (name for messages), idle_cmd (omit for plex), optional idle_delegate_to, idle_become,
# idle_pct_vmid (run the check inside that CT through pct exec).
- name: Wait until {{ idle_service }} is idle
  ansible.builtin.shell: |
    quiet=0
    for (( poll = 1; poll <= {{ idle_max_minutes | default(30) }}; poll++ )); do
      if bash -c "$IDLE_CMD" >/dev/null 2>&1; then quiet=$((quiet+1)); else quiet=0; fi
      (( quiet >= {{ idle_quiet_minutes | default(5) }} )) && exit 0
      sleep 60
    done
    exit 3
  args:
    executable: /bin/bash
  vars:
    _plex_cmd: >-
      T=$(grep -m1 '^plex_token=' /etc/infisical/secrets/plex.env | cut -d= -f2-);
      n=$(curl -sf --max-time 10 -H "X-Plex-Token: $T" http://localhost:32400/status/sessions
      | grep -o '<MediaContainer[^>]*size="[0-9]*"' | sed -E 's/.*size="([0-9]+)"/\1/');
      [ "$n" = 0 ]
    _cmd: "{{ idle_cmd | default(_plex_cmd) }}"
  environment:
    IDLE_CMD: "{{ ('pct exec ' ~ idle_pct_vmid ~ ' -- bash -c ' ~ (_cmd | quote)) if idle_pct_vmid is defined else _cmd }}"
  delegate_to: "{{ idle_delegate_to | default(inventory_hostname) }}"
  become: "{{ idle_become | default(false) }}"
  register: _idle_wait
  failed_when: _idle_wait.rc not in [0, 3]
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Record that {{ idle_service }} never went idle
  ansible.builtin.set_fact:
    idle_gave_up: "{{ idle_gave_up | default([]) + [idle_service] }}"
  when: _idle_wait is not skipped and _idle_wait.rc == 3
