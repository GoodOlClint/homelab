---
- name: Install parted and cloud-guest-utils
  ansible.builtin.apt:
    name:
      - parted
      - cloud-guest-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

  tags:
    - expand_disk
    - storage
    - packages

- name: Find root filesystem device
  ansible.builtin.shell: set -o pipefail; df / | tail -1 | awk '{print $1}' | sed 's/[0-9]*$//'
  register: root_device
  changed_when: false
  tags:
    - expand_disk
    - storage

- name: Find root partition number
  ansible.builtin.shell: set -o pipefail; df / | tail -1 | awk '{print $1}' | sed 's/.*[^0-9]//'
  register: root_partition
  changed_when: false
  tags:
    - expand_disk
    - storage

- name: Display detected root device and partition
  ansible.builtin.debug:
    msg: "Root device: {{ root_device.stdout }}, Root partition: {{ root_partition.stdout }}"
  tags:
    - expand_disk
    - storage

- name: Resize partition to use all available space
  ansible.builtin.command: growpart {{ root_device.stdout }} {{ root_partition.stdout }}
  register: growpart_result
  failed_when:
    - growpart_result.rc != 0
    - "'NOCHANGE' not in growpart_result.stdout"
  changed_when: "'CHANGED' in growpart_result.stdout"
  tags:
    - expand_disk
    - storage
    - resize

- name: Resize filesystem to use expanded partition # noqa: no-handler
  ansible.builtin.command: resize2fs {{ root_device.stdout }}{{ root_partition.stdout }}
  when: growpart_result.changed
  register: resize_result
  changed_when: true
  tags:
    - expand_disk
    - storage
    - resize
