---
- name: Verify required pre_tasks facts
  ansible.builtin.assert:
    that:
      - secrets is defined
      - secrets is mapping
    fail_msg: "Required facts not available. This role must run from a playbook that includes full_pre_tasks.yml."
    quiet: true

- name: Auto-generate plex_cert_pfx_password
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "plex_cert_pfx_password"
    secret_gen_cmd: "openssl rand -base64 32"
    secret_comment: "Plex PKCS#12 certificate password — auto-generated by Ansible"
    secret_infisical_path: "/plex"
    secret_dict_path: "plex"
  tags: [plex, certificate, secrets]

# Must exist before certbot runs: cert_client's first-issue hook calls it.
- name: Deploy certbot deploy hook script
  ansible.builtin.template:
    src: plex-cert-deploy.sh.j2
    dest: "{{ plex_certbot_deploy_hook }}"
    owner: root
    group: root
    mode: "0750"
  tags: [plex, certificate, tls]

- name: Issue the Let's Encrypt certificate
  ansible.builtin.include_role:
    name: cert_client
  vars:
    cert_client_issuer: letsencrypt
    cert_client_fqdn: "{{ plex_cert_domain }}"
    cert_client_deploy_hook: "{{ plex_certbot_deploy_hook }}"
  tags: [plex, certificate, tls]

- name: Check the PKCS#12 bundle against the live certificate
  ansible.builtin.stat:
    path: "{{ plex_pfx_path }}"
  register: plex_pfx_file
  tags: [plex, certificate, tls]

- name: Check the live certificate's mtime
  ansible.builtin.stat:
    path: "{{ plex_cert_dir }}/fullchain.pem"
    follow: true
  register: plex_live_cert
  tags: [plex, certificate, tls]

# Re-pack whenever the bundle predates the certificate (re-issue, restored guest): Plex silently falls back to plex.direct on a stale one.
- name: Run deploy hook to (re)create the PKCS#12 certificate
  ansible.builtin.command:
    cmd: "{{ plex_certbot_deploy_hook }}"
  when: not plex_pfx_file.stat.exists or plex_pfx_file.stat.mtime < plex_live_cert.stat.mtime
  tags: [plex, certificate, tls]

- name: Install xmlstarlet for XML manipulation
  ansible.builtin.apt:
    name: xmlstarlet
    state: present
  tags: [plex, certificate, tls]

- name: Read current Plex certificate preferences
  ansible.builtin.command:
    cmd: >
      xmlstarlet sel -t
      -v 'concat(//Preferences/@customCertificatePath, "|", //Preferences/@customCertificateKey, "|", //Preferences/@customCertificateDomain)'
      "{{ plex_preferences_path }}"
  register: _plex_cert_prefs
  changed_when: false
  no_log: true
  tags: [plex, certificate, tls]

- name: Configure Plex custom certificate path, key and domain
  ansible.builtin.command:
    cmd: >
      xmlstarlet ed --inplace
      -u '//Preferences/@customCertificatePath' -v '{{ plex_pfx_path }}'
      -i '//Preferences[not(@customCertificatePath)]' -t attr -n customCertificatePath -v '{{ plex_pfx_path }}'
      -u '//Preferences/@customCertificateKey' -v '{{ secrets.plex.plex_cert_pfx_password }}'
      -i '//Preferences[not(@customCertificateKey)]' -t attr -n customCertificateKey -v '{{ secrets.plex.plex_cert_pfx_password }}'
      -u '//Preferences/@customCertificateDomain' -v '{{ plex_cert_domain }}'
      -i '//Preferences[not(@customCertificateDomain)]' -t attr -n customCertificateDomain -v '{{ plex_cert_domain }}'
      "{{ plex_preferences_path }}"
  when: _plex_cert_prefs.stdout != plex_pfx_path ~ '|' ~ secrets.plex.plex_cert_pfx_password ~ '|' ~ plex_cert_domain
  no_log: true
  notify: restart plex
  tags: [plex, certificate, tls]
