---
# Runs from the play's pre_tasks so every /mcp key exists before the Infisical agent renders the gateway's files.
- name: Gateway bearer tokens in Infisical /mcp (one per principal)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "{{ item }}"
    secret_gen_cmd: "openssl rand -hex 32"
    secret_comment: "homelab-mcp gateway: {{ item }} — auto-generated by Ansible"
    secret_infisical_path: /mcp
    secret_dict_path: mcp
  loop: "{{ (mcp_agents.keys() | map('regex_replace', '^', 'gateway_token_') | list) + (mcp_users.keys() | map('regex_replace', '^', 'gateway_user_token_') | list) }}"

- name: Read-only deploy key for the private homelab-mcp repo
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: github_deploy_key
    secret_gen_cmd: "d=$(mktemp -d) && ssh-keygen -q -t ed25519 -N '' -C mcp-deploy -f \"$d/k\" && cat \"$d/k\" && rm -rf \"$d\""
    secret_comment: "homelab-mcp read-only deploy key (public half on GitHub: docs/operator-hand-steps.md)"
    secret_infisical_path: /mcp
    secret_dict_path: mcp

- name: OpenObserve account password
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: openobserve_password
    # OpenObserve requires upper, lower, digit and a special character.
    secret_gen_cmd: "printf 'Mcp-0%s' \"$(openssl rand -hex 24)\""
    secret_comment: "OpenObserve {{ mcp_openobserve_email }} password (homelab-mcp reads + mcp_audit ingest)"
    secret_infisical_path: /mcp
    secret_dict_path: mcp

- name: OpenObserve users
  ansible.builtin.uri:
    url: "https://openobserve.{{ service_domain }}/api/default/users"
    user: "{{ openobserve_root_user_email }}"
    password: "{{ secrets.monitoring.openobserve_root_user_pass }}"
    force_basic_auth: true
  register: _mcp_oo_users
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: true

- name: OpenObserve account for the gateway
  ansible.builtin.uri:
    url: "https://openobserve.{{ service_domain }}/api/default/users"
    method: POST
    user: "{{ openobserve_root_user_email }}"
    password: "{{ secrets.monitoring.openobserve_root_user_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      email: "{{ mcp_openobserve_email }}"
      first_name: homelab
      last_name: mcp
      password: "{{ secrets.mcp.openobserve_password }}"
      role: "{{ mcp_openobserve_role }}"
  when: mcp_openobserve_email not in (_mcp_oo_users.json.data | map(attribute='email') | list)
  changed_when: true
  delegate_to: localhost
  become: false
  no_log: true

- name: Proxmox users
  ansible.builtin.command: /usr/sbin/pveum user list --output-format json
  register: _mcp_pve_users
  changed_when: false
  check_mode: false
  delegate_to: "{{ proxmox_host }}"
  vars: &pve_root
    ansible_connection: ssh
    ansible_user: root

- name: Proxmox read-only user
  ansible.builtin.command: "/usr/sbin/pveum user add {{ mcp_proxmox_user }} --comment 'homelab-mcp gateway (ADR 0052)'"
  when: mcp_proxmox_user not in (_mcp_pve_users.stdout | from_json | map(attribute='userid') | list)
  changed_when: true
  delegate_to: "{{ proxmox_host }}"
  vars: *pve_root

- name: Proxmox ACLs
  ansible.builtin.command: /usr/sbin/pveum acl list --output-format json
  register: _mcp_pve_acl
  changed_when: false
  check_mode: false
  delegate_to: "{{ proxmox_host }}"
  vars: *pve_root

- name: Grant the read-only role at /
  ansible.builtin.command: "/usr/sbin/pveum acl modify / --users {{ mcp_proxmox_user }} --roles {{ mcp_proxmox_role }}"
  when: >-
    _mcp_pve_acl.stdout | from_json | selectattr('ugid', 'equalto', mcp_proxmox_user)
    | selectattr('path', 'equalto', '/') | selectattr('roleid', 'equalto', mcp_proxmox_role) | list | length == 0
  changed_when: true
  delegate_to: "{{ proxmox_host }}"
  vars: *pve_root

- name: Proxmox tokens for the gateway user
  ansible.builtin.command: "/usr/sbin/pveum user token list {{ mcp_proxmox_user }} --output-format json"
  register: _mcp_pve_tokens
  changed_when: false
  check_mode: false
  delegate_to: "{{ proxmox_host }}"
  vars: *pve_root

# A token lost from Infisical cannot be re-read from PVE; delete it and re-run to mint a new one.
- name: Mint the gateway token
  ansible.builtin.command: "/usr/sbin/pveum user token add {{ mcp_proxmox_user }} {{ mcp_proxmox_token_id }} --privsep 0 --output-format json"
  register: _mcp_pve_token
  when: mcp_proxmox_token_id not in (_mcp_pve_tokens.stdout | from_json | map(attribute='tokenid') | list)
  changed_when: true
  delegate_to: "{{ proxmox_host }}"
  vars: *pve_root
  no_log: true

- name: Store the gateway token in Infisical
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/infisical_write_secret.yml"
  vars:
    secret_name: proxmox_token
    secret_value: "{{ mcp_proxmox_user }}!{{ mcp_proxmox_token_id }}={{ (_mcp_pve_token.stdout | from_json).value }}"
    secret_path: /mcp
    secret_comment: "Proxmox API token {{ mcp_proxmox_user }}!{{ mcp_proxmox_token_id }} (PVEAuditor) for homelab-mcp"
  when: _mcp_pve_token is not skipped and _mcp_pve_token is changed

- name: Assert the token is in the vault
  ansible.builtin.assert:
    that: (secrets.mcp.proxmox_token | default('')) | length > 0 or (_mcp_pve_token is not skipped and _mcp_pve_token is changed)
    fail_msg: "{{ mcp_proxmox_user }}!{{ mcp_proxmox_token_id }} exists in PVE but /mcp/proxmox_token is absent: pveum user token remove {{ mcp_proxmox_user }} {{ mcp_proxmox_token_id }} and re-run"
