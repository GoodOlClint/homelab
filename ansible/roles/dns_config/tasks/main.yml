---
- name: Verify required pre_tasks facts
  ansible.builtin.assert:
    that:
      - dns_zones is defined
      - dns_zones is mapping
    fail_msg: "Required facts not available. This role must run from a playbook that includes full_pre_tasks.yml."
    quiet: true

# Durable DNS override via systemd-networkd drop-ins (ADR 0012).
# Not resolvectl (runtime-only, lost on reboot) and not a netplan override
# file (netplan merges nameserver lists across files, so it cannot remove
# the 1.1.1.1 bootstrap failover from the cloud-init base).
- name: Create networkd drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/network/10-netplan-{{ item }}.network.d"
    state: directory
    mode: '0755'
  become: true
  loop: "{{ ansible_facts.interfaces | select('match', '^eth_vlan') | sort }}"
  tags:
    - dns_config
    - dns
    - config

- name: Deploy DNS override drop-in
  ansible.builtin.template:
    src: dns-override.conf.j2
    dest: "/etc/systemd/network/10-netplan-{{ item }}.network.d/dns-override.conf"
    mode: '0644'
  become: true
  loop: "{{ ansible_facts.interfaces | select('match', '^eth_vlan') | sort }}"
  vars:
    dns_override_iface: "{{ item }}"
  notify: netplan apply
  tags:
    - dns_config
    - dns
    - config

- name: Remove obsolete netplan DNS override
  ansible.builtin.file:
    path: /etc/netplan/90-dns-override.yaml
    state: absent
  become: true
  notify: netplan apply
  tags:
    - dns_config
    - dns
    - config
