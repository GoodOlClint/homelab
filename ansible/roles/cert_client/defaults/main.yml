---
# ADR 0041: a per-host cert for guests with no native ACME client — certbot with DNS-01.
# certbot.timer renews; the deploy hook is the consumer's install step.
#   issuer fleet       — the Infisical fleet-hosts directory through BIND's dynamic-update path on the
#                        host's own acme-<host> key (ADR 0050); RSA keys because the Proxmox clients need them (ADR 0041).
#   issuer letsencrypt — a browser-trusted cert for a public name, DNS-01 at Cloudflare (ADR 0049); the
#                        token is per consumer so an identity box never holds edit rights it does not need.
cert_client_issuer: fleet
cert_client_fqdn: "{{ inventory_hostname }}.{{ service_domain }}"
cert_client_dir: "/etc/letsencrypt/live/{{ cert_client_fqdn }}"
# Extra SANs on the same cert (a PVE node adds the cluster VIP name).
cert_client_extra_domains: []
# Shell run by certbot after every issue/renew (RENEWED_LINEAGE is set); the consumer role sets it.
cert_client_deploy_hook: ""
cert_client_cloudflare_token: "{{ secrets.infrastructure.cloudflare_dns_api_token }}"
cert_client_letsencrypt_server: https://acme-v02.api.letsencrypt.org/directory
