---
# Proxmox Backup Server Configuration

# Debian suite for the Proxmox repository, DERIVED per host from the guest OS.
# `make rebuild <guest>` rolls guests one at a time, so the fleet is MIXED for
# the whole image roll and no fixed value is right for all of it: bookworm
# breaks a resolute guest, trixie breaks every host still on noble. The binding
# constraint is libfuse (bookworm client needs libfuse3-3, trixie libfuse3-4),
# which tracks the guest OS. Measured on the W6 spike guests 2026-08-12:
# Ubuntu 24.04 -> bookworm; Ubuntu 26.04 and Debian 13 -> trixie. Intermediate
# Ubuntu releases are untested and this repo does not run them.
# A Debian 13 guest therefore gets PBS 4 and the Ubuntu noble guest keeps PBS 3,
# which is ADR 0025's rule expressed as a derivation, not a hand-flip.
# Deliberately duplicated in proxmox_backup/defaults and pbs_client/defaults
# rather than hoisted into group_vars/all.yml. Hoisting was tried and reverted:
# a role default referencing a group_var makes the role unusable outside the
# main playbook root — the W6 campaign plays (and any standalone/molecule run)
# do not load ansible/group_vars/, so every task templating the suite failed
# with "'proxmox_repo_suite' is undefined". Two copies of one expression is a
# drift hazard; a role that only works from one directory is a live defect.
pbs_repo_suite: >-
  {{ 'trixie'
       if (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 13)
       or (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('25.10', '>='))
       else 'bookworm' }}

# Storage backend: 'nfs' or 'iscsi'
pbs_storage_backend: iscsi

# NFS mount configuration (alternative to iSCSI, set pbs_storage_backend: nfs)
pbs_nfs_mount_path: /mnt/backups
pbs_nfs_source: "{{ proxmox_backup_nfs_src }}"

# iSCSI configuration
pbs_iscsi_target: "iqn.2000-01.com.synology:DS1821Plus.Target-1.96b7014ff97"
pbs_iscsi_portal: "{{ synology_storage_host }}:3260"
pbs_iscsi_mount_path: /mnt/pbs-iscsi
pbs_iscsi_filesystem: ext4  # ext4 or xfs

# Datastore configuration
pbs_datastores:
  - name: synology
    path: "{{ pbs_iscsi_mount_path if pbs_storage_backend == 'iscsi' else pbs_nfs_mount_path }}/pbs-datastore"
    comment: "Backup datastore on Synology NAS"
    gc_schedule: "daily"
    prune_schedule: "daily"
    # Retention policy (GFS - Grandfather-Father-Son)
    keep_last: 7        # Keep last 7 backups
    keep_hourly: 0      # Don't keep hourly
    keep_daily: 14      # Keep daily for 2 weeks
    keep_weekly: 8      # Keep weekly for 2 months
    keep_monthly: 12    # Keep monthly for 1 year
    keep_yearly: 3      # Keep yearly for 3 years

# Verification schedule (separate from datastore)
pbs_verify_schedule: "weekly"

# PBS users and permissions
pbs_users:
  - username: backup
    realm: pbs
    comment: "Backup user for Proxmox Backup Client"
    # Password will be set from vault
    # API token will be auto-generated
  - username: monitoring
    realm: pbs
    comment: "Monitoring user for PBS Exporter (read-only)"
    # API token will be auto-generated (no password needed for token auth)

# PBS root password (default admin user)
pbs_root_password: "{{ secrets.pbs.pbs_admin_password | default('') }}"

# PBS namespaces for organization
pbs_namespaces:
  - datastore: synology
    namespace: plex
    comment: "Plex Media Server backups"
  - datastore: synology
    namespace: services
    comment: "Service configuration backups"
  - datastore: synology
    namespace: databases
    comment: "Database backups"
