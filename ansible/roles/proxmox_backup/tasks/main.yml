---
- name: Verify required pre_tasks facts
  ansible.builtin.assert:
    that:
      - secrets is defined
      - secrets is mapping
    fail_msg: "Required facts not available. This role must run from a playbook that includes full_pre_tasks.yml."
    quiet: true

# --- Auto-generate PBS passwords if not already set ---
- name: Auto-generate pbs_admin_password
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "pbs_admin_password"
    secret_gen_cmd: "openssl rand -base64 32"
    secret_comment: "PBS root@pam admin password — auto-generated by Ansible"
    secret_infisical_path: "/pbs"
    secret_dict_path: "pbs"
  tags: [proxmox_backup, pbs, secrets]

- name: Auto-generate pbs_backup_user_password
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "pbs_backup_user_password"
    secret_gen_cmd: "openssl rand -base64 32"
    secret_comment: "PBS backup@pbs user password — auto-generated by Ansible"
    secret_infisical_path: "/pbs"
    secret_dict_path: "pbs"
  tags: [proxmox_backup, pbs, secrets]

- name: Refresh PBS bare variable aliases from secrets
  ansible.builtin.set_fact:
    pbs_admin_password: "{{ secrets.pbs.pbs_admin_password }}"
  tags: [proxmox_backup, pbs, secrets]

# Cloud images ship root with a locked password; root@pam (PDM wizard, UI
# login) authenticates against the Unix password, so apply the secret here.
# The salt is derived from inventory_hostname so re-runs hash identically.
- name: Set root Unix password from pbs_admin_password
  ansible.builtin.user:
    name: root
    password: "{{ pbs_admin_password | password_hash('sha512', 65534 | random(seed=inventory_hostname) | string) }}"
  no_log: true
  tags: [proxmox_backup, pbs, secrets]

- name: Proxmox Backup Server repository
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../tasks/proxmox_apt_repo.yml"
    apply: {tags: [proxmox_backup, pbs, backup, packages]}
  vars:
    proxmox_apt_repo_name: proxmox-backup
    proxmox_apt_repo_uris: "http://download.proxmox.com/debian/pbs"
    proxmox_apt_repo_suite: "{{ pbs_repo_suite }}"
    proxmox_apt_repo_components: pbs-no-subscription
  tags:
    - proxmox_backup
    - pbs
    - backup
    - packages

- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present
  tags:
    - proxmox_backup
    - pbs
    - backup
    - packages

# PBS install drops an enterprise repo file — remove it after install
- name: Find all Proxmox enterprise repo files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*enterprise*'
  register: _enterprise_repo_files
  tags:
    - proxmox_backup
    - pbs
    - backup
    - packages

- name: Remove Proxmox enterprise repo files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _enterprise_repo_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - proxmox_backup
    - pbs
    - backup
    - packages

- name: Remove Proxmox enterprise repo from /etc/apt/sources.list if present
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '.*enterprise.proxmox.com'
    state: absent
  tags:
    - proxmox_backup
    - pbs
    - backup
    - packages

- name: Ensure Proxmox Backup Server is started and enabled
  ansible.builtin.systemd:
    name: proxmox-backup
    state: started
    enabled: true

  tags:
    - proxmox_backup
    - pbs
    - backup
    - service

- ansible.builtin.import_tasks: acme.yml

# Storage Configuration - iSCSI
- name: Install iSCSI initiator packages
  ansible.builtin.package:
    name:
      - open-iscsi
      - multipath-tools
    state: present
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi
    - packages

# open-iscsi.service is a oneshot (inactive once it has logged in), so
# `state: started` would re-fire it on every run.
- name: Ensure iSCSI initiator is started and enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "{{ 'started' if item == 'iscsid' else omit }}"
    enabled: true

  loop:
    - open-iscsi
    - iscsid
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi
    - service

- name: Discover iSCSI targets
  ansible.builtin.shell: |
    iscsiadm --mode discovery --type sendtargets --portal {{ pbs_iscsi_portal }}
  register: iscsi_discovery
  changed_when: false
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Show iSCSI discovery results
  ansible.builtin.debug:
    var: iscsi_discovery.stdout_lines
  when:
    - pbs_storage_backend == 'iscsi'
    - iscsi_discovery is not skipped
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Login to iSCSI target
  ansible.builtin.shell: |
    iscsiadm --mode node --targetname {{ pbs_iscsi_target }} --portal {{ pbs_iscsi_portal }} --login
  register: iscsi_login
  failed_when:
    - iscsi_login.rc != 0
    - "'already present' not in (iscsi_login.stderr | default(''))"
  changed_when: "'successful' in (iscsi_login.stdout | default(''))"
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Enable automatic iSCSI login on boot
  ansible.builtin.shell: |
    iscsiadm --mode node --targetname {{ pbs_iscsi_target }} --portal {{ pbs_iscsi_portal }} --op update --name node.startup --value automatic
  changed_when: false
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Wait for iSCSI device to appear
  ansible.builtin.wait_for:
    path: /dev/disk/by-path/ip-{{ pbs_iscsi_portal.split(':')[0] }}:{{ pbs_iscsi_portal.split(':')[1] }}-iscsi-{{ pbs_iscsi_target }}-lun-1
    state: present
    timeout: 30
  when: pbs_storage_backend == 'iscsi'
  register: iscsi_device
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Get iSCSI device name
  ansible.builtin.shell: |
    readlink -f /dev/disk/by-path/ip-{{ pbs_iscsi_portal.split(':')[0] }}:{{ pbs_iscsi_portal.split(':')[1] }}-iscsi-{{ pbs_iscsi_target }}-lun-1
  register: iscsi_device_path
  changed_when: false
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Check if iSCSI device is formatted
  ansible.builtin.shell: |
    blkid {{ iscsi_device_path.stdout }}
  register: iscsi_formatted
  failed_when: false
  changed_when: false
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Format iSCSI LUN with {{ pbs_iscsi_filesystem }}
  community.general.filesystem:
    fstype: "{{ pbs_iscsi_filesystem }}"
    dev: "{{ iscsi_device_path.stdout }}"
    opts: -L pbs-datastore
  when:
    - pbs_storage_backend == 'iscsi'
    - iscsi_formatted.rc != 0
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Ensure iSCSI mount point exists
  ansible.builtin.file:
    path: "{{ pbs_iscsi_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

- name: Mount iSCSI LUN
  ansible.posix.mount:
    path: "{{ pbs_iscsi_mount_path }}"
    src: "{{ iscsi_device_path.stdout }}"
    fstype: "{{ pbs_iscsi_filesystem }}"
    opts: _netdev,nofail,defaults
    state: mounted
  when: pbs_storage_backend == 'iscsi'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - iscsi

# Storage Configuration - NFS
- name: Ensure NFS mount point exists
  ansible.builtin.file:
    path: "{{ pbs_nfs_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: pbs_storage_backend == 'nfs'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - nfs

- name: Ensure NFS packages
  ansible.builtin.package:
    name:
      - nfs-common
    state: present
  when: pbs_storage_backend == 'nfs'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - nfs
    - packages

- name: Ensure NFS fstab entry and mount
  ansible.posix.mount:
    backup: true

    boot: "yes"
    path: "{{ pbs_nfs_mount_path }}"
    src: "{{ pbs_nfs_source }}"
    fstype: nfs
    opts: "{{ nfs_mount_options }}"
    state: "mounted"
  when: pbs_storage_backend == 'nfs'
  tags:
    - proxmox_backup
    - pbs
    - backup
    - storage
    - nfs


# Datastore Configuration
- name: Ensure datastore directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: backup
    group: backup
    mode: '0750'
  loop: "{{ pbs_datastores }}"
  tags:
    - proxmox_backup
    - pbs
    - backup
    - datastore
    - config

- name: Check if datastores are already configured
  ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
  register: pbs_datastore_list
  changed_when: false
  tags:
    - proxmox_backup
    - pbs
    - backup
    - datastore

# A LUN that already carries a datastore (PBS guest rebuild, ADR 0025) must be
# re-attached, never re-initialised: `--reuse-datastore` requires the existing
# .chunks layout instead of refusing the non-empty path.
- name: Check for existing datastore chunk stores
  ansible.builtin.stat:
    path: "{{ item.path }}/.chunks"
  loop: "{{ pbs_datastores }}"
  loop_control:
    label: "{{ item.path }}"
  register: pbs_datastore_chunks
  tags:
    - proxmox_backup
    - pbs
    - backup
    - datastore

- name: Create datastores via CLI
  ansible.builtin.shell: |
    proxmox-backup-manager datastore create {{ item.name }} {{ item.path }}{% if (pbs_datastore_chunks.results | selectattr('item.name', 'equalto', item.name) | first).stat.exists %} --reuse-datastore true{% endif %}{% if item.comment is defined %} --comment "{{ item.comment }}"{% endif %}{% if item.gc_schedule is defined %} --gc-schedule "{{ item.gc_schedule }}"{% endif %}{% if item.prune_schedule is defined %} --prune-schedule "{{ item.prune_schedule }}"{% endif %}{% if item.keep_last is defined %} --keep-last {{ item.keep_last }}{% endif %}{% if item.keep_hourly is defined and item.keep_hourly > 0 %} --keep-hourly {{ item.keep_hourly }}{% endif %}{% if item.keep_daily is defined %} --keep-daily {{ item.keep_daily }}{% endif %}{% if item.keep_weekly is defined %} --keep-weekly {{ item.keep_weekly }}{% endif %}{% if item.keep_monthly is defined %} --keep-monthly {{ item.keep_monthly }}{% endif %}{% if item.keep_yearly is defined %} --keep-yearly {{ item.keep_yearly }}{% endif %}
  loop: "{{ pbs_datastores }}"
  when:
    - pbs_datastore_list.stdout is defined
    - ((pbs_datastore_list.stdout | default('', true)) or '[]') | from_json | selectattr('name', 'equalto', item.name) | list | length == 0
  register: datastore_created
  changed_when: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - datastore
    - config

# The GC schedule is a datastore property (PBS has no gc-job); --reuse-datastore keeps the
# reused store's own config, so it is converged here rather than at create time.
- name: Read datastore config
  ansible.builtin.command: proxmox-backup-manager datastore show {{ item.name }} --output-format json
  loop: "{{ pbs_datastores }}"
  loop_control:
    label: "{{ item.name }}"
  register: pbs_datastore_show
  changed_when: false
  tags:
    - proxmox_backup
    - pbs
    - backup
    - datastore
    - config

- name: Set datastore GC schedule
  ansible.builtin.command: proxmox-backup-manager datastore update {{ item.item.name }} --gc-schedule "{{ item.item.gc_schedule | default('daily') }}"
  loop: "{{ pbs_datastore_show.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: (item.stdout | from_json).get('gc-schedule') != item.item.gc_schedule | default('daily')
  changed_when: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - datastore
    - config

# User Management
- name: Check if backup user exists
  ansible.builtin.command: proxmox-backup-manager user list --output-format json
  register: pbs_user_list
  changed_when: false
  failed_when: false
  tags:
    - proxmox_backup
    - pbs
    - backup
    - users

- name: Create PBS users
  ansible.builtin.shell: |
    proxmox-backup-manager user create {{ item.username }}@{{ item.realm }} \
      {% if item.comment is defined %}--comment "{{ item.comment }}"{% endif %}
  loop: "{{ pbs_users }}"
  when: ((pbs_user_list.stdout | default('', true)) or '[]') | from_json | selectattr('userid', 'equalto', item.username + '@' + item.realm) | list | length == 0
  changed_when: true
  no_log: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - users

# Namespaces (pbs_namespaces) are created by the backup scripts on first run,
# not here — the DatastoreAdmin ACLs below are what makes that possible.

# ACL Configuration
- name: Read current ACL list
  ansible.builtin.command: proxmox-backup-manager acl list --output-format json
  register: _pbs_acl_list
  changed_when: false
  tags:
    - proxmox_backup
    - pbs
    - backup
    - acl

- name: Parse current ACLs
  ansible.builtin.set_fact:
    _pbs_acls: "{{ ((_pbs_acl_list.stdout | default('', true)) or '[]') | from_json }}"
  tags:
    - proxmox_backup
    - pbs
    - backup
    - acl

- name: Grant backup user DatastoreAdmin permissions (needed for namespace creation)
  ansible.builtin.shell: |
    proxmox-backup-manager acl update /datastore/{{ item.name }} DatastoreAdmin \
      --auth-id backup@pbs
  loop: "{{ pbs_datastores }}"
  when: _pbs_acls | selectattr('path', 'eq', '/datastore/' ~ item.name)
        | selectattr('roleid', 'eq', 'DatastoreAdmin')
        | selectattr('ugid', 'eq', 'backup@pbs') | list | length == 0
  changed_when: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - acl

# API Token Generation (must happen before ACL grants that reference tokens)
- name: Check if API token exists for backup user
  ansible.builtin.command: proxmox-backup-manager user list-tokens backup@pbs --output-format json
  register: pbs_token_list
  changed_when: false
  failed_when: false

- name: Generate API token for backup user
  ansible.builtin.shell: |
    proxmox-backup-manager user generate-token backup@pbs backup-token
  register: pbs_token_output
  when: ((pbs_token_list.stdout | default('', true)) or '[]') | from_json | length == 0
  changed_when: true

- name: Store PBS backup token in Infisical
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/infisical_write_secret.yml"
  vars:
    secret_name: "pbs_backup_token"
    secret_value: "{{ pbs_token_output.stdout | regex_search('\"value\": \"([^\"]+)\"', '\\1') | first }}"
    secret_path: "/shared"
    secret_comment: "PBS backup@pbs backup-token — auto-generated"
  when:
    - pbs_token_output is changed
    - pbs_token_output.stdout is defined
    - infisical_login is defined

- name: Display PBS backup token (when Infisical unavailable)
  ansible.builtin.debug:
    msg: "PBS backup token generated. Save to secrets.sops.yml: {{ pbs_token_output.stdout | regex_search('\"value\": \"([^\"]+)\"', '\\1') | first }}"
    verbosity: 1
  when:
    - pbs_token_output is changed
    - pbs_token_output.stdout is defined
    - infisical_login is not defined
  no_log: "{{ not (ansible_verbosity >= 1) }}"

# API Token Generation - Monitoring User
- name: Check if API token exists for monitoring user
  ansible.builtin.command: proxmox-backup-manager user list-tokens monitoring@pbs --output-format json
  register: pbs_monitoring_token_list
  changed_when: false
  failed_when: false

- name: Generate API token for monitoring user
  ansible.builtin.shell: |
    proxmox-backup-manager user generate-token monitoring@pbs monitoring-token
  register: pbs_monitoring_token_output
  when: ((pbs_monitoring_token_list.stdout | default('', true)) or '[]') | from_json | length == 0
  changed_when: true

- name: Store PBS monitoring token in Infisical
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/infisical_write_secret.yml"
  vars:
    secret_name: "pbs_api_token"
    secret_value: "{{ pbs_monitoring_token_output.stdout | regex_search('\"value\": \"([^\"]+)\"', '\\1') | first }}"
    secret_path: "/monitoring"
    secret_comment: "PBS monitoring@pbs API token — auto-generated"
  when:
    - pbs_monitoring_token_output is changed
    - pbs_monitoring_token_output.stdout is defined
    - infisical_login is defined

- name: Display PBS monitoring token (when Infisical unavailable)
  ansible.builtin.debug:
    msg: "PBS monitoring token generated. Save to secrets.sops.yml: {{ pbs_monitoring_token_output.stdout | regex_search('\"value\": \"([^\"]+)\"', '\\1') | first }}"
    verbosity: 1
  when:
    - pbs_monitoring_token_output is changed
    - pbs_monitoring_token_output.stdout is defined
    - infisical_login is not defined
  no_log: "{{ not (ansible_verbosity >= 1) }}"

# ACL Grants — tokens now exist, safe to reference them
- name: Grant API token DatastoreAdmin permissions (needed for namespace creation)
  ansible.builtin.shell: |
    proxmox-backup-manager acl update /datastore/{{ item.name }} DatastoreAdmin \
      --auth-id 'backup@pbs!backup-token'
  loop: "{{ pbs_datastores }}"
  when: _pbs_acls | selectattr('path', 'eq', '/datastore/' ~ item.name)
        | selectattr('roleid', 'eq', 'DatastoreAdmin')
        | selectattr('ugid', 'eq', 'backup@pbs!backup-token') | list | length == 0
  changed_when: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - acl

- name: Grant monitoring user Audit permissions on datastores
  ansible.builtin.shell: |
    proxmox-backup-manager acl update /datastore/{{ item.name }} Audit \
      --auth-id monitoring@pbs
  loop: "{{ pbs_datastores }}"
  when: _pbs_acls | selectattr('path', 'eq', '/datastore/' ~ item.name)
        | selectattr('roleid', 'eq', 'Audit')
        | selectattr('ugid', 'eq', 'monitoring@pbs') | list | length == 0
  changed_when: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - acl

- name: Grant monitoring token Audit permissions on datastores
  ansible.builtin.shell: |
    proxmox-backup-manager acl update /datastore/{{ item.name }} Audit \
      --auth-id 'monitoring@pbs!monitoring-token'
  loop: "{{ pbs_datastores }}"
  when: _pbs_acls | selectattr('path', 'eq', '/datastore/' ~ item.name)
        | selectattr('roleid', 'eq', 'Audit')
        | selectattr('ugid', 'eq', 'monitoring@pbs!monitoring-token') | list | length == 0
  changed_when: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - acl

- name: Grant monitoring user Audit permissions on system
  ansible.builtin.shell: |
    proxmox-backup-manager acl update / Audit \
      --auth-id monitoring@pbs
  when: _pbs_acls | selectattr('path', 'eq', '/')
        | selectattr('roleid', 'eq', 'Audit')
        | selectattr('ugid', 'eq', 'monitoring@pbs') | list | length == 0
  changed_when: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - acl

- name: Grant monitoring token Audit permissions on system
  ansible.builtin.shell: |
    proxmox-backup-manager acl update / Audit \
      --auth-id 'monitoring@pbs!monitoring-token'
  when: _pbs_acls | selectattr('path', 'eq', '/')
        | selectattr('roleid', 'eq', 'Audit')
        | selectattr('ugid', 'eq', 'monitoring@pbs!monitoring-token') | list | length == 0
  changed_when: true
  tags:
    - proxmox_backup
    - pbs
    - backup
    - acl

# Verification jobs
- name: Configure verification jobs
  ansible.builtin.shell: |
    proxmox-backup-manager verify-job create verify-{{ item.name }} \
      --store {{ item.name }} \
      --schedule "{{ pbs_verify_schedule | default('weekly') }}"
  loop: "{{ pbs_datastores }}"
  register: verify_job_created
  failed_when: verify_job_created.rc != 0 and 'already exists' not in verify_job_created.stderr
  changed_when: verify_job_created.rc == 0

# Prune jobs
- name: Configure prune jobs
  ansible.builtin.shell: |
    proxmox-backup-manager prune-job create prune-{{ item.name }} \
      --store {{ item.name }} \
      --schedule "{{ item.prune_schedule | default('daily') }}" \
      --keep-last {{ item.keep_last | default(7) }} \
      --keep-daily {{ item.keep_daily | default(14) }} \
      --keep-weekly {{ item.keep_weekly | default(8) }} \
      --keep-monthly {{ item.keep_monthly | default(12) }} \
      --keep-yearly {{ item.keep_yearly | default(3) }}
  loop: "{{ pbs_datastores }}"
  register: prune_job_created
  failed_when: prune_job_created.rc != 0 and 'already exists' not in prune_job_created.stderr
  changed_when: prune_job_created.rc == 0

- name: Display PBS configuration summary
  ansible.builtin.debug:
    msg: |
      ============================================
      Proxmox Backup Server Configuration Complete
      ============================================
      Web Interface: https://{{ ansible_host }}:8007

      Datastores configured:
      {% for ds in pbs_datastores %}
      - {{ ds.name }}: {{ ds.path }}
      {% endfor %}

      Namespaces configured:
      {% for ns in pbs_namespaces %}
      - {{ ns.datastore }}:{{ ns.namespace }}
      {% endfor %}

      Users configured:
      {% for user in pbs_users %}
      - {{ user.username }}@{{ user.realm }}
      {% endfor %}

      Logs forwarded to: OpenObserve

      Next steps:
      1. Access web UI at https://{{ ansible_host }}:8007
      2. Login with root@pam
      3. Configure backup clients using API token
      ============================================
