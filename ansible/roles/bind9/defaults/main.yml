---
# Zone data (dns_zones, ipv4_prefix_reversed, network_data, internal_network_cidr)
# comes from pre_tasks; the TSIG secret from secrets.infrastructure.

# Authoritative pair (ADR 0003): first group member is the zone primary (DDNS
# target; zone files under /var/lib/bind — AppArmor denies named writes in
# /etc/bind, which silently breaks DDNS journals), the rest are secondaries fed by AXFR
# (zone files under /var/cache/bind). A single instance is simply the primary.
bind9_instances: "{{ groups['dns'] | default([inventory_hostname]) }}"
bind9_primary: "{{ inventory_hostname == bind9_instances[0] }}"

# BIND VIP (ADR 0029 pattern): keepalived between the instances, address =
# vlans.yaml dns_server.bind_ipv4 (what AdGuard forwards internal zones to).
bind9_vip_ipv4: "{{ network_data.dns_server.bind_ipv4 }}"
bind9_vrrp_router_id: 15
# `stopped` stages keepalived installed+configured without claiming the VIP —
# for the swap beside a restored copy that still holds the address.
bind9_vip_state: started

# Forward zones (ADR 0040): the keys of vlans.yaml internal_zones — flat public-domain
# zones, records are dynamic updates only. dns_zones only drives the reverse zones.
# The CI zone rides along: a child zone whose own TSIG key (ci-update-key) can
# write nothing outside it, so CI registrations never touch the fleet zones —
# the DNS half of the ci-isos isolation (ADR 0032).
bind9_ci_zone: "ci.{{ service_domain }}"
bind9_forward_zones: "{{ (internal_zones | list) + [bind9_ci_zone] }}"
# The Ci VLAN subnet is denied queries on every zone except the ci zone: CI
# guests can resolve their own names but cannot enumerate or resolve fleet
# names through BIND. IPv4-only — the Ci VLAN carries no v6.
bind9_ci_subnet: "{{ network_data.ipv4_prefix }}.{{ network_data.vlans.ci.id }}.0/24"
# CI guests churn per run: a 300s negative TTL blinds a wait-for-registration
# poll for 5 minutes after the record lands. 30s bounds both stale answers and
# cached NXDOMAINs; CI's own nsupdate should register records with TTL <= this.
bind9_ci_zone_ttl: 30

# ACME DNS-01 clients (ADR 0050): every host that enrolls for a fleet-hosts cert holds its own
# TSIG key `acme-<host>` (Infisical /infrastructure/acme_tsig_<host>, `-` → `_`), granted only
# `_acme-challenge.<host>.<service domain>` — nothing gets a wildcard. Guests with a client in
# this inventory, the cluster nodes (host-bindings.yaml `nodes`, which also carry the `pve`
# SAN), and the hosts enrolled by hand (worklab's play, docs/{pfsense,synology,homeassistant}-acme.md).
bind9_acme_guest_hosts: [proxmox-backup, pdm, unifi, llm]
bind9_acme_extra_hosts: [worklab, pfsense, ds1821plus, homeassistant]
bind9_acme_node_hosts: "{{ host_bindings.nodes | list }}"
bind9_acme_hosts: "{{ bind9_acme_guest_hosts + bind9_acme_node_hosts + bind9_acme_extra_hosts }}"
bind9_acme_vip_name: pve
