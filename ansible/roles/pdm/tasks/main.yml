---
- name: Auto-generate pdm_root_password
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "pdm_root_password"
    secret_gen_cmd: "openssl rand -base64 24"
    secret_comment: "PDM root@pam password — auto-generated by Ansible"
    secret_infisical_path: "/control"
    secret_dict_path: "control"
  tags: [pdm, secrets]

# The salt is derived from the secret itself so re-runs hash identically without a fixed salt.
- name: Set root password for PDM web login (root@pam)
  ansible.builtin.user:
    name: root
    password: "{{ secrets.control.pdm_root_password | password_hash('sha512', (secrets.control.pdm_root_password | hash('sha256'))[:16]) }}"
  no_log: true
  tags: [pdm, users]

- name: Check Proxmox archive keyring
  ansible.builtin.stat:
    path: /usr/share/keyrings/proxmox-archive-keyring.gpg
  register: _pdm_key_stat
  tags: [pdm, packages]

- name: Fetch Proxmox archive keyring
  ansible.builtin.get_url:
    url: "{{ pdm_proxmox_key_url }}"
    dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"
  when: not _pdm_key_stat.stat.exists or _pdm_key_stat.stat.size == 0
  tags: [pdm, packages]

- name: Proxmox Datacenter Manager repo (deb822)
  ansible.builtin.deb822_repository:
    name: pdm
    types: deb
    uris: "http://download.proxmox.com/debian/pdm"
    suites: "{{ pdm_repo_suite }}"
    components: "{{ pdm_repo_component }}"
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    install_python_debian: true
  register: _pdm_repo
  tags: [pdm, packages]

- name: Install Proxmox Datacenter Manager
  ansible.builtin.apt:
    name: "{{ pdm_packages }}"
    state: present
    update_cache: "{{ _pdm_repo is changed }}"
    install_recommends: false
  tags: [pdm, packages]

- name: Remove the enterprise repo the package drops (401 without a subscription)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pdm-enterprise.sources
    state: absent
  tags: [pdm, packages]

- name: Ensure PDM services are running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - proxmox-datacenter-api
    - proxmox-datacenter-privileged-api
  tags: [pdm, services]

- ansible.builtin.import_tasks: acme.yml
