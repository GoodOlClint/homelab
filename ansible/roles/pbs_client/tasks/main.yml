---

- name: Verify required pre_tasks facts
  ansible.builtin.assert:
    that:
      - secrets is defined
      - secrets is mapping
    fail_msg: "Required facts not available. This role must run from a playbook that includes full_pre_tasks.yml."
    quiet: true

- name: Proxmox Backup Client repository
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../tasks/proxmox_apt_repo.yml"
    apply: {tags: [pbs_client, pbs, backup, packages]}
  vars:
    proxmox_apt_repo_name: pbs-client
    proxmox_apt_repo_uris: "http://download.proxmox.com/debian/pbs-client"
    proxmox_apt_repo_suite: "{{ pbs_client_repo_suite }}"
    proxmox_apt_repo_components: main
  tags:
    - pbs_client
    - pbs
    - backup
    - packages

- name: Install proxmox-backup-client
  ansible.builtin.apt:
    name: proxmox-backup-client
    state: present
  when: pbs_client_install | default(true)
  tags:
    - pbs_client
    - pbs
    - backup
    - packages

- name: Ensure /etc/proxmox-backup directory exists
  ansible.builtin.file:
    path: /etc/proxmox-backup
    state: directory
    mode: '0755'
  tags:
    - pbs_client
    - pbs
    - backup
    - config

- name: Create PBS environment file for authentication
  ansible.builtin.template:
    src: pbs_env.j2
    dest: /etc/proxmox-backup/pbs-client.env
    mode: '0600'
    owner: root
    group: root
  tags:
    - pbs_client
    - pbs
    - backup
    - config

- name: Verify PBS connection
  ansible.builtin.shell: |
    set -o pipefail
    . /etc/proxmox-backup/pbs-client.env
    if [ -z "$PBS_PASSWORD" ]; then
      echo "SKIP: PBS credentials not yet available"
      exit 2
    fi
    timeout -s KILL 10 proxmox-backup-client snapshot list </dev/null | head -n 1
  register: pbs_connection_test
  failed_when: pbs_connection_test.rc not in [0, 2]
  changed_when: false
  tags:
    - pbs_client
    - pbs
    - backup
    - validate

- name: Display PBS connection status
  ansible.builtin.debug:
    msg: >-
      PBS Connection: {{
        'SKIPPED - credentials not yet available (run PBS role first)'
        if pbs_connection_test.rc == 2
        else ('SUCCESS' if pbs_connection_test.rc == 0
        else 'FAILED - ' + pbs_connection_test.stderr | default('unknown error')) }}
  tags:
    - pbs_client
    - pbs
    - backup
    - validate
