---
- name: Verify required pre_tasks facts
  ansible.builtin.assert:
    that:
      - secrets is defined
      - secrets is mapping
    fail_msg: "Required secrets fact not available. This role must run from a playbook that includes full_pre_tasks.yml."
    quiet: true

# --- Auto-generate Valheim server password if not already set ---
- name: Auto-generate valheim_server_password
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "valheim_server_password"
    secret_gen_cmd: "openssl rand -base64 12"
    secret_comment: "Valheim dedicated server password — auto-generated by Ansible"
    secret_infisical_path: "/docker"
    secret_dict_path: "docker"
  tags: [docker, valheim, secrets]

- name: Auto-generate valheim_supervisor_password
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "valheim_supervisor_password"
    secret_gen_cmd: "openssl rand -base64 24"
    secret_comment: "Valheim supervisord web UI password — auto-generated by Ansible"
    secret_infisical_path: "/docker"
    secret_dict_path: "docker"
  tags: [docker, valheim, secrets]

# The 26.04 LXC template lacks python3-requests, which community.docker needs.
- name: Install compose module dependencies
  ansible.builtin.apt:
    name: python3-docker
    state: present
    update_cache: true
  tags: [docker, packages]

- name: Configure Docker syslog logging
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/configure_docker_logging.yml"
  tags: [docker, logging, config]

- name: Ensure compose and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ docker_base_dir }}"
    - "{{ docker_base_dir }}/valheim/config"
    - "{{ docker_base_dir }}/valheim/data"
    - "{{ docker_base_dir }}/valheim/status"
  tags:
    - docker
    - config

- name: Install the PlayFab lobby query script
  ansible.builtin.copy:
    src: valheim-playfab-status.mjs
    dest: "{{ docker_base_dir }}/valheim/valheim-playfab-status.mjs"
    owner: root
    group: root
    mode: '0644'
  tags:
    - docker
    - config

- name: Deploy docker-compose.yml to the docker host
  ansible.builtin.template:
    src: templates/docker-compose.yml.j2
    dest: "{{ docker_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0600'
  tags:
    - docker
    - config
    - compose

- name: Deploy containers with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_dir }}"
    state: present
  retries: 3
  delay: 30
  register: compose_result
  until: compose_result is succeeded
  tags:
    - docker
    - compose
    - deploy

- name: Configure Docker PBS backup
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/configure_pbs_backup.yml"
  vars:
    backup_name: "Docker containers"
    backup_script_src: docker_pbs_backup.sh.j2
    backup_script_dest: /usr/local/bin/docker_pbs_backup.sh
    backup_cron_hour: "2"
    backup_cron_minute: "30"
  when: pbs_backup_enabled | default(true)
  tags: [docker, backup, pbs, cron]
