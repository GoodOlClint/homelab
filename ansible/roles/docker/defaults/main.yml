---
# timezone is defined in group_vars/all.yml

docker_base_dir: /opt/docker
# Node bind mount of the NAS kiwix ZIM library, read-only (ADR 0017)
docker_kiwix_dir: /mnt/kiwix

# Valheim Server Configuration
valheim_server_name: "Homelab Valheim"
# ponytail: rename, don't delete — the old HomeWorld.db/.fwl stay in
# /config/worlds_local, so reverting is a one-line flip back to "HomeWorld"
valheim_world_name: "HomeWorld2"
valheim_server_public: "false"
# Crossplay issues a PlayFab join code per session (logged on start, rotates each restart)
valheim_crossplay: "true"
# PlayFab lobby monitor sidecar: the server's PlayFab entity ID (stable across
# in-place restarts, rotates when the container is recreated — see
# ~/Source/Valheim ADR 003). Re-pin from "PlayFab local entity ID" in the log.
valheim_playfab_entity_id: "B0F9749E68C6707E"
valheim_status_port: 8081
valheim_status_interval: 60
valheim_supervisor_user: "admin"
valheim_supervisor_port: 9002
# Extra valheim_server.x86_64 CLI args. `-modifier portals casual` = no teleport
# restrictions. Applies on EVERY start (not just world create) — but it is also
# written into the world's .fwl on the next save, so deleting the arg does not
# revert it. To undo, start once with `-resetmodifiers` (undocumented, real:
# FejdStartup line ~994), then drop back to no args.
# Other modifiers: combat|deathpenalty|resources|raids|portals, plus
# `-preset <name>` and `-setkey <nomap|playerevents|passivemobs|nobuildcost>`.
valheim_server_args: "-preset normal -modifier portals casual -modifiers deathpenalty easy"
