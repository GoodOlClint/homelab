---

- name: Enable community repository for Telegraf
  ansible.builtin.lineinfile:
    path: /etc/apk/repositories
    regexp: '^#(.*/community)$'
    line: '\1'
    backrefs: true

  tags:
    - telegraf
    - packages

- name: Install Telegraf via apk
  community.general.apk:
    name: telegraf
    state: present
    update_cache: true

  tags:
    - telegraf
    - packages

- name: Ensure Telegraf config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/telegraf
    - /etc/telegraf/telegraf.d
  tags:
    - telegraf
    - config

# Alpine's init reads /etc/telegraf.conf + /etc/telegraf.conf.d; the role's drop-in dir is
# /etc/telegraf/telegraf.d on every OS, so point the daemon at it (or it runs with no outputs).
- name: Point the OpenRC service at the role's config directory
  ansible.builtin.copy:
    dest: /etc/conf.d/telegraf
    content: |
      TELEGRAF_OPTS="-config {{ telegraf_main_conf }} -config-directory /etc/telegraf/telegraf.d"
    mode: '0644'
  notify: Restart Telegraf
  tags:
    - telegraf
    - config
