---
# telegraf role defaults
#
# Required variables (defined in group_vars/all.yml):
#   openobserve_listen_host — OpenObserve VM address
#   openobserve_listen_port — OpenObserve HTTP port
#   openobserve_root_user_email — OpenObserve admin email
#
# Required from pre_tasks:
#   secrets.monitoring.openobserve_root_user_pass

# The package's main config: Alpine ships it at /etc/telegraf.conf, Debian under /etc/telegraf/.
telegraf_main_conf: "{{ '/etc/telegraf.conf' if ansible_facts['os_family'] == 'Alpine' else '/etc/telegraf/telegraf.conf' }}"
