---
- name: Verify required pre_tasks facts
  ansible.builtin.assert:
    that:
      - dns_zones is defined
      - secrets is defined
    fail_msg: "Required facts not available. This role must run from a playbook that includes full_pre_tasks.yml."
    quiet: true

- name: Auto-generate portainer_admin_password
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "portainer_admin_password"
    secret_gen_cmd: "openssl rand -base64 24"
    secret_comment: "Portainer server admin password — auto-generated by Ansible"
    secret_infisical_path: "/control"
    secret_dict_path: "control"
  tags: [control, secrets]

- name: Configure Docker syslog logging
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/configure_docker_logging.yml"
  tags: [control, docker, logging]

- name: Create control directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ control_base_dir }}"
    - "{{ control_base_dir }}/meshcentral/data"
    - "{{ control_base_dir }}/meshcentral/files"
    - "{{ control_base_dir }}/meshcentral/backups"
    - "{{ control_base_dir }}/portainer"
  tags: [control, config]

- name: Set control FQDN
  ansible.builtin.set_fact:
    control_fqdn: "{{ inventory_hostname }}.{{ service_domain }}"
  tags: [control, config]

- name: Host certificate (API-issued, ADR 0041 — MeshCentral needs a subject CN)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/api_certificate.yml"
  vars:
    api_cert_dir: "{{ control_base_dir }}/tls"
    api_cert_fqdn: "{{ control_fqdn }}"
    api_cert_handler: restart control compose
  tags: [control, config]

- name: MeshCentral certificate files
  ansible.builtin.copy:
    src: "{{ control_base_dir }}/tls/{{ item.src }}"
    dest: "{{ control_base_dir }}/meshcentral/data/{{ item.dest }}"
    remote_src: true
    mode: "0644"
  loop:
    - { src: cert.pem, dest: webserver-cert-public.crt }
    - { src: key.pem, dest: webserver-cert-private.key }
  notify: restart control compose
  tags: [control, config]

- name: Template MeshCentral config
  ansible.builtin.template:
    src: meshcentral-config.json.j2
    dest: "{{ control_base_dir }}/meshcentral/data/config.json"
    owner: root
    group: root
    mode: '0644'
  notify: restart control compose
  tags: [control, config]

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ control_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0600'
  notify: restart control compose
  tags: [control, compose]

- name: Deploy control containers
  community.docker.docker_compose_v2:
    project_src: "{{ control_base_dir }}"
    state: present
  tags: [control, compose, deploy]

- name: Wait for Portainer API
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/system/status"
    validate_certs: false
  register: _portainer_status
  until: _portainer_status.status == 200
  retries: 20
  delay: 3
  tags: [control, portainer]

- name: Initialize Portainer admin (first start only)
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/users/admin/init"
    method: POST
    validate_certs: false
    body_format: json
    body:
      Username: "{{ portainer_admin_user }}"
      Password: "{{ secrets.control.portainer_admin_password }}"
    status_code: [200, 409]
  register: _portainer_init
  changed_when: _portainer_init.status == 200
  tags: [control, portainer]

- name: Authenticate to Portainer
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/auth"
    method: POST
    validate_certs: false
    body_format: json
    body:
      username: "{{ portainer_admin_user }}"
      password: "{{ secrets.control.portainer_admin_password }}"
  register: _portainer_auth
  no_log: true
  tags: [control, portainer]

- name: List Portainer environments
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/endpoints"
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt }}"
  register: _portainer_endpoints
  tags: [control, portainer]

- name: Register Portainer agent environments
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/endpoints"
    method: POST
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt }}"
    body_format: form-multipart
    body:
      Name: "{{ item }}"
      EndpointCreationType: "2"
      URL: "tcp://{{ hostvars[item]['ansible_host'] }}:{{ portainer_agent_port }}"
      TLS: "true"
      TLSSkipVerify: "true"
      TLSSkipClientVerify: "true"
    status_code: [200, 201]
  loop: "{{ portainer_agent_hosts }}"
  when: item not in (_portainer_endpoints.json | map(attribute='Name') | list)
  tags: [control, portainer]

- name: Read Portainer settings
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/settings"
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt }}"
  register: _portainer_settings
  tags: [control, portainer]

# The client secret is write-only in Portainer's API, so a rotated secret needs a forced re-apply (change any other field).
- name: Point Portainer login at authentik (OIDC, ADR 0040 P5c)
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/settings"
    method: PUT
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt }}"
    body_format: json
    body:
      AuthenticationMethod: 3
      OAuthSettings:
        ClientID: portainer
        ClientSecret: "{{ secrets.authentik.portainer_oidc_client_secret }}"
        AuthorizationURI: "https://auth.{{ service_domain }}/application/o/authorize/"
        AccessTokenURI: "https://auth.{{ service_domain }}/application/o/token/"
        ResourceURI: "https://auth.{{ service_domain }}/application/o/userinfo/"
        LogoutURI: "https://auth.{{ service_domain }}/application/o/portainer/end-session/"
        RedirectURI: "https://{{ inventory_hostname }}.{{ service_domain }}:{{ portainer_port }}/"
        UserIdentifier: preferred_username
        Scopes: "openid profile email"
        OAuthAutoCreateUsers: true
        DefaultTeamID: 0
        SSO: true
  no_log: true
  changed_when: true
  when: >-
    _portainer_settings.json.AuthenticationMethod != 3
    or _portainer_settings.json.OAuthSettings.AccessTokenURI != "https://auth." ~ service_domain ~ "/application/o/token/"
    or _portainer_settings.json.OAuthSettings.RedirectURI != "https://" ~ inventory_hostname ~ "." ~ service_domain ~ ":" ~ portainer_port ~ "/"
  tags: [control, portainer]

- name: List Portainer admin access tokens
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/users/1/tokens"
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt }}"
  register: _portainer_tokens
  tags: [control, portainer]

- name: Create Portainer access token for homepage
  ansible.builtin.uri:
    url: "https://localhost:{{ portainer_port }}/api/users/1/tokens"
    method: POST
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt }}"
    body_format: json
    body:
      password: "{{ secrets.control.portainer_admin_password }}"
      description: "homepage"
  register: _portainer_token
  no_log: true
  when: "'homepage' not in (_portainer_tokens.json | map(attribute='description') | list)"
  tags: [control, portainer]

- name: Store homepage Portainer API key in Infisical
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/infisical_write_secret.yml"
  vars:
    secret_name: "portainer_api_key"
    secret_value: "{{ _portainer_token.json.rawAPIKey }}"
    secret_comment: "Portainer access token for the homepage widget — written by the control role"
    secret_path: "/homepage"
  when: _portainer_token is not skipped and _portainer_token is succeeded
  tags: [control, portainer, secrets]
