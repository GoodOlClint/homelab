---
- name: Verify required pre_tasks facts
  ansible.builtin.assert:
    that:
      - dns_zones is defined
      - secrets is defined
    fail_msg: "Required facts not available. This role must run from a playbook that includes full_pre_tasks.yml."
    quiet: true

- name: Configure Docker syslog logging
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/configure_docker_logging.yml"
  tags: [control, docker, logging]

- name: Create control directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ control_base_dir }}"
    - "{{ control_base_dir }}/meshcentral/data"
    - "{{ control_base_dir }}/meshcentral/files"
    - "{{ control_base_dir }}/meshcentral/backups"
  tags: [control, config]

- name: Set control FQDN
  ansible.builtin.set_fact:
    control_fqdn: "{{ inventory_hostname }}.{{ service_domain }}"
  tags: [control, config]

- name: Host certificate (API-issued, ADR 0041 — MeshCentral needs a subject CN)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/api_certificate.yml"
  vars:
    api_cert_dir: "{{ control_base_dir }}/tls"
    api_cert_fqdn: "{{ control_fqdn }}"
    api_cert_handler: restart control compose
  tags: [control, config]

- name: MeshCentral certificate files
  ansible.builtin.copy:
    src: "{{ control_base_dir }}/tls/{{ item.src }}"
    dest: "{{ control_base_dir }}/meshcentral/data/{{ item.dest }}"
    remote_src: true
    mode: "{{ item.mode }}"
  loop:
    - { src: cert.pem, dest: webserver-cert-public.crt, mode: "0644" }
    - { src: key.pem, dest: webserver-cert-private.key, mode: "0600" }
  notify: restart control compose
  tags: [control, config]

- name: Template MeshCentral config
  ansible.builtin.template:
    src: meshcentral-config.json.j2
    dest: "{{ control_base_dir }}/meshcentral/data/config.json"
    owner: root
    group: root
    mode: '0644'
  notify: restart control compose
  tags: [control, config]

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ control_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0600'
  notify: restart control compose
  tags: [control, compose]

- name: Deploy control containers
  community.docker.docker_compose_v2:
    project_src: "{{ control_base_dir }}"
    state: present
    remove_orphans: true
  tags: [control, compose, deploy]
