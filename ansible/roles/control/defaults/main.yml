---
# timezone is defined in group_vars/all.yml
control_base_dir: /opt/control

meshcentral_image: "ghcr.io/ylianst/meshcentral:latest"
meshcentral_title: "Homelab"
# First account created through the UI becomes site admin; flip to false after that
meshcentral_new_accounts: false
# authentik ships groups in the profile scope, not a `groups` scope, so the claim is read from there.
meshcentral_oidc_admin_groups: ["authentik Admins"]
# MeshCentral gates the all-device-groups view on BOTH full siteadmin and membership of this list
# (webserver.js GetAllMeshWithRights); siteadmin alone falls back to the user's own mesh links.
meshcentral_manage_all_device_groups: []
