---

# Installer URL — required for fresh installs only
# Get from: https://community.ui.com/releases/r/uosserver
# or: https://ui.com/download/releases/network-server
# Leave empty to skip installation (already installed)
unifi_uos_installer_url: ""

# Firewall configuration
unifi_configure_firewall: true
unifi_firewall_allowed_ips:
  - "{{ internal_network_cidr }}"
  - "10.0.0.0/8"
  - "192.168.0.0/16"

# nginx inside the uosserver container reads its cert pair from this podman volume path
unifi_core_config_dir: /home/uosserver/.local/share/containers/storage/volumes/uosserver_data/_data/unifi-core/config
unifi_tls_dir: /var/lib/uosserver/tls
unifi_cert_install: |-
  set -e
  install -o uosserver -g uosserver -m 0644 {{ unifi_tls_dir }}/cert.pem {{ unifi_core_config_dir }}/unifi-core.crt
  install -o uosserver -g uosserver -m 0600 {{ unifi_tls_dir }}/key.pem {{ unifi_core_config_dir }}/unifi-core.key
  cd /tmp && sudo -u uosserver podman exec uosserver nginx -s reload
