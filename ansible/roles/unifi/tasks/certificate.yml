---
# ADR 0041: UniFi OS Server serves /data/unifi-core/config/unifi-core.{crt,key} from nginx
# inside the uosserver container; the podman volume holds them on the host. The same file is
# the trust anchor of the host-side update supervisor, which dials wss://127.0.0.1 and
# validates that name — so the cert must carry IP:127.0.0.1, which ACME cannot issue: the
# pair is API-issued like the vault's. The cmp re-installs it when UniFi OS regenerates its
# self-signed pair (an update).
- name: Fleet-hosts certificate (API-issued, DNS + loopback SANs)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/api_certificate.yml"
  vars:
    api_cert_dir: "{{ unifi_tls_dir }}"
    api_cert_fqdn: "{{ inventory_hostname }}.{{ service_domain }}"
    api_cert_ip: 127.0.0.1
    api_cert_handler: Install UniFi certificate

- name: Compare the served certificate with the issued one
  ansible.builtin.command:
    cmd: cmp -s {{ unifi_core_config_dir }}/unifi-core.crt {{ unifi_tls_dir }}/cert.pem
  register: _unifi_cert_cmp
  changed_when: _unifi_cert_cmp.rc == 1
  failed_when: _unifi_cert_cmp.rc > 1

- name: Install the issued certificate # noqa: no-handler command-instead-of-shell
  ansible.builtin.shell: "{{ unifi_cert_install }}"
  changed_when: true
  when: _unifi_cert_cmp is changed
