---
- name: PAIR package
  ansible.builtin.get_url:
    url: "{{ llm_pair_deb_url }}"
    dest: /var/cache/apt/archives/nvpair.deb
    checksum: "sha256:{{ llm_pair_deb_sha256 }}"
    mode: "0644"

- name: PAIR installed
  ansible.builtin.apt:
    deb: /var/cache/apt/archives/nvpair.deb

- name: PAIR state on the holder volume
  ansible.builtin.file:
    path: "{{ llm_pair_state_dir }}"
    state: directory
    mode: "0750"
