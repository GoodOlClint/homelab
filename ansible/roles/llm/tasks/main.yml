---
- name: API keys in Infisical /llm (one per client)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "llm_api_key_{{ item }}"
    secret_gen_cmd: "openssl rand -hex 32"
    secret_comment: "llm.{{ service_domain }} Caddy API key for client '{{ item }}' — auto-generated by Ansible"
    secret_infisical_path: "/llm"
    secret_dict_path: "llm"
  loop: "{{ llm_api_clients }}"
  tags: [llm, secrets]

- name: Pin the signed NVIDIA driver so a dist-upgrade cannot roll it
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nvidia-driver
    content: |
      Package: {{ llm_nvidia_driver_package }} nvidia-utils-580-server libnvidia-*-580-server nvidia-kernel-*-580-server
      Pin: version {{ llm_nvidia_driver_version }}
      Pin-Priority: 1001
    mode: "0644"
  tags: [llm, packages]

- name: Driver, toolchain, Caddy
  ansible.builtin.apt:
    name:
      - "{{ llm_nvidia_driver_package }}={{ llm_nvidia_driver_version }}"
      - nvidia-cuda-toolkit
      - nvidia-cuda-toolkit-gcc
      - build-essential
      - cmake
      - ccache
      - libcurl4-openssl-dev
      - git
      - caddy
    state: present
    cache_valid_time: 3600
  register: _llm_packages
  tags: [llm, packages]

- name: Reboot once when the driver install changed the kernel modules
  ansible.builtin.reboot:
    reboot_timeout: 600
    test_command: nvidia-smi
  when: _llm_packages is changed and (_llm_packages.stdout | default('')) is search('nvidia-driver')
  tags: [llm, packages]

- name: Weights filesystem on the node-local disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ llm_models_device }}"
    opts: "-L {{ llm_models_label }}"
  tags: [llm, storage]

- name: Mount points
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "LABEL={{ item.label }}"
    fstype: ext4
    opts: defaults,noatime,nofail
    state: mounted
  loop:
    - { path: "{{ llm_models_dir }}", label: "{{ llm_models_label }}" }
    - { path: "{{ llm_data_dir }}", label: "{{ llm_data_label }}" }
  tags: [llm, storage]

- name: Checkout llama.cpp at the pinned tag
  ansible.builtin.git:
    repo: "{{ llm_llama_cpp_repo }}"
    dest: "{{ llm_llama_cpp_dir }}/src"
    version: "{{ llm_llama_cpp_version }}"
    depth: 1
  register: _llm_src
  tags: [llm, build]

- name: Build llama.cpp with CUDA
  ansible.builtin.shell: |
    set -e
    cmake -S {{ llm_llama_cpp_dir }}/src -B {{ llm_llama_cpp_dir }}/build \
      -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES={{ llm_cuda_arch }} \
      -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=ON -DGGML_CCACHE=ON
    cmake --build {{ llm_llama_cpp_dir }}/build --config Release -j {{ ansible_processor_vcpus }} --target llama-server llama-bench llama-cli
    install -d {{ llm_llama_cpp_dir }}/bin
    for b in llama-server llama-bench llama-cli; do install -m 0755 {{ llm_llama_cpp_dir }}/build/bin/$b {{ llm_llama_cpp_dir }}/bin/; done
    printf '%s' "{{ llm_llama_cpp_version }}" > {{ llm_llama_cpp_dir }}/bin/.version
  args:
    creates: "{{ llm_llama_cpp_dir }}/bin/.version"
  when: _llm_src is changed or not (llm_llama_cpp_dir + '/bin/.version') is file
  notify: Restart llama-server
  tags: [llm, build]

- name: Model file present
  ansible.builtin.stat:
    path: "{{ llm_models_dir }}/{{ llm_model_file }}"
  register: _llm_model
  tags: [llm, model]

- name: Download the model
  ansible.builtin.get_url:
    url: "{{ llm_model_url }}"
    dest: "{{ llm_models_dir }}/{{ llm_model_file }}"
    checksum: "{{ ('sha256:' + llm_model_sha256) if llm_model_sha256 | length > 0 else omit }}"
    mode: "0644"
    timeout: 120
  when: not _llm_model.stat.exists or _llm_model.stat.size == 0
  notify: Restart llama-server
  tags: [llm, model]

- name: Unit for llama-server
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    mode: "0644"
  notify: Restart llama-server
  tags: [llm, config]

- name: Ollama unit override (loopback, CPU-only)
  ansible.builtin.template:
    src: ollama-override.conf.j2
    dest: /etc/systemd/system/ollama.service.d/override.conf
    mode: "0644"
  notify: Restart ollama
  tags: [llm, config]

- name: NVIDIA PAIR
  ansible.builtin.include_tasks: pair.yml
  when: llm_pair_deb_url | length > 0
  tags: [llm, pair]

- name: Fleet-hosts certificate (certbot, DNS-01 via BIND)
  ansible.builtin.include_role:
    name: cert_client
  vars:
    cert_client_fqdn: "{{ llm_fqdn }}"
    cert_client_deploy_hook: >-
      install -m 0644 "$RENEWED_LINEAGE/fullchain.pem" {{ llm_caddy_tls_dir }}/fullchain.pem &&
      install -o caddy -g caddy -m 0600 "$RENEWED_LINEAGE/privkey.pem" {{ llm_caddy_tls_dir }}/privkey.pem &&
      systemctl reload caddy
  when: secrets.infrastructure.acme_directory_url is defined
  tags: [llm, tls]

- name: Certificate files for Caddy
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ llm_fqdn }}/{{ item.src }}"
    dest: "{{ llm_caddy_tls_dir }}/{{ item.src }}"
    remote_src: true
    owner: caddy
    group: caddy
    mode: "{{ item.mode }}"
  loop:
    - { src: fullchain.pem, mode: "0644" }
    - { src: privkey.pem, mode: "0600" }
  notify: Restart caddy
  tags: [llm, tls]

- name: Caddy reads the API keys from the agent-rendered env file
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/override.conf
    content: |
      [Service]
      EnvironmentFile={{ llm_env_file }}
    mode: "0644"
  notify: Restart caddy
  tags: [llm, config]

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy validate --config %s --adapter caddyfile
  notify: Restart caddy
  tags: [llm, config]

- name: Services enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [ollama, llama-server, caddy]
  tags: [llm, config]
