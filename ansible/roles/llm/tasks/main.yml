---
- name: API keys in Infisical /llm (one per client)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "llm_api_key_{{ item }}"
    secret_gen_cmd: "openssl rand -hex 32"
    secret_comment: "llm.{{ service_domain }} Caddy API key for client '{{ item }}' — auto-generated by Ansible"
    secret_infisical_path: "/llm"
    secret_dict_path: "llm"
  loop: "{{ llm_api_clients }}"
  tags: [llm, secrets]

- name: Pins are complete
  ansible.builtin.assert:
    that:
      - llm_api_clients | reject('match', '^[a-z0-9_]+$') | list | length == 0
      - llm_embed_model_sha256 | length == 64
      - llm_vllm_image is search('@sha256:[0-9a-f]{64}$')
      - llm_vllm_revision | length == 40
      - llm_vllm_model_files | map(attribute='sha256') | reject('match', '^[0-9a-f]{64}$') | list | length == 0
      - llm_llama_cpp_commit | length == 40
      - llm_ollama_sha256 | length == 64
      - llm_pair_deb_url | length == 0 or llm_pair_deb_sha256 | length == 64
    fail_msg: "every download is pinned by sha256 and llama.cpp by commit (plan §7.9)"
  tags: [llm]

- name: PPA signing keys
  ansible.builtin.stat:
    path: "/etc/apt/keyrings/{{ item.name }}.asc"
  loop:
    - { name: kisak-mesa, fpr: "{{ llm_mesa_ppa_fingerprint }}" }
    - { name: intel-graphics, fpr: "{{ llm_intel_ppa_fingerprint }}" }
  register: _llm_keys
  tags: [llm, packages]

- name: Fetch PPA signing keys by fingerprint
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x{{ item.item.fpr }}"
    dest: "/etc/apt/keyrings/{{ item.item.name }}.asc"
    mode: "0644"
  loop: "{{ _llm_keys.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists or item.stat.size == 0
  tags: [llm, packages]

- name: PPAs (kisak Mesa, Intel graphics)
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    uris: "https://ppa.launchpadcontent.net/{{ item.ppa }}/ubuntu"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "/etc/apt/keyrings/{{ item.name }}.asc"
    install_python_debian: true
  loop:
    - { name: kisak-mesa, ppa: "{{ llm_mesa_ppa }}" }
    - { name: intel-graphics, ppa: "{{ llm_intel_ppa }}" }
  register: _llm_ppas
  tags: [llm, packages]

- name: Pin Mesa so a dist-upgrade cannot roll the version that decides decode speed
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mesa
    content: |
      Package: mesa-* lib*mesa* libgbm* libgallium* libxatracker* libd3dadapter*
      Pin: version {{ llm_mesa_version }}
      Pin-Priority: 1001
    mode: "0644"
  register: _llm_mesa_pin
  tags: [llm, packages]

- name: The oneAPI signing key
  ansible.builtin.stat:
    path: /etc/apt/keyrings/oneapi.asc
  register: _llm_oneapi_key
  when: llm_llama_cpp_backend == 'sycl'
  tags: [llm, packages]

- name: Fetch the oneAPI signing key
  ansible.builtin.get_url:
    url: "{{ llm_oneapi_key_url }}"
    dest: /etc/apt/keyrings/oneapi.asc
    mode: "0644"
  when: llm_llama_cpp_backend == 'sycl' and (not _llm_oneapi_key.stat.exists or _llm_oneapi_key.stat.size == 0)
  tags: [llm, packages]

- name: The oneAPI apt repository
  ansible.builtin.deb822_repository:
    name: oneapi
    uris: https://apt.repos.intel.com/oneapi
    suites: all
    components: main
    signed_by: /etc/apt/keyrings/oneapi.asc
    install_python_debian: true
  register: _llm_oneapi_repo
  when: llm_llama_cpp_backend == 'sycl'
  tags: [llm, packages]

- name: Pin oneAPI and the Level Zero runtime so a dist-upgrade cannot roll the SYCL stack
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/oneapi
    content: |
      {% for p in llm_oneapi_pins %}
      Package: {{ p.package }}
      Pin: version {{ p.version }}
      Pin-Priority: 1001

      {% endfor %}
    mode: "0644"
  register: _llm_oneapi_pin
  when: llm_llama_cpp_backend == 'sycl'
  tags: [llm, packages]

- name: Refresh the apt cache after a source or pin change
  ansible.builtin.apt:
    update_cache: true
  when: _llm_ppas is changed or _llm_mesa_pin is changed or _llm_oneapi_repo is changed or _llm_oneapi_pin is changed
  tags: [llm, packages]

- name: The oneAPI compiler, oneMKL and the Level Zero headers
  ansible.builtin.apt:
    name: [intel-oneapi-compiler-dpcpp-cpp, intel-oneapi-mkl-devel, libze-dev]
    state: present
  when: llm_llama_cpp_backend == 'sycl'
  tags: [llm, packages]

- name: SYCL reserves host address space as large as a model's GPU buffer, so a model bigger than guest RAM needs overcommit
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "{{ '1' if llm_llama_cpp_backend == 'sycl' else '0' }}"
    sysctl_file: /etc/sysctl.d/90-llm.conf
  tags: [llm, packages]

- name: xpu-smi package
  ansible.builtin.get_url:
    url: "{{ llm_xpu_smi_url }}"
    dest: /var/cache/xpu-smi.deb
    checksum: "sha256:{{ llm_xpu_smi_sha256 }}"
    mode: "0644"
    timeout: 120
  tags: [llm, packages]

- name: GPU firmware, pinned Mesa Vulkan, toolchain, Caddy
  ansible.builtin.apt:
    name:
      - linux-firmware
      - "mesa-vulkan-drivers={{ llm_mesa_version }}"
      - libvulkan-dev
      - vulkan-tools
      - glslc
      - spirv-headers
      - lm-sensors
      - build-essential
      - cmake
      - ccache
      - libcurl4-openssl-dev
      - curl # vllm.service's readiness gate and vllm-warmup shell it
      - git
      - zstd
      - caddy
    state: present
    cache_valid_time: 3600
  tags: [llm, packages]

- name: xpu-smi installed (its libigsc1 dependency resolves from the Intel PPA)
  ansible.builtin.apt:
    deb: /var/cache/xpu-smi.deb
  tags: [llm, packages]

- name: Render node present
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: _llm_render
  tags: [llm, packages]

- name: Reboot when the xe driver has not claimed the card (firmware installed after boot)
  ansible.builtin.reboot:
    reboot_timeout: 600
    test_command: test -c /dev/dri/renderD128
  when: not _llm_render.stat.exists
  tags: [llm, packages]

- name: Service user for llama-embed
  ansible.builtin.user:
    name: "{{ llm_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/var/lib/{{ llm_user }}"
    create_home: true
    groups: [video, render]
    append: true
  tags: [llm]

- name: Ollama service user (home untouched — usermod refuses while the daemon runs)
  ansible.builtin.user:
    name: ollama
    system: true
    shell: /usr/sbin/nologin
    groups: [video, render]
    append: true
  tags: [llm]

- name: Weights disk is attached
  ansible.builtin.assert:
    that: ansible_devices[llm_models_device | basename] is defined
    fail_msg: "{{ llm_models_device }} missing — the extra_disks entry in vm-configs.tf is what puts it at virtio2"
  tags: [llm, storage]

- name: Weights filesystem on the node-local disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ llm_models_device }}"
    opts: "-L {{ llm_models_label }}"
  tags: [llm, storage]

- name: Weights filesystem label
  ansible.builtin.command: "blkid -s LABEL -o value {{ llm_models_device }}"
  register: _llm_label
  changed_when: false
  tags: [llm, storage]

- name: Relabel when the label drifted
  ansible.builtin.command: "e2label {{ llm_models_device }} {{ llm_models_label }}"
  when: _llm_label.stdout != llm_models_label
  changed_when: true
  tags: [llm, storage]

- name: Mount points
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "LABEL={{ item.label }}"
    fstype: ext4
    opts: defaults,noatime,nofail
    state: mounted
  loop:
    - { path: "{{ llm_models_dir }}", label: "{{ llm_models_label }}" }
    - { path: "{{ llm_data_dir }}", label: "{{ llm_data_label }}" }
  tags: [llm, storage]

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ llm_models_dir }}", owner: "{{ llm_user }}", mode: "0755" }
    - { path: "{{ llm_vllm_model_dir }}", owner: root, mode: "0755" }
    - { path: "{{ llm_vllm_cache_dir }}", owner: root, mode: "0700" }
    - { path: "{{ llm_docker_dir }}", owner: root, mode: "0710" }
    - { path: "{{ llm_containerd_dir }}", owner: root, mode: "0711" }
    - { path: "{{ llm_data_dir }}/ollama", owner: ollama, mode: "0750" }
    - { path: "{{ llm_caddy_tls_dir }}", owner: root, mode: "0755" }
    - { path: /etc/systemd/system/caddy.service.d, owner: root, mode: "0755" }
  tags: [llm]

# The containerd content store is a second store that docker's data-root does not cover, and both must leave the
# 30 GB root disk before a 32 GB image lands. The link goes in first so the package postinst honours it.
# ponytail: a symlink, not a containerd config.toml — docker.io ships no config file to edit and this is proven here.
- name: containerd's store lives on the weights disk
  ansible.builtin.file:
    path: /var/lib/containerd
    src: "{{ llm_containerd_dir }}"
    state: link
    force: true
  notify: Restart the container runtime
  tags: [llm, docker]

- name: Docker's data-root lives on the weights disk
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'data-root': llm_docker_dir} | to_nice_json }}\n"
    mode: "0644"
  notify: Restart the container runtime
  tags: [llm, docker]

- name: Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    cache_valid_time: 3600
  tags: [llm, docker]

- name: Flush handlers so the runtime is on the weights disk before a 32 GB image is pulled
  ansible.builtin.meta: flush_handlers
  tags: [llm, docker]

- name: Engine image present
  ansible.builtin.command: "docker image inspect {{ llm_vllm_image }}"
  register: _llm_image
  changed_when: false
  failed_when: false
  tags: [llm, docker]

- name: Pull the engine image by digest
  ansible.builtin.command: "docker pull {{ llm_vllm_image }}"
  when: _llm_image.rc != 0
  changed_when: true
  notify: Restart vllm
  tags: [llm, docker]

# The container needs the host's render gid to reach /dev/dri; it differs between guests, so never a literal.
- name: The render group's gid
  ansible.builtin.getent:
    database: group
    key: render
  tags: [llm, docker]

- name: Installed llama.cpp commit
  ansible.builtin.command: "cat {{ llm_llama_cpp_dir }}/bin/.commit"
  register: _llm_built
  changed_when: false
  failed_when: false
  tags: [llm, build]

- name: Checkout llama.cpp at the pinned commit
  ansible.builtin.git:
    repo: "{{ llm_llama_cpp_repo }}"
    dest: "{{ llm_llama_cpp_dir }}/src"
    version: "{{ llm_llama_cpp_commit }}"
    depth: 1
  when: _llm_built.stdout | default('') != llm_llama_cpp_build_id
  tags: [llm, build]

# bin/<tool> is a wrapper around bin/<tool>.real: sudo and systemd drop the oneAPI environment the SYCL build needs.
- name: Build llama.cpp
  ansible.builtin.shell:
    cmd: |
      set -e
      {% if llm_llama_cpp_backend == 'sycl' %}
      set +u; source /opt/intel/oneapi/setvars.sh --force >/dev/null; set -u
      FLAGS="-DGGML_SYCL=ON -DGGML_SYCL_F16=ON -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DLLAMA_CURL=OFF"
      {% else %}
      FLAGS="-DGGML_VULKAN=ON -DGGML_CUDA=OFF -DLLAMA_CURL=ON -DGGML_CCACHE=ON"
      {% endif %}
      rm -rf {{ llm_llama_cpp_dir }}/build
      cmake -S {{ llm_llama_cpp_dir }}/src -B {{ llm_llama_cpp_dir }}/build $FLAGS -DCMAKE_BUILD_TYPE=Release
      cmake --build {{ llm_llama_cpp_dir }}/build --config Release -j {{ ansible_processor_vcpus }} --target llama-server llama-bench llama-cli
      install -d {{ llm_llama_cpp_dir }}/bin
      for b in llama-server llama-bench llama-cli; do
        install -m 0755 {{ llm_llama_cpp_dir }}/build/bin/$b {{ llm_llama_cpp_dir }}/bin/$b.real.new
        mv -f {{ llm_llama_cpp_dir }}/bin/$b.real.new {{ llm_llama_cpp_dir }}/bin/$b.real
        {% if llm_llama_cpp_backend == 'sycl' %}
        printf '#!/bin/bash\nset +u; source /opt/intel/oneapi/setvars.sh --force >/dev/null\nexec %s "$@"\n' \
          "{{ llm_llama_cpp_dir }}/bin/$b.real" > {{ llm_llama_cpp_dir }}/bin/$b.new
        {% else %}
        printf '#!/bin/bash\nexec %s "$@"\n' "{{ llm_llama_cpp_dir }}/bin/$b.real" > {{ llm_llama_cpp_dir }}/bin/$b.new
        {% endif %}
        chmod 0755 {{ llm_llama_cpp_dir }}/bin/$b.new
        mv -f {{ llm_llama_cpp_dir }}/bin/$b.new {{ llm_llama_cpp_dir }}/bin/$b
      done
      printf '%s' "{{ llm_llama_cpp_build_id }}" > {{ llm_llama_cpp_dir }}/bin/.commit
    executable: /bin/bash
  when: _llm_built.stdout | default('') != llm_llama_cpp_build_id
  changed_when: true
  notify: Restart llama-embed
  tags: [llm, build]

- name: Download the chat checkpoint at the pinned revision
  ansible.builtin.get_url:
    url: "https://huggingface.co/{{ llm_vllm_repo }}/resolve/{{ llm_vllm_revision }}/{{ item.name }}"
    dest: "{{ llm_vllm_model_dir }}/{{ item.name }}"
    tmp_dest: "{{ llm_vllm_model_dir }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
    timeout: 300
  loop: "{{ llm_vllm_model_files }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart vllm
  tags: [llm, model]

- name: Download the embeddings model
  ansible.builtin.get_url:
    url: "{{ llm_embed_model_url }}"
    dest: "{{ llm_models_dir }}/{{ llm_embed_model_file }}"
    tmp_dest: "{{ llm_models_dir }}"
    checksum: "sha256:{{ llm_embed_model_sha256 }}"
    owner: "{{ llm_user }}"
    mode: "0644"
    timeout: 120
  notify: Restart llama-embed
  tags: [llm, model]

- name: Ollama tarball
  ansible.builtin.get_url:
    url: "{{ llm_ollama_url }}"
    dest: "/var/cache/ollama-{{ llm_ollama_version }}.tar.zst"
    checksum: "sha256:{{ llm_ollama_sha256 }}"
    mode: "0644"
    timeout: 120
  tags: [llm, ollama]

- name: Ollama installed # noqa: command-instead-of-module (tar.zst; unarchive cannot)
  ansible.builtin.shell:
    cmd: "tar --zstd -xf /var/cache/ollama-{{ llm_ollama_version }}.tar.zst -C /usr/local && touch /usr/local/lib/ollama/.installed-{{ llm_ollama_version }}"
    creates: "/usr/local/lib/ollama/.installed-{{ llm_ollama_version }}"
  notify: Restart ollama
  tags: [llm, ollama]

- name: Warm-up scripts (the engine's batch shapes; the embedder's SYCL pool)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: vllm-warmup.j2, dest: /usr/local/bin/vllm-warmup }
    - { src: llama-embed-warmup.j2, dest: /usr/local/bin/llama-embed-warmup }
  notify: [Restart llama-embed, Restart vllm]
  tags: [llm, config]

- name: Units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [vllm.service, llama-embed.service, ollama.service]
  notify: "Restart {{ item | regex_replace('\\.service$', '') }}"
  tags: [llm, config]

- name: Ollama's installer drop-ins are not ours
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: absent
  notify: Restart ollama
  tags: [llm, config]

- name: The retired llama.cpp router unit is gone
  ansible.builtin.systemd:
    name: llama-server
    state: stopped
    enabled: false
  register: _llm_old_router
  failed_when: false
  changed_when: _llm_old_router.status is defined and _llm_old_router.status.LoadState != 'not-found'
  tags: [llm, config]

- name: The retired llama.cpp router unit file is gone
  ansible.builtin.file:
    path: /etc/systemd/system/llama-server.service
    state: absent
  tags: [llm, config]

- name: NVIDIA PAIR
  ansible.builtin.include_tasks: pair.yml
  when: llm_pair_deb_url | length > 0
  tags: [llm, pair]

- name: Fleet-hosts certificate (certbot, DNS-01 via BIND)
  ansible.builtin.include_role:
    name: cert_client
    apply:
      tags: [llm, tls]
  vars:
    cert_client_fqdn: "{{ llm_fqdn }}"
    cert_client_deploy_hook: >-
      install -m 0644 "$RENEWED_LINEAGE/fullchain.pem" {{ llm_caddy_tls_dir }}/fullchain.pem &&
      install -o caddy -g caddy -m 0600 "$RENEWED_LINEAGE/privkey.pem" {{ llm_caddy_tls_dir }}/privkey.pem &&
      systemctl reload caddy
  when: secrets.infrastructure.acme_directory_url is defined
  tags: [llm, tls]

- name: Certificate files for Caddy
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ llm_fqdn }}/{{ item.src }}"
    dest: "{{ llm_caddy_tls_dir }}/{{ item.src }}"
    remote_src: true
    owner: caddy
    group: caddy
    mode: "{{ item.mode }}"
  loop:
    - { src: fullchain.pem, mode: "0644" }
    - { src: privkey.pem, mode: "0600" }
  when: secrets.infrastructure.acme_directory_url is defined
  notify: Restart caddy
  tags: [llm, tls]

- name: Caddy reads the API keys from the agent-rendered env file and refuses to start without one
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/override.conf
    content: |
      [Service]
      EnvironmentFile={{ llm_env_file }}
      ExecStartPre=+/usr/bin/grep -qE '^LLM_API_KEY_[A-Z]+=.+' {{ llm_env_file }}
    mode: "0644"
  notify: Restart caddy
  tags: [llm, config]

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy validate --config %s --adapter caddyfile
  notify: Restart caddy
  tags: [llm, config]

# What the embedder is SERVING, not whether its files changed. A handler cannot cover this: once a previous run
# has written the unit, the template task reports ok, nothing notifies, and an embedder left running the old
# model stays running it — while the engine, which reads free VRAM at init, refuses to start beside it.
- name: The model the embedder is actually serving
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_embed_port }}/v1/models"
  register: _llm_embed_live
  failed_when: false
  changed_when: false
  tags: [llm, config]

- name: Restart the embedder when it is not serving the declared model
  ansible.builtin.systemd:
    name: llama-embed
    state: restarted
    daemon_reload: true
  when: >-
    _llm_embed_live.status != 200 or
    llm_embed_alias not in (_llm_embed_live.json.data | default([]) | map(attribute='id') | list)
  tags: [llm, config]

- name: Flush handlers before the engine sizes the card
  ansible.builtin.meta: flush_handlers
  tags: [llm, config]

- name: Services enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [ollama, llama-embed, vllm, caddy]
  tags: [llm, config]

- name: Every client key reached the agent-rendered env file
  ansible.builtin.command: "grep -qE '^LLM_API_KEY_{{ item | upper }}=.+' {{ llm_env_file }}"
  loop: "{{ llm_api_clients }}"
  changed_when: false
  retries: 6
  delay: 15
  register: _llm_key_present
  until: _llm_key_present.rc == 0
  tags: [llm, config]

- name: Raw engine ports bind loopback only
  ansible.builtin.shell: |
    set -o pipefail
    ss -Hltn | awk '{print $4}' | grep -E ':({{ llm_chat_port }}|{{ llm_embed_port }}|{{ llm_ollama_port }}|{{ llm_pair_port }})$' | grep -vE '^(127\.0\.0\.1|\[::1\]):' || true
  args:
    executable: /bin/bash
  register: _llm_exposed
  changed_when: false
  failed_when: _llm_exposed.stdout | length > 0
  tags: [llm, config]
