---
- name: Restart caddy
  ansible.builtin.systemd:
    name: caddy
    state: restarted

- name: Restart llama-server
  ansible.builtin.systemd:
    name: llama-server
    state: restarted
    daemon_reload: true

- name: Restart ollama
  ansible.builtin.systemd:
    name: ollama
    state: restarted
    daemon_reload: true
