---
# ADR 0051 (tranche 1b): llama-server owns the GPU; Ollama is PAIR's CPU-only backend.
llm_fqdn: "llm.{{ service_domain }}"
llm_user: llm

# Arc Pro B70 (ADR 0051, 2026-09-14): the in-tree `xe` driver needs linux-firmware's Battlemage GuC/HuC/DMC blobs,
# which the cloud image omits. Mesa comes from kisak's PPA and is pinned — the version decides decode speed
# (26.0.8 distro: 40 t/s, 26.2.2: 88 t/s on Qwen3.6-35B-A3B), so it moves only after a bench run.
# ponytail: PPAs delete superseded builds, so a fresh VM cannot install an old pin; bump the pin, or cache the debs if that bites.
llm_mesa_ppa: kisak/kisak-mesa
llm_mesa_ppa_fingerprint: EB8B81E14DA65431D7504EA8F63F0F2B90935439
llm_mesa_version: "26.2.2~kisak1~r"
llm_intel_ppa: kobuk-team/intel-graphics
llm_intel_ppa_fingerprint: 0C0E6AF955CE463C03FC51574D098D70AFBE5E1F
# xpu-smi is the card's nvidia-smi; its dependency libigsc1 exists only in the Intel PPA above.
llm_xpu_smi_url: "https://github.com/intel/xpumanager/releases/download/v2.1.0/xpu-smi_2.1.0%2B26.33.6468cec-1.26.04_amd64.deb"
llm_xpu_smi_sha256: ca20368a893c7cde1cd25218ed3def4b2b39ab0a1e2cd6169694fc5bdd0e3ee7

# Weights: a node-local disk, re-downloaded on rebuild — not ADR 0015 state (plan §7.3).
llm_models_device: /dev/vdc
llm_models_label: llm-models
llm_models_dir: /var/lib/llm/models
# Holder slot 6 (PAIR identity + Ollama's small models).
llm_data_label: vm-900-disk-5
llm_data_dir: /data

# Tags move; the build pins the commit the tag pointed at when it was reviewed.
llm_llama_cpp_repo: https://github.com/ggml-org/llama.cpp.git
llm_llama_cpp_version: master # no tag contains the benched commit; v0.4.0 predates it
llm_llama_cpp_commit: 41abbfd599fbdd3470fcae0a1fb6530ad8403cd7
llm_llama_cpp_dir: /opt/llama.cpp
# sycl | vulkan. SYCL keeps decode ~2x and prefill ~3x faster than Vulkan by 64k context (b70-bench, llama.cpp #28721);
# vulkan stays buildable as the rollback. Both keep Mesa: the units' GPU pre-check reads vulkaninfo.
llm_llama_cpp_backend: sycl
llm_llama_cpp_build_id: "{{ llm_llama_cpp_commit }}-{{ llm_llama_cpp_backend }}"
# oneAPI (compiler + oneMKL) and the Level Zero compute runtime decide SYCL speed the way Mesa decides Vulkan's,
# so they are apt-pinned and moved only after a bench run.
llm_oneapi_key_url: https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
llm_oneapi_pins:
  - { package: "intel-oneapi-compiler-dpcpp-cpp*", version: "2026.1.1-325" }
  - { package: "intel-oneapi-mkl-devel*", version: "2026.1.0-236" }
  - { package: "libze1 libze-dev", version: "1.32.0-1~26.04~ppa1" }
  - { package: "libze-intel-gpu1", version: "26.31.39395.13-1~26.04~ppa1" }

# --- Chat: vLLM XPU in a container (ADR 0051, 2026-09-16) ---
# The image carries its own oneAPI userspace and drives the host `xe` driver through /dev/dri, so the host
# oneAPI/Level Zero/Mesa pins above are none of its business. Pinned by digest, not tag: it is 32 GB.
llm_vllm_image: "intel/llm-scaler-vllm@sha256:52218ad85513ab6686d4c090c83c2bd8c5b02423c63aa4dabd41837fe641fe3b"
llm_vllm_container: vllm
llm_vllm_served_name: Qwen3.8-27B
llm_chat_port: 8081
llm_vllm_repo: SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16
llm_vllm_revision: e28c5f952bdd5d814297a07d85a064a87af26a3f
llm_vllm_model_dir: "{{ llm_models_dir }}/vllm/Qwen3.8-27B-GPTQ-Int4-MTP"
# Triton and NEO compile caches, kept across restarts so a batch shape is compiled once. Shared state, which is
# why two XPU processes must never initialise at once.
llm_vllm_cache_dir: "{{ llm_models_dir }}/vllm/cache"
# Every file at the pinned revision. The shards' hashes are the LFS oids; the rest were read at the revision.
llm_vllm_model_files:
  - { name: chat_template.jinja, sha256: c3cf9e34abf4f9e36c2d72165aa9c132d3e2a725b6c2586aaa3a8af9d7a81041 }
  - { name: config.json, sha256: 580f5caae29242b242d3bcab2ad5b8a942fc0a59df1d228bd2b3233cfc760372 }
  - { name: generation_config.json, sha256: d0d0ed2e37cdfafef4a5067d5ea2407b05f4fb50526e47c008a5b235d50240fb }
  - { name: model-00001-of-00005.safetensors, sha256: 30c8e2b1c82cdcc840848b5c98bafe2f74269b1e6472a053ce7d7b2d002f39a7 }
  - { name: model-00002-of-00005.safetensors, sha256: ff66eaf6ecc6e4b214f281ac532dcfcb07c60d5a8c78cf145bc93c38c00c024e }
  - { name: model-00003-of-00005.safetensors, sha256: 15284cb88d52ea1648b4fcc68901286d7c4795388e05ae1e143c8026fcb0be44 }
  - { name: model-00004-of-00005.safetensors, sha256: 878ae6ebc9553de5340df0d6097aa319f58650382c89e474b39d0c0a98e76932 }
  - { name: model-00005-of-00005.safetensors, sha256: 2a6ebd04c77c2d5ce5952ca81a4197f1c34f712a00c293a25242ec27ac413729 }
  - { name: model.safetensors.index.json, sha256: d511a969b32a16f1890326dadd4d04039779cebce7458b8e5d2ce7f3ce2550ed }
  - { name: preprocessor_config.json, sha256: 27225450ac9c6529872ee1924fcb0962ff5634834f817040f444118116f4e516 }
  - { name: processor_config.json, sha256: d89ef49ce9cd37fbf510158e13c1ef063d9286411c1ec9049932dbe0487143b1 }
  - { name: quantize_config.json, sha256: ecbdecd64057569d9ab8e74c68eb329776e682d44746ff7b82bba6fcb0e157db }
  - { name: tokenizer.json, sha256: 06b9509352d2af50381ab2247e083b80d32d5c0aba91c272ca9ff729b6a0e523 }
