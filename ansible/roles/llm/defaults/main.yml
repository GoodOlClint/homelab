---
# ADR 0051 (tranche 1b): llama-server owns the GPU; Ollama is PAIR's CPU-only backend.
llm_fqdn: "llm.{{ service_domain }}"
llm_user: llm

# Arc Pro B70 (ADR 0051, 2026-09-14): the in-tree `xe` driver needs linux-firmware's Battlemage GuC/HuC/DMC blobs,
# which the cloud image omits. Mesa comes from kisak's PPA and is pinned — the version decides decode speed
# (26.0.8 distro: 40 t/s, 26.2.2: 88 t/s on Qwen3.6-35B-A3B), so it moves only after a bench run.
# ponytail: PPAs delete superseded builds, so a fresh VM cannot install an old pin; bump the pin, or cache the debs if that bites.
llm_mesa_ppa: kisak/kisak-mesa
llm_mesa_ppa_fingerprint: EB8B81E14DA65431D7504EA8F63F0F2B90935439
llm_mesa_version: "26.2.2~kisak1~r"
llm_intel_ppa: kobuk-team/intel-graphics
llm_intel_ppa_fingerprint: 0C0E6AF955CE463C03FC51574D098D70AFBE5E1F
# xpu-smi is the card's nvidia-smi; its dependency libigsc1 exists only in the Intel PPA above.
llm_xpu_smi_url: "https://github.com/intel/xpumanager/releases/download/v2.1.0/xpu-smi_2.1.0%2B26.33.6468cec-1.26.04_amd64.deb"
llm_xpu_smi_sha256: ca20368a893c7cde1cd25218ed3def4b2b39ab0a1e2cd6169694fc5bdd0e3ee7

# Weights: a node-local disk, re-downloaded on rebuild — not ADR 0015 state (plan §7.3).
llm_models_device: /dev/vdc
llm_models_label: llm-models
llm_models_dir: /var/lib/llm/models
# Holder slot 6 (PAIR identity + Ollama's small models).
llm_data_label: vm-900-disk-5
llm_data_dir: /data

# Tags move; the build pins the commit the tag pointed at when it was reviewed.
llm_llama_cpp_repo: https://github.com/ggml-org/llama.cpp.git
llm_llama_cpp_version: master # no tag contains the benched commit; v0.4.0 predates it
llm_llama_cpp_commit: 41abbfd599fbdd3470fcae0a1fb6530ad8403cd7
llm_llama_cpp_dir: /opt/llama.cpp

# All experts in VRAM on the 32 GB card. URL pins the HF revision; the sha256 is the LFS oid — both are mandatory (plan §7.9 provenance).
llm_model_file: Qwen3.8-27B-UD-Q4_K_M.gguf
llm_model_url: "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/4ca720788d1e01f1bff70c033e0d0028fd02e502/{{ llm_model_file }}"
llm_model_sha256: 322e194ff79741c7baa497c240f677f54b201b0efab44ca8e50f122b39123482
# Bench suite: candidates kept on disk beside the served model so the b70-bench repo's `scripts/llm-bench.sh suite`
# (LLM_BENCH_SUITE lists these paths) compares them on every engine/Mesa roll. Same pins as above; promote one by moving it into llm_model_*.
llm_bench_models:
  - file: Qwen3-30B-A3B-Q4_K_M.gguf
    url: https://huggingface.co/unsloth/Qwen3-30B-A3B-GGUF/resolve/d5b1d57bd0b504ac62ae6c725904e96ef228dc74/Qwen3-30B-A3B-Q4_K_M.gguf
    sha256: 9f1a24700a339b09c06009b729b5c809e0b64c213b8af5b711b3dbdfd0c5ba48
    args:
      ctx-size: 40960 # trained length; full attention on all 48 layers would need 9.7 GiB KV at 200k
  - file: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    url: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    sha256: ac0e2c1189e055faa36eff361580e79c5bd6f8e76bffb4ce547f167d53e31a61
  # Same trunk plus the nextn head; upstream names it identically to the plain file, so the local name carries -MTP.
  - file: Qwen3.6-35B-A3B-MTP-UD-Q4_K_M.gguf
    url: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/5bc3e238d916f48a861bac2f8a1990a0e9b7e98d/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    sha256: 0b21525e972670ed59e1812e170b27c26355381f0656ecc4e25617ece7dac58b
llm_llama_port: 8081
# Chat runs llama-server in router mode: every model above is a preset named by its file stem, a request's "model" field
# picks one, and --models-max 1 swaps them (a 27B and a 35B cannot share the 32 GB card). The served model loads at start.
llm_llama_models_max: 1
# [*] of the preset file; option names are llama-server's long flags without the dashes.
llm_llama_args:
  n-gpu-layers: 99
  ctx-size: 200000 # KV at q8_0: 27B 6.9 GiB, 35B-A3B ~2 GiB; 262k leaves the 27B too little headroom beside the embedder
  threads: 6 # = pinned P-cores (vm-configs.tf cpu_affinity)
  flash-attn: "on"
  cache-type-k: q8_0
  cache-type-v: q8_0
  jinja: true
  metrics: true
  parallel: 4
  kv-unified: true # the 4 slots share the 200k KV pool; without it each slot gets 50k
# No MTP: speculative drafting serves one stream, and agents issue concurrent requests (--parallel 4). Single-stream it
# lifts the 27B from 22 to 36 t/s (b70-bench results); whether it can share slots is measured before it returns.
llm_model_args: {}

# Embeddings: their own always-loaded llama-server on the card, so a chat swap can never evict them. Caddy sends
# /llama/v1/embeddings here. Qwen3-Embedding-4B (2560 dims) is what every code-intelligence index was built with, and
# the alias is the model string it compares across units. Q8_0, never Q4: quantization noise lands in the vectors.
# Pooling must be `last`; the default mean pooling returns plausible, wrong vectors.
llm_embed_model_file: Qwen3-Embedding-4B-Q8_0.gguf
llm_embed_model_url: "https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/f4602530db1d980e16da9d7d3a70294cf5c190be/{{ llm_embed_model_file }}"
llm_embed_model_sha256: b60ae5ce2dd6a0b77f82cadf21def1f310a3e10cde380ad0081b07a9d416949d
llm_embed_alias: Qwen3-Embedding-4B
llm_embed_port: 8082
llm_embed_extra_args: "--embedding --pooling last -ngl 99 -c 8192 -b 8192 -ub 8192 -t 2"

# Ollama stays as PAIR's supported backend, CPU-only so it can never take the card from llama-server.
llm_ollama_version: 0.32.15
llm_ollama_url: "https://github.com/ollama/ollama/releases/download/v{{ llm_ollama_version }}/ollama-linux-amd64.tar.zst"
llm_ollama_sha256: 50539c5fe9bf85887733355098dcdb266b433cb8c73fa180713417e9ed6e42bb
llm_ollama_port: 11435
llm_ollama_env:
  OLLAMA_HOST: "127.0.0.1:{{ llm_ollama_port }}"
  OLLAMA_MODELS: "{{ llm_data_dir }}/ollama/models"

# NVIDIA PAIR: installed only when the operator pins a package (the .deb is behind NVIDIA's download page).
llm_pair_deb_url: ""
llm_pair_deb_sha256: ""
llm_pair_port: 11434 # PAIR's Ollama/OpenAI-compatible proxy; must bind loopback (asserted after start)
llm_pair_state_dir: "{{ llm_data_dir }}/pair"

# Per-client API keys, one Infisical /llm secret each (llm_api_key_<client>), rendered into Caddy's env by the agent.
llm_api_clients: [agents, operator, code_intel, mcp]
llm_env_file: /etc/infisical/secrets/llm.env
llm_caddy_tls_dir: /etc/caddy/tls
