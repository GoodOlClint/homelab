# Measured budget with the embedder resident (b70-bench 2026-09-16): 17.47 GiB weights + 2.85 peak activation
# + 0.74 non-torch + 2.13 graph capture + 7.63 KV = 201,769 tokens, decoding 61/57/40 t/s per stream at 1/2/4
# streams on 4k prompts. NEVER raise to `0.88` with `--max-num-seqs 64`: the guest OOM-kills the engine during
# init on host memory pinned by GPU-mapped buffers, which xpu-smi folds into its device figure and VRAM
# headroom arithmetic cannot see. Measured values, not derived ones.
llm_vllm_args:
  - --quantization gptq
  - --dtype float16
  - --kv-cache-dtype fp8
  - --gpu-memory-utilization 0.90
  - --max-num-seqs 8
  - --max-num-batched-tokens 4096
  - --max-model-len 200000
  - --language-model-only
  - --speculative-config '{"method":"mtp","num_speculative_tokens":4}'

# Docker's data-root and the containerd content store are two stores, and both ride the node-local weights disk:
# the image alone is 32 GB and the root disk is 30 GB. /data stays the ADR 0015 holder slot and carries neither.
llm_docker_dir: "{{ llm_models_dir }}/docker"
llm_containerd_dir: "{{ llm_models_dir }}/containerd"

# Embeddings: their own always-loaded llama-server on the card, so the chat engine can never evict them. Caddy
# sends /llama/v1/embeddings here. bge-m3 replaced Qwen3-Embedding-4B on 2026-09-16 (ADR 0051): it ties the 4B on
# code-intelligence's retrieval set at 6,400 tok/s against 2,460, and both cannot sit beside vLLM at 0.90.
# Pooling must be `cls` for this model; the default mean pooling returns plausible, wrong vectors. The alias is the
# exact string code-intelligence's generator records as provider/model and compares between endpoints — a contract.
llm_embed_model_file: bge-m3-FP16.gguf
llm_embed_model_url: "https://huggingface.co/gpustack/bge-m3-GGUF/resolve/2d48f1737679ad900d5c26c5aad5410e9c70fdca/{{ llm_embed_model_file }}"
llm_embed_model_sha256: daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c
llm_embed_alias: baai/bge-m3
llm_embed_port: 8082
# The measured line, plus --cache-ram 0: llama-server's default 8 GiB host prompt cache is host RAM an embedding
# server never hits, and host RAM is what OOM-stormed this guest once already.
llm_embed_extra_args: "--embedding --pooling cls -ngl 99 -c 8192 -b 8192 -ub 8192 -fa on --cache-ram 0 -t 2"

# Ollama stays as PAIR's supported backend, CPU-only so it can never take the card from llama-server.
llm_ollama_version: 0.32.15
llm_ollama_url: "https://github.com/ollama/ollama/releases/download/v{{ llm_ollama_version }}/ollama-linux-amd64.tar.zst"
llm_ollama_sha256: 50539c5fe9bf85887733355098dcdb266b433cb8c73fa180713417e9ed6e42bb
llm_ollama_port: 11435
llm_ollama_env:
  OLLAMA_HOST: "127.0.0.1:{{ llm_ollama_port }}"
  OLLAMA_MODELS: "{{ llm_data_dir }}/ollama/models"

# NVIDIA PAIR: installed only when the operator pins a package (the .deb is behind NVIDIA's download page).
llm_pair_deb_url: ""
llm_pair_deb_sha256: ""
llm_pair_port: 11434 # PAIR's Ollama/OpenAI-compatible proxy; must bind loopback (asserted after start)
llm_pair_state_dir: "{{ llm_data_dir }}/pair"

# Per-client API keys, one Infisical /llm secret each (llm_api_key_<client>), rendered into Caddy's env by the agent.
llm_api_clients: [agents, operator, code_intel, mcp, case_project]
llm_env_file: /etc/infisical/secrets/llm.env
llm_caddy_tls_dir: /etc/caddy/tls
