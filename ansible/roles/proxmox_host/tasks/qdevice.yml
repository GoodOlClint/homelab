---
# Temporary QDevice while the cluster is 2-node (plan: crete+crete2 before pve
# joins). Needs corosync-qnetd running on the external host (Synology/Pi) —
# operator-provided, bound as cluster.qdevice_addr. Dropped automatically once
# the play sees 3+ nodes.

- name: Check for an active QDevice
  ansible.builtin.command:
    cmd: pvecm status
  register: _qdev_status
  changed_when: false

- name: Install corosync-qdevice
  ansible.builtin.apt:
    name: corosync-qdevice
    state: present
  when:
    - groups['proxmox'] | length == 2
    - proxmox_host_qdevice_addr | length > 0

# Hard gate (audit 2026-08-10): a 2-node cluster without a working QDevice is
# one node-loss away from total quorum loss, and the old "skip cleanly when
# unbound" behavior hid exactly that. If the inventory says 2 nodes, a QDevice
# is mandatory — no binding, no cluster build.
- name: Require a QDevice binding for 2-node operation
  ansible.builtin.assert:
    that:
      - proxmox_host_qdevice_addr | length > 0
    fail_msg: >-
      2-node cluster requires a QDevice: set cluster.qdevice_addr in
      network-data/local/host-bindings.yaml (corosync-qnetd host) before
      running the cluster build.
    quiet: true
  run_once: true
  when: groups['proxmox'] | length == 2

# `pvecm qdevice setup` ssh-copy-ids root@qnetd interactively and aborts if
# corosync-qnetd is missing there — both are hands-off when prepared here.
- name: Install corosync-qnetd on the QDevice host
  ansible.builtin.apt:
    name: corosync-qnetd
    state: present
  delegate_to: "{{ proxmox_host_qdevice_addr }}"
  vars:
    ansible_user: root
  run_once: true
  when:
    - groups['proxmox'] | length == 2
    - proxmox_host_qdevice_addr | length > 0

- name: Read each node's root SSH public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_rsa.pub
  register: _node_root_pub
  when:
    - groups['proxmox'] | length == 2
    - proxmox_host_qdevice_addr | length > 0

- name: Authorize the node root keys on the QDevice host
  ansible.posix.authorized_key:
    user: root
    key: "{{ _node_root_pub.content | b64decode }}"
  delegate_to: "{{ proxmox_host_qdevice_addr }}"
  vars:
    ansible_user: root
  when:
    - groups['proxmox'] | length == 2
    - proxmox_host_qdevice_addr | length > 0

# pvecm's ssh-copy-id has no tty under Ansible: an unknown host key hangs forever.
- name: Trust the QDevice host key on each node
  ansible.builtin.known_hosts:
    name: "{{ proxmox_host_qdevice_addr }}"
    key: >-
      {{ lookup('ansible.builtin.pipe',
                'ssh-keyscan -T 5 -t ed25519 ' ~ proxmox_host_qdevice_addr ~ ' 2>/dev/null | grep -v "^#"') }}
  when:
    - groups['proxmox'] | length == 2
    - proxmox_host_qdevice_addr | length > 0

- name: Set up the QDevice (2-node cluster only)
  ansible.builtin.command:
    cmd: "pvecm qdevice setup {{ proxmox_host_qdevice_addr }} -f"
  run_once: true
  changed_when: true
  when:
    - groups['proxmox'] | length == 2
    - proxmox_host_qdevice_addr | length > 0
    - "'Qdevice' not in _qdev_status.stdout"

- name: Verify the QDevice is active (2-node cluster only)
  ansible.builtin.command:
    cmd: pvecm status
  register: _qdev_verify
  changed_when: false
  failed_when: "'Qdevice' not in _qdev_verify.stdout"
  run_once: true
  when: groups['proxmox'] | length == 2

- name: Remove the QDevice (3rd node has joined)
  ansible.builtin.command:
    cmd: pvecm qdevice remove
  run_once: true
  changed_when: true
  when:
    - groups['proxmox'] | length >= 3
    - "'Qdevice' in _qdev_status.stdout"
