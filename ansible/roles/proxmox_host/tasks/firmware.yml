---
# CPU microcode + device firmware currency (added 2026-08-12 after the pve
# 14900K Vmin-shift diagnosis). The kernel early-loads intel-microcode at every
# boot, so CPU fixes arrive via apt instead of waiting on a vendor BIOS flash;
# fwupd covers LVFS-published device firmware (NVMe, UEFI dbx). Relies on the
# PVE 9 installer's default non-free-firmware component — if a host lacks it,
# this fails loudly rather than silently pinning 2023-era microcode.
- name: Install microcode, firmware update, and hardware-fault capture tooling
  ansible.builtin.apt:
    name:
      - intel-microcode
      - fwupd
      - rasdaemon
      - systemd-coredump
    state: present
  tags:
    - proxmox_host
    - firmware

# Hardware-fault capture (added with the 14900K Vmin-shift investigation):
# rasdaemon persists+decodes MCE/RAS events; systemd-coredump keeps crash
# dumps of the next mystery segfault (coredumpctl); print-fatal-signals logs
# every fatal signal with CPU attribution.
- name: Enable rasdaemon
  ansible.builtin.systemd:
    name: rasdaemon
    enabled: true
    state: started
  tags:
    - proxmox_host
    - firmware

- name: Log fatal signals with CPU attribution
  ansible.builtin.copy:
    content: "kernel.print-fatal-signals = 1\n"
    dest: /etc/sysctl.d/98-fatal-signals.conf
    mode: '0644'
  notify: apply sysctl
  tags:
    - proxmox_host
    - firmware

# Crash-signature push alert — gated on the binding like the syslog target:
# the hosts plane must not hard-depend on Infisical or any guest (ADR 0011's
# ntfy topic is delivered via gitignored host-bindings.yaml, not the agent).
- name: Configure crash-signature ntfy alert
  when: ((host_bindings.cluster | default({})).alert_ntfy_topic | default('')) | length > 0
  tags:
    - proxmox_host
    - firmware
  block:
    - name: Deploy crash-alert watcher script
      ansible.builtin.template:
        src: crash-alert.sh.j2
        dest: /usr/local/sbin/crash-alert.sh
        mode: '0700'
        owner: root
        group: root
      notify: restart crash-alert

    - name: Deploy crash-alert service unit
      ansible.builtin.template:
        src: crash-alert.service.j2
        dest: /etc/systemd/system/crash-alert.service
        mode: '0644'
      notify: restart crash-alert

    - name: Enable crash-alert service
      ansible.builtin.systemd:
        name: crash-alert
        enabled: true
        state: started
        daemon_reload: true

- name: Enable fwupd metadata refresh timer
  ansible.builtin.systemd:
    name: fwupd-refresh.timer
    enabled: true
    state: started
  tags:
    - proxmox_host
    - firmware
