---
# Fresh answer-file nodes arrive with the enterprise repos enabled and the
# bootstrap resolver (1.1.1.1 — blocked from the install VLAN by pfSense), so
# nothing below could install anything. Resolver + sources first, cache refresh
# in the same role (a source change is never left for a later play to discover).

- name: Read current resolver
  ansible.builtin.command:
    cmd: cat /etc/resolv.conf
  register: _resolv_current
  changed_when: false

# Through PVE's own API so /etc/resolv.conf stays PVE-managed (not hand-edited).
- name: Point the node's resolver at the fleet DNS (AdGuard first)
  ansible.builtin.command:
    cmd: >-
      pvesh set /nodes/{{ inventory_hostname }}/dns
      --dns1 {{ network_data.dns_servers[0] }}
      {% if network_data.dns_servers | length > 1 %}--dns2 {{ network_data.dns_servers[1] }}{% endif %}
      --search {{ proxmox_host_dns_search }}
  when: >-
    not (_resolv_current.stdout is search(network_data.dns_servers[0])
         and _resolv_current.stdout is search('search ' ~ proxmox_host_dns_search))

- name: Drop enterprise sources (no subscription)
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pve-enterprise.sources
    - pve-enterprise.list
    - ceph.list
  register: _pve_enterprise_removed

- name: pve-no-subscription repo (deb822)
  ansible.builtin.deb822_repository:
    name: pve-no-subscription
    types: deb
    uris: "http://download.proxmox.com/debian/pve"
    suites: "{{ ansible_distribution_release }}"
    components: pve-no-subscription
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
  register: _pve_nosub_repo

# Same path the installer's enterprise ceph.sources uses, so this replaces it
# (deleting it instead would also delete what `pveceph install` writes later).
- name: ceph no-subscription repo (deb822)
  ansible.builtin.deb822_repository:
    name: ceph
    types: deb
    uris: "http://download.proxmox.com/debian/ceph-{{ proxmox_host_ceph_release }}"
    suites: "{{ ansible_distribution_release }}"
    components: no-subscription
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
  register: _ceph_nosub_repo

- name: apt proxy auto-detect (ADR 0021)
  ansible.builtin.include_role:
    name: apt_proxy

- name: Refresh apt after source changes
  ansible.builtin.apt:
    update_cache: true
  when: _pve_enterprise_removed is changed or _pve_nosub_repo is changed or _ceph_nosub_repo is changed
