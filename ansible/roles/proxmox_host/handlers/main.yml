---
- name: Reload keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: reloaded

- name: restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: restart netconsole
  ansible.builtin.systemd:
    name: netconsole
    state: restarted
    daemon_reload: true
