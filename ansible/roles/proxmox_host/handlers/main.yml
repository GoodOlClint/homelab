---
- name: Reload keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: reloaded

- name: restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: restart netconsole
  ansible.builtin.systemd:
    name: netconsole
    state: restarted
    daemon_reload: true

- name: restart crash-alert
  ansible.builtin.systemd:
    name: crash-alert
    state: restarted
    daemon_reload: true

- name: rebuild initramfs and sync ESPs
  ansible.builtin.shell: |
    set -e
    update-initramfs -u -k all
    proxmox-boot-tool refresh
  changed_when: true

- name: vfio binding needs a host reboot
  ansible.builtin.debug:
    msg: "vfio-gpu.conf changed on {{ inventory_hostname }}: drain and reboot the node before starting the GPU guest"
