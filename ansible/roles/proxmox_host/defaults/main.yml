---
# WP2 — Proxmox host/cluster plane (pvecm, corosync rings, Ceph, VIP).
# Site bindings come from network-data/local/host-bindings.yaml (loaded by the
# playbook as `host_bindings`); addressing derives from vlans.yaml (`network_data`).

proxmox_host_cluster_name: "homelab"

# VLAN scheme (structural — actual prefix comes from vlans.yaml at runtime)
proxmox_host_mgmt_vlan: "{{ network_data.vlans.infrastructure.id }}"
proxmox_host_ring0_vlan: "{{ network_data.vlans.corosync.id }}"
proxmox_host_ring1_vlan: "{{ network_data.vlans.corosync_ring1.id }}"
proxmox_host_storage_vlan: "{{ network_data.vlans.storage.id }}"
# Ceph cluster network: switched 25G — SFP28 ports on the aggregation switch,
# access/native VLAN on each node's ConnectX port (ADR-0014; replaces the FRR mesh).
proxmox_host_ceph_vlan: "{{ network_data.vlans.ceph.id }}"
proxmox_host_ceph_mtu: "{{ network_data.vlans.ceph.mtu | default(9000) }}"

# Ceph network split (ADR-0009, decided at pveceph init — retrofit is painful):
# public (client access) on the 10G storage VLAN so non-25G nodes can be clients;
# cluster (OSD replication) on the switched 25G ceph VLAN.
proxmox_host_ceph_public_network: "{{ network_data.ipv4_prefix }}.{{ proxmox_host_storage_vlan }}.0/24"
proxmox_host_ceph_cluster_network: "{{ network_data.ipv4_prefix }}.{{ proxmox_host_ceph_vlan }}.0/24"
proxmox_host_mgr_count: 2
# Ceph release whose repo the node tracks (PVE 9 ships squid).
proxmox_host_ceph_release: squid

# Cluster-wide bindings
proxmox_host_vip_cidr: "{{ host_bindings.cluster.vip_cidr }}"
# PVE API password for root@pam — the tier-1 bootstrap root password (same one
# the answer file hashes). Cluster create/join use the community.proxmox API
# modules (ADR 0023); proxmox-hosts.yml loads bootstrap.sops.yml to supply it,
# and cluster.yml asserts it is non-empty before touching the API.
proxmox_host_api_password: "{{ bootstrap.proxmox_password | default('') }}"
proxmox_host_qdevice_addr: "{{ host_bindings.cluster.qdevice_addr | default('') }}"

# keepalived
proxmox_host_vrrp_router_id: 51
proxmox_host_vrrp_base_priority: 150
# VRRP interface — the re-homed mgmt subif in production (network.yml). Overridable
# so a nonstandard/test topology (e.g. the W4 nested single-NIC plane, mgmt on bare
# vmbr0) can point VRRP at its actual mgmt interface.
proxmox_host_vip_interface: "vmbr0.{{ proxmox_host_mgmt_vlan }}"

# Per-node derived facts (bindings + install-octet scheme)
proxmox_host_node: "{{ host_bindings.nodes[inventory_hostname] }}"
proxmox_host_octet: "{{ proxmox_host_node.install_cidr | regex_replace('/.*', '') | split('.') | last }}"
proxmox_host_mgmt_cidr: "{{ proxmox_host_node.install_cidr }}"
proxmox_host_mgmt_ip: "{{ proxmox_host_node.install_cidr | regex_replace('/.*', '') }}"
proxmox_host_gateway: "{{ proxmox_host_node.install_gateway }}"
proxmox_host_ring0_ip: "{{ network_data.ipv4_prefix }}.{{ proxmox_host_ring0_vlan }}.{{ proxmox_host_octet }}"
proxmox_host_ring1_ip: "{{ network_data.ipv4_prefix }}.{{ proxmox_host_ring1_vlan }}.{{ proxmox_host_octet }}"
proxmox_host_ceph_ip: "{{ network_data.ipv4_prefix }}.{{ proxmox_host_ceph_vlan }}.{{ proxmox_host_octet }}"

# Restore-bridge ZFS pool on the boot disks' free space (ADR 0027); per-node
# binding `bridge_disks` = the two boot-disk by-id paths, empty = no pool.
proxmox_host_bridge_pool: bridge
proxmox_host_bridge_part: 4
proxmox_host_bridge_disks: "{{ proxmox_host_node.bridge_disks | default([]) }}"

# NAS NFS export registered cluster-wide as PVE storage (binding: "<server>:<export>").
proxmox_host_nas_nfs_id: nas-nfs
proxmox_host_nas_nfs: "{{ host_bindings.cluster.nas_nfs | default('') }}"

# Ceph pool + storage IDs (owned by tasks/ceph.yml; the fleet root's cutover
# tfvars consume these as its primary_disk_storage / virtual_environment_storage)
proxmox_host_ceph_pool: "ceph-rbd"
proxmox_host_cephfs_name: "cephfs"
proxmox_host_mds_count: 2

# Ceph health-gate waivers: check CODES (e.g. "OSDMAP_FLAGS") that are known,
# understood, and deliberately accepted — each entry needs a reason comment.
# Starts empty; HEALTH_WARN with any unwaived check fails the play.
proxmox_host_ceph_health_waivers: []

# netconsole raw stream port on the collector (axosyslog `netconsole` source —
# deliberately parser-free; ordinary syslog is 5514 and the two must never mix)
proxmox_host_netconsole_port: 5515

# Fleet media UID/GID range mapped 1:1 into media LXCs (ADR 0017 convention;
# must match the module's media_idmap_uid/media_idmap_size)
proxmox_host_media_idmap_start: 2000
proxmox_host_media_idmap_size: 11

# Resolver search domain set via pvesh (repos.yml); fleet internal zone.
proxmox_host_dns_search: "{{ network_data.service_domain }}"

# CI sandbox reaper (ADR 0032): destroy pool members older than this, so a
# killed job never leaks a guest. 0 disables.
proxmox_host_ci_pool: ci
proxmox_host_ci_max_age_hours: 8

# ADR 0041: the cluster VIP name, a SAN on every node cert
proxmox_host_vip_name: pve
