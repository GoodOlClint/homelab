---
# Driven from inside the pod, so neither DNS nor the ingress is in the loop; the pod takes nothing
# from the environment — its Secrets exist only for this tail.
- name: jellyfin rolled out
  ansible.builtin.command: "{{ k8s_apps_kubectl }} -n jellyfin rollout status deploy/jellyfin --timeout=600s"
  changed_when: false

- name: jellyfin secrets (InfisicalSecret-managed)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_apps_kubeconfig }}"
    kind: Secret
    namespace: jellyfin
    name: "{{ item }}"
  loop: [jellyfin-admin, jellyfin-ldap]
  register: _jf_secrets
  until: _jf_secrets.resources | length > 0
  retries: 30
  delay: 2
  no_log: true

- ansible.builtin.set_fact:
    _jf: "{{ k8s_apps_kubectl }} -n jellyfin exec deploy/jellyfin -- curl -sSf -H content-type:application/json http://localhost:8096"
    _jfi: "{{ k8s_apps_kubectl }} -n jellyfin exec -i deploy/jellyfin -- curl -sSf -H content-type:application/json http://localhost:8096"
    _jf_admin_pw: "{{ _jf_secrets.results[0].resources[0].data.ADMIN_PASSWORD | b64decode }}"
    _jf_ldap_pw: "{{ _jf_secrets.results[1].resources[0].data.LDAP_BIND_PASSWORD | b64decode }}"
  no_log: true

- name: Wizard state
  ansible.builtin.command: "{{ _jf }}/System/Info/Public"
  register: _jf_public
  changed_when: false

- name: First-run wizard
  when: not (_jf_public.stdout | from_json).StartupWizardCompleted
  block:
    - ansible.builtin.command:
        cmd: "{{ _jfi }}/Startup/Configuration -X POST -d @-"
        stdin: '{"UICulture":"en-US","MetadataCountryCode":"US","PreferredMetadataLanguage":"en"}'
    # the GET initializes the first user; the POST 404s without it
    - ansible.builtin.command: "{{ _jf }}/Startup/User"
    - ansible.builtin.command:
        cmd: "{{ _jfi }}/Startup/User -X POST -d @-"
        stdin: "{{ {'Name': 'admin', 'Password': _jf_admin_pw} | to_json }}"
      no_log: true
    - ansible.builtin.command:
        cmd: "{{ _jfi }}/Startup/RemoteAccess -X POST -d @-"
        stdin: '{"EnableRemoteAccess":true,"EnableAutomaticPortMapping":false}'
    - ansible.builtin.command: "{{ _jf }}/Startup/Complete -X POST"

- name: Admin session
  ansible.builtin.command:
    cmd: >-
      {{ _jfi }}/Users/AuthenticateByName -X POST -d @-
      -H 'Authorization: MediaBrowser Client="ansible", Device="k8s_apps", DeviceId="k8s_apps", Version="1"'
    stdin: "{{ {'Username': 'admin', 'Pw': _jf_admin_pw} | to_json }}"
  register: _jf_auth
  changed_when: false
  no_log: true

- ansible.builtin.set_fact:
    _jf_h: "-H 'Authorization: MediaBrowser Token=\"{{ (_jf_auth.stdout | from_json).AccessToken }}\"'"
  no_log: true

- name: Installed plugins
  ansible.builtin.command: "{{ _jf }}/Plugins {{ _jf_h }}"
  register: _jf_plugins
  changed_when: false
  no_log: true

- name: LDAP-Auth plugin
  when: _jf_plugins.stdout | from_json | selectattr('Id', 'equalto', k8s_apps_jellyfin_ldap_plugin | replace('-', '')) | list | length == 0
  block:
    - ansible.builtin.command: "{{ _jf }}/Packages/Installed/LDAP%20Authentication -X POST {{ _jf_h }}"
    - ansible.builtin.command: "{{ _jf }}/System/Restart -X POST {{ _jf_h }}"
      failed_when: false
    - ansible.builtin.pause: {seconds: 10}
    - ansible.builtin.command: "{{ _jf }}/Plugins {{ _jf_h }}"
      register: _jf_plugins
      until: _jf_plugins.rc == 0 and _jf_plugins.stdout | from_json | selectattr('Id', 'equalto', k8s_apps_jellyfin_ldap_plugin | replace('-', '')) | list | length > 0
      retries: 60
      delay: 5
      changed_when: false
      no_log: true

- name: LDAP plugin configuration
  ansible.builtin.command: "{{ _jf }}/Plugins/{{ k8s_apps_jellyfin_ldap_plugin }}/Configuration {{ _jf_h }}"
  register: _jf_ldap_have
  changed_when: false
  no_log: true

- name: LDAP plugin configuration (merged only when it differs)
  vars:
    _b: "{{ k8s_apps_jellyfin_ldap_base }}"
    _have: "{{ _jf_ldap_have.stdout | from_json }}"
    _want:
      LdapServer: ak-outpost-ldap.authentik-ext.svc
      LdapPort: 389
      UseSsl: false
      UseStartTls: false
      SkipSslVerify: false
      LdapBindUser: "cn=ldapsvc,ou=users,{{ _b }}"
      LdapBindPassword: "{{ _jf_ldap_pw }}"
      LdapBaseDn: "{{ _b }}"
      LdapSearchFilter: "(|(memberOf=cn=family,ou=groups,{{ _b }})(memberOf=cn=admins,ou=groups,{{ _b }}))"
      LdapAdminBaseDn: ""
      LdapAdminFilter: "(memberOf=cn=admins,ou=groups,{{ _b }})"
      EnableLdapAdminFilterMemberUid: false
      LdapSearchAttributes: "uid, cn, mail, displayName"
      LdapUidAttribute: uid
      LdapUsernameAttribute: cn
      LdapPasswordAttribute: userPassword
      CreateUsersFromLdap: true
      AllowPassChange: false
      EnableAllFolders: true
      EnabledFolders: []
  ansible.builtin.command:
    cmd: "{{ _jfi }}/Plugins/{{ k8s_apps_jellyfin_ldap_plugin }}/Configuration -X POST {{ _jf_h }} -d @-"
    stdin: "{{ _have | combine(_want) | to_json }}"
  when: _have | combine(_want) != _have
  no_log: true

- name: Libraries
  ansible.builtin.command: "{{ _jf }}/Library/VirtualFolders {{ _jf_h }}"
  register: _jf_libs
  changed_when: false
  no_log: true

# refreshLibrary=true blocks the request on the scan; scan once, asynchronously, below
- name: Missing libraries
  ansible.builtin.command:
    cmd: >-
      {{ _jfi }}/Library/VirtualFolders?name={{ item.key }}&collectionType={{ item.value }}&paths=/data/media/{{ item.key }}&refreshLibrary=false
      -X POST {{ _jf_h }} -d @-
    stdin: '{"LibraryOptions":{"EnableRealtimeMonitor":false}}'
  loop: "{{ k8s_apps_jellyfin_libraries | dict2items }}"
  loop_control: {label: "{{ item.key }}"}
  when: item.key not in (_jf_libs.stdout | from_json | map(attribute='Name') | list)
  register: _jf_lib_add
  no_log: true

- name: Scan the new libraries
  ansible.builtin.command: "{{ _jf }}/Library/Refresh -X POST {{ _jf_h }}"
  when: _jf_lib_add is changed
  no_log: true
