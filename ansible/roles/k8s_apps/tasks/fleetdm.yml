---
# ADR 0065: server_private_key encrypts the stored Apple push certificate inside MySQL, so rotating it orphans every backup.
- name: fleetdm secrets
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_secret.yml"
  vars:
    secret_key: "{{ sk.key }}"
    secret_gen_cmd: "{{ sk.cmd }}"
    secret_comment: "Fleet MDM: {{ sk.comment }}"
    secret_infisical_path: /fleetdm
    secret_dict_path: fleetdm
  loop:
    - {key: mysql_root_password, cmd: openssl rand -hex 24, comment: MySQL root password (the mysql-backup CronJob)}
    - {key: mysql_password, cmd: openssl rand -hex 24, comment: MySQL password of the fleet user}
    - {key: server_private_key, cmd: openssl rand -base64 32, comment: Fleet server private key (encrypts the stored Apple push certificate)}
    - {key: admin_password, cmd: "printf '%s-%s' \"$(openssl rand -hex 10)\" \"$(openssl rand -hex 10)\"", comment: Fleet break-glass admin password (Fleet requires a symbol and at most 48 characters)}
  loop_control: {loop_var: sk, label: "{{ sk.key }}"}

- name: fleetdm rolled out
  ansible.builtin.command: "{{ k8s_apps_kubectl }} -n fleetdm rollout status deploy/fleet --timeout=600s"
  changed_when: false

# v4.95.0 has no GET setup endpoint: while setup is open every non-osquery API path answers 404, once closed an unauthenticated /me answers 401.
- name: fleetdm API over a port-forward
  block:
    - name: fleetdm port-forward state directory
      ansible.builtin.tempfile:
        state: directory
        prefix: fleetdm-pf-
      register: _fleetdm_pf
      changed_when: false

    - name: fleetdm port-forward started
      ansible.builtin.shell:
        cmd: >-
          nohup {{ k8s_apps_kubectl }} -n fleetdm port-forward --address 127.0.0.1 svc/fleet-service :8080
          </dev/null >{{ _fleetdm_pf.path }}/log 2>&1 & echo $! > {{ _fleetdm_pf.path }}/pid
      changed_when: false

    - name: fleetdm port-forward local port
      ansible.builtin.slurp:
        src: "{{ _fleetdm_pf.path }}/log"
      register: _fleetdm_pf_log
      until: (_fleetdm_pf_log.content | b64decode) is search('Forwarding from 127.0.0.1:[0-9]+')
      retries: 30
      delay: 1

    - name: fleetdm API address
      ansible.builtin.set_fact:
        _fleetdm_base: "https://127.0.0.1:{{ _fleetdm_pf_log.content | b64decode | regex_search('Forwarding from 127.0.0.1:([0-9]+)', '\\1') | first }}/api/v1"

    - name: fleetdm setup state
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/me"
        validate_certs: false
        status_code: [401, 404]
      register: _fleetdm_probe
      changed_when: false

    - name: fleetdm setup is open and first setup was not requested
      ansible.builtin.fail:
        msg: >-
          Fleet setup is open: an unauthenticated visitor could create the admin. On a first install run
          `make k8s-apps FLEETDM_FIRST_SETUP=1`; otherwise this Fleet started on an empty database (a recovery
          that skipped the restore) and must not be exposed.
      when: _fleetdm_probe.status == 404 and not (fleetdm_first_setup | default(false) | bool)

    - name: fleetdm first setup
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/setup"
        method: POST
        body_format: json
        body:
          admin:
            name: "{{ fleetdm_admin_name }}"
            email: "{{ fleetdm_admin_email }}"
            password: "{{ secrets.fleetdm.admin_password }}"
          org_info: {org_name: "{{ fleetdm_org_name }}"}
          server_url: "https://{{ fleetdm_host }}"
        validate_certs: false
        status_code: [200, 400, 409, 422, 500]
        return_content: true
        timeout: 120
      register: _fleetdm_setup
      failed_when: false
      when: _fleetdm_probe.status == 404
      changed_when: _fleetdm_setup.status | default(0) == 200
      no_log: true

    - name: fleetdm first setup succeeded
      ansible.builtin.assert:
        that: _fleetdm_setup.status == 200
        fail_msg: "Fleet setup answered {{ _fleetdm_setup.status }}: {{ _fleetdm_setup.json.message | default(_fleetdm_setup.content | default(_fleetdm_setup.msg | default(''))) | truncate(400) }}"
        quiet: true
      when: _fleetdm_setup is not skipped

    - name: fleetdm admin login
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/login"
        method: POST
        body_format: json
        body:
          email: "{{ fleetdm_admin_email }}"
          password: "{{ secrets.fleetdm.admin_password }}"
        validate_certs: false
        status_code: 200
      register: _fleetdm_login
      changed_when: false
      no_log: true

    - name: fleetdm config
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/config"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
      register: _fleetdm_config
      changed_when: false
      no_log: true

    # Fleet refuses a metadata_url that resolves to a private address, so the metadata travels inline.
    - name: fleetdm IdP metadata
      ansible.builtin.uri:
        url: "{{ fleetdm_sso_metadata_url }}"
        return_content: true
      register: _fleetdm_idp_metadata
      changed_when: false

    - name: fleetdm SSO settings
      vars:
        _want:
          enable_sso: true
          entity_id: "https://{{ fleetdm_host }}"
          idp_name: authentik
          metadata: "{{ _fleetdm_idp_metadata.content }}"
          metadata_url: ""
          enable_sso_idp_login: false
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/config"
        method: PATCH
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        body_format: json
        body: {sso_settings: "{{ _want }}"}
        validate_certs: false
      when: (_fleetdm_config.json.sso_settings | default({})) | dict2items | selectattr('key', 'in', _want.keys() | list) | items2dict != _want
      changed_when: true
      no_log: true

    - name: fleetdm users before
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/users"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
      register: _fleetdm_users_before
      changed_when: false
      no_log: true

    - name: fleetdm SSO admins exist
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/users/admin"
        method: POST
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        body_format: json
        body: {name: "{{ item.name }}", email: "{{ item.email }}", sso_enabled: true, global_role: admin}
        validate_certs: false
      loop: "{{ fleetdm_sso_admins | rejectattr('email', 'in', _fleetdm_users_before.json.users | map(attribute='email') | list) | list }}"
      loop_control: {label: "{{ item.name }}"}
      changed_when: true
      no_log: true

    - name: fleetdm users
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/users"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
      register: _fleetdm_users
      changed_when: false
      no_log: true

    - name: fleetdm SSO admins sign in by SSO only
      ansible.builtin.assert:
        that: >-
          (_fleetdm_users.json.users | selectattr('email', 'in', fleetdm_sso_admins | map(attribute='email') | list)
           | rejectattr('sso_enabled') | list) == []
        fail_msg: An SSO admin in Fleet has sso_enabled false (a password login); fix it in Fleet's user settings.
        quiet: true

    - name: fleetdm global admins are exactly the expected ones
      ansible.builtin.assert:
        that: >-
          (_fleetdm_users.json.users | selectattr('global_role', 'equalto', 'admin') | map(attribute='email') | sort | list)
          == (fleetdm_expected_admins | sort | list)
        fail_msg: >-
          Fleet's global admins differ from fleetdm_expected_admins:
          {{ _fleetdm_users.json.users | selectattr('global_role', 'equalto', 'admin') | map(attribute='email') | list }}
        quiet: true

    # Fleet kills a script at script_execution_timeout (default 300 s); a brew upgrade outlasts that.
    - name: fleetdm script timeout
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/config"
        method: PATCH
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        body_format: json
        body: {agent_options: "{{ _fleetdm_config.json.agent_options | combine({'script_execution_timeout': fleetdm_script_timeout}) }}"}
        validate_certs: false
      when: _fleetdm_config.json.agent_options.script_execution_timeout | default(0) != fleetdm_script_timeout
      changed_when: true
      no_log: true

    - name: fleetdm scripts
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/scripts"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
      register: _fleetdm_scripts
      changed_when: false
      no_log: true

    - name: fleetdm script contents
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/scripts/{{ item.id }}?alt=media"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
        return_content: true
      loop: "{{ _fleetdm_scripts.json.scripts | default([], true) | selectattr('name', 'in', fleetdm_scripts | map('basename') | list) | list }}"
      loop_control: {label: "{{ item.name }}"}
      register: _fleetdm_script_contents
      changed_when: false
      no_log: true

    - name: fleetdm scripts match the tree
      vars:
        _name: "{{ item | basename }}"
        _live: "{{ _fleetdm_script_contents.results | selectattr('item.name', 'equalto', _name) | list }}"
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/scripts{{ ('/' ~ _live[0].item.id) if _live else '' }}"
        method: "{{ 'PATCH' if _live else 'POST' }}"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        body_format: form-multipart
        body:
          script: {filename: "{{ _name }}", content: "{{ lookup('file', item) }}\n", mime_type: text/x-shellscript}
        validate_certs: false
      loop: "{{ fleetdm_scripts }}"
      loop_control: {label: "{{ item | basename }}"}
      when: not _live or _live[0].content != lookup('file', item) ~ '\n'
      changed_when: true
      no_log: true

    - name: fleetdm profiles
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/configuration_profiles"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
      register: _fleetdm_profiles
      changed_when: false
      no_log: true

    - name: fleetdm profile contents
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/configuration_profiles/{{ item.profile_uuid }}?alt=media"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
        return_content: true
      loop: "{{ _fleetdm_profiles.json.profiles | default([], true) }}"
      loop_control: {label: "{{ item.name }}"}
      register: _fleetdm_profile_contents
      changed_when: false
      no_log: true

    # Fleet has no profile update: a changed or unknown profile is deleted, and the tree's copy uploaded.
    # The multipart upload arrives with CRLF line ends, so stored copies compare after normalizing them.
    - name: fleetdm profiles not in the tree removed
      vars:
        _tree: "{{ query('file', *fleetdm_profiles) }}"
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/configuration_profiles/{{ item.item.profile_uuid }}"
        method: DELETE
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
        status_code: [200, 204]
      loop: "{{ _fleetdm_profile_contents.results | selectattr('content', 'defined') | list }}"
      loop_control: {label: "{{ item.item.name }}"}
      when: item.content | replace('\r\n', '\n') not in _tree
      changed_when: true
      no_log: true

    - name: fleetdm profiles from the tree uploaded
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/configuration_profiles"
        method: POST
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        body_format: form-multipart
        body:
          profile: {filename: "{{ item | basename }}", content: "{{ lookup('file', item) }}", mime_type: application/x-apple-aspen-config}
        validate_certs: false
      loop: "{{ fleetdm_profiles }}"
      loop_control: {label: "{{ item | basename }}"}
      when: lookup('file', item) not in (_fleetdm_profile_contents.results | map(attribute='content') | map('replace', '\r\n', '\n') | list)
      changed_when: true
      no_log: true

    # 400 until the push certificate is uploaded (operator step 1 of docs/fleetdm-plan.md).
    - name: fleetdm push certificate
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/mdm/apple"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
        status_code: [200, 400, 404]
      register: _fleetdm_apns
      changed_when: false
      no_log: true

    - name: fleetdm push certificate date matches the expiry alert
      vars:
        _rule: >-
          {{ (lookup('file', fleetdm_alert_rules) | from_yaml).groups | map(attribute='rules') | flatten
             | selectattr('alert', 'defined') | selectattr('alert', 'equalto', 'FleetAPNsCertExpiringSoon') | first }}
        _pinned: "{{ _rule.expr | regex_search('vector\\(([0-9]+)\\)', '\\1') | first | int }}"
        _live: "{{ ((_fleetdm_apns.json.renew_date | to_datetime('%Y-%m-%dT%H:%M:%SZ')) - ('1970-01-01' | to_datetime('%Y-%m-%d'))).total_seconds() | int }}"
      ansible.builtin.assert:
        that: _pinned | int == _live | int
        fail_msg: >-
          FleetAPNsCertExpiringSoon pins {{ _pinned }} but Fleet's push certificate renews at
          {{ _fleetdm_apns.json.renew_date }} ({{ _live }}); update vector(...) in kubernetes/monitoring/config/alert.rules.yml.
        quiet: true
      when: _fleetdm_apns.status == 200

    # Policies live on "No team" (teams/0): a run-script automation needs a team scope, and the hosts and scripts sit there.
    - name: fleetdm scripts after sync
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/scripts"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
      register: _fleetdm_scripts_now
      changed_when: false
      no_log: true

    - name: fleetdm policies before
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/teams/0/policies"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
      register: _fleetdm_policies_before
      changed_when: false
      no_log: true

    - name: fleetdm policies from the tree exist
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/teams/0/policies"
        method: POST
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        body_format: json
        body: {name: "{{ item.name }}", query: "{{ item.query }}", platform: "{{ item.platform }}"}
        validate_certs: false
      loop: "{{ lookup('file', fleetdm_policies_file) | from_yaml
                | rejectattr('name', 'in', _fleetdm_policies_before.json.policies | default([], true) | map(attribute='name') | list) | list }}"
      loop_control: {label: "{{ item.name }}"}
      changed_when: true
      no_log: true

    - name: fleetdm policies now
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/teams/0/policies"
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        validate_certs: false
      register: _fleetdm_policies_now
      changed_when: false
      no_log: true

    - name: fleetdm policies match the tree
      vars:
        _live: "{{ _fleetdm_policies_now.json.policies | selectattr('name', 'equalto', item.name) | first }}"
        _script_id: >-
          {{ (_fleetdm_scripts_now.json.scripts | selectattr('name', 'equalto', item.run_script) | map(attribute='id') | first)
             if item.run_script is defined else none }}
        _want: {query: "{{ item.query }}", description: "{{ item.description | default('') }}", resolution: "{{ item.resolution | default('') }}", platform: "{{ item.platform }}"}
      ansible.builtin.uri:
        url: "{{ _fleetdm_base }}/fleet/teams/0/policies/{{ _live.id }}"
        method: PATCH
        headers: {Authorization: "Bearer {{ _fleetdm_login.json.token }}"}
        body_format: json
        body: "{{ _want | combine({'script_id': _script_id}) }}"
        validate_certs: false
      loop: "{{ lookup('file', fleetdm_policies_file) | from_yaml }}"
      loop_control: {label: "{{ item.name }}"}
      when: >-
        (_live | dict2items | selectattr('key', 'in', _want.keys() | list) | items2dict) != _want
        or ((_live.run_script | default(none, true)) or {}).get('id') != _script_id
      changed_when: true
      no_log: true

  always:
    - name: fleetdm port-forward stopped
      ansible.builtin.shell:
        cmd: |
          if [ -f {{ _fleetdm_pf.path }}/pid ]; then kill "$(cat {{ _fleetdm_pf.path }}/pid)" 2>/dev/null || true; fi
          rm -rf {{ _fleetdm_pf.path }}
      when: _fleetdm_pf is defined and _fleetdm_pf.path is defined
      changed_when: false
