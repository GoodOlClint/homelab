# The same set as `make validate`. No secret, no credential, no cluster: everything here runs on a
# bare public clone (ADR 0048 — CI must never hold what Flux could not).
name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: |
            .venv
            ~/.ansible/collections
            terraform/.terraform
            terraform/hosts/.terraform
            terraform/unifi/.terraform
          key: validate-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml', 'terraform/**/.terraform.lock.hcl', '.github/workflows/validate.yml') }}
      - name: Tooling
        run: |
          test -x .venv/bin/ansible-lint || { python3 -m venv .venv && .venv/bin/pip install -q ansible ansible-lint pyyaml; }
          cd ansible && ../.venv/bin/ansible-galaxy collection install -r requirements.yml
          ../.venv/bin/ansible-galaxy role install -r requirements.yml
          curl -sSLo /tmp/tf.zip https://releases.hashicorp.com/terraform/1.16.1/terraform_1.16.1_linux_amd64.zip && sudo unzip -qo /tmp/tf.zip terraform -d /usr/local/bin
          for r in terraform terraform/hosts terraform/unifi; do terraform -chdir=../$r init -backend=false -input=false >/dev/null; done
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - run: make validate
      - name: Security guardrails on the pushed range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in ''|0000000000000000000000000000000000000000) BASE=HEAD~1 ;; esac
          bash scripts/security_guardrails.sh --range "$BASE..${{ github.sha }}"
      - name: Renovate config
        env:
          npm_config_loglevel: error
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict renovate.json
