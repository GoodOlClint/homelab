name: LLM model request
description: Ask for a chat or embedding model to be served from the llm VM.
title: "LLM model for <project>: <model>"
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The chat engine serves one model, so a chat request is a change of what the card holds, not an addition: say what it should replace and why. Embedding models are always loaded and share the card with it. Either way the model has to fit the 32 GB card beside the other one, and a swap is benched before it ships.
  - type: input
    id: project
    attributes:
      label: Requesting project
      placeholder: goodolclint/code-intelligence
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Chat
        - Embeddings
    validations:
      required: true
  - type: input
    id: checkpoint
    attributes:
      label: Checkpoint and revision
      description: >-
        Hugging Face repo and the exact commit. Chat runs on vLLM XPU, so a chat model is a quantized
        safetensors checkpoint (GPTQ-Int4 today); embeddings run on llama.cpp, so those are a GGUF file.
      placeholder: SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16 @ e28c5f9
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings that matter
      description: >-
        Engine flags the model needs to be correct (quantization, dtype, context length; pooling for an
        embedding model), and the model name your client sends.
      placeholder: "--quantization gptq --dtype float16, name Qwen3.8-27B"
  - type: textarea
    id: purpose
    attributes:
      label: What it is for
      description: One or two sentences. Say if it must match vectors or outputs another host already produces.
    validations:
      required: true
